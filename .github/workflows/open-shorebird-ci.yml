  custom-dart-sdk-windows:
    name: Build custom Dart SDK (Windows x64)
    needs: source-checks
    runs-on: ${{ inputs.windows_heavy_runner || 'windows-2022' }}
    timeout-minutes: 180
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      MSYS: winsymlinks:nativestrict
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare native Windows build tools
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks true
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 C++ toolchain is required' }
          "GYP_MSVS_OVERRIDE_PATH=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name, $value = $matches[1], $matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and [Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
              }
            }
          }
          if ($LASTEXITCODE) { throw 'VsDevCmd failed' }
          if (!(Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\um\Windows.h")) {
            throw 'Windows SDK 10.0.26100.0 is required by Dart/Chromium'
          }

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap Windows depot_tools
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\depot_tools\bootstrap\win_tools.bat"
          if ($LASTEXITCODE) { throw 'depot_tools Windows bootstrap failed' }
          if (!(Test-Path "$env:GITHUB_WORKSPACE\depot_tools\git.bat")) {
            throw 'depot_tools bootstrap did not generate the required git.bat wrapper'
          }
          $pythonRelative = (Get-Content "$env:GITHUB_WORKSPACE\depot_tools\python3_bin_reldir.txt" -Raw).Trim()
          $pythonBin = Join-Path "$env:GITHUB_WORKSPACE\depot_tools" $pythonRelative
          if (!(Test-Path "$pythonBin\python3.exe")) {
            throw 'depot_tools bootstrap did not install native python3.exe for GN'
          }
          $pythonBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$pythonBin;$env:PATH"
          & "$pythonBin\python3.exe" -c "import shutil, subprocess; assert shutil.which('python3.exe'); subprocess.check_call(['git.bat', '--version'])"
          if ($LASTEXITCODE) { throw 'native Python cannot invoke the depot_tools Git wrapper' }

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$SDK_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        run: ./scripts/write_gclient.sh windows

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: Generate patched Dart SDK build files
        working-directory: dart-sdk
        run: |
          # tools/gn.py Main passes an empty environment to GN. Match the public
          # tools/build.py caller so GN inherits native Python and Visual Studio.
          python3 - <<'PYGN'
          import os
          import sys

          # gn.py locates DART_ROOT from argv[0] when imported by build.py.
          sys.argv[0] = 'tools/gn.py'
          sys.path.insert(0, 'tools')
          import gn

          options = gn.parse_args([
              'tools/gn.py', '--mode', 'release', '--arch', 'x64',
              '--gn-args=dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=true',
          ])
          if options is None:
              raise SystemExit('invalid Dart GN options')
          raise SystemExit(gn.RunGnOnConfiguredConfigurations(options, dict(os.environ)))
          PYGN

      - name: Verify patched Dart SDK args
        run: ./scripts/verify_dart_sdk_args.sh dart-sdk/out/ReleaseX64/args.gn

      - name: Build patched Dart SDK
        working-directory: dart-sdk
        run: |
          ninja -C out/ReleaseX64 create_sdk runtime gen_snapshot dartaotruntime

      - name: Verify built SDK developer tools
        run: python3 scripts/verify_dart_sdk_tooling.py --dart "$PWD/dart-sdk/out/ReleaseX64/dart-sdk/bin/dart.exe"

      - name: Run focused patch API tests
        working-directory: dart-sdk/out/ReleaseX64
        run: |
          ./run_vm_tests.exe DartAPI_AotPatchingConfiguration
          ./run_vm_tests.exe DartAPI_BytecodePatchReloadConfiguration
          ./run_vm_tests.exe DartAPI_SnapshotRegionSizes
          ./run_vm_tests.exe DartAPI_SnapshotRegionSizesRejectInvalidHeaders

      - name: Package Dart SDK artifact
        run: |
          mkdir -p artifacts/custom-dart-sdk-windows-x64
          cp -R dart-sdk/out/ReleaseX64/dart-sdk artifacts/custom-dart-sdk-windows-x64/
          cp dart-sdk/out/ReleaseX64/gen_snapshot.exe artifacts/custom-dart-sdk-windows-x64/
          cp dart-sdk/out/ReleaseX64/dartaotruntime.exe artifacts/custom-dart-sdk-windows-x64/
          cp dart-sdk/out/ReleaseX64/args.gn artifacts/custom-dart-sdk-windows-x64/
          dart_sdk_revision="$(git -C dart-sdk rev-parse HEAD)"
          cat > artifacts/custom-dart-sdk-windows-x64/manifest.json <<EOF
          {
            "name": "custom-dart-sdk-windows-x64",
            "git_sha": "${{ github.sha }}",
            "dart_sdk_git_sha": "${dart_sdk_revision}",
            "runner_os": "${{ runner.os }}",
            "dart_arch": "x64",
            "dart_build_dir": "dart-sdk/out/ReleaseX64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": true,
            "included": [
              "dart-sdk/",
              "gen_snapshot.exe",
              "dartaotruntime.exe",
              "args.gn"
            ]
          }
          EOF
          tar -C artifacts -czf custom-dart-sdk-windows-x64.tar.gz custom-dart-sdk-windows-x64
          sdk_extract_dir="$(mktemp -d)"
          tar -C "$sdk_extract_dir" -xzf custom-dart-sdk-windows-x64.tar.gz
          test -f "$sdk_extract_dir/custom-dart-sdk-windows-x64/manifest.json"
          test -f "$sdk_extract_dir/custom-dart-sdk-windows-x64/args.gn"
          test -x "$sdk_extract_dir/custom-dart-sdk-windows-x64/dart-sdk/bin/dart.exe"
          test -x "$sdk_extract_dir/custom-dart-sdk-windows-x64/gen_snapshot.exe"
          test -x "$sdk_extract_dir/custom-dart-sdk-windows-x64/dartaotruntime.exe"
          "$sdk_extract_dir/custom-dart-sdk-windows-x64/dart-sdk/bin/dart.exe" --version
          (
            cd dart-sdk/out/ReleaseX64
            python3 -m zipfile -c "$GITHUB_WORKSPACE/dart-sdk-windows-x64.zip" dart-sdk
          )
          release_sdk_extract_dir="$(mktemp -d)"
          unzip -q dart-sdk-windows-x64.zip -d "$release_sdk_extract_dir"
          test -x "$release_sdk_extract_dir/dart-sdk/bin/dart.exe"
          "$release_sdk_extract_dir/dart-sdk/bin/dart.exe" --version
          ./scripts/write_sha256.sh custom-dart-sdk-windows-x64.tar.gz custom-dart-sdk-windows-x64.tar.gz.sha256
          ./scripts/write_sha256.sh dart-sdk-windows-x64.zip dart-sdk-windows-x64.zip.sha256

      - name: Upload custom Dart SDK
        uses: actions/upload-artifact@v4
        with:
          name: custom-dart-sdk-windows-x64
          path: |
            custom-dart-sdk-windows-x64.tar.gz
            custom-dart-sdk-windows-x64.tar.gz.sha256
            dart-sdk-windows-x64.zip
            dart-sdk-windows-x64.zip.sha256
          if-no-files-found: error


  linux-engine:
    name: Build Linux engine artifacts
    needs: source-checks
    runs-on: ${{ inputs.linux_heavy_runner || 'ubuntu-latest' }}
    timeout-minutes: 240
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Free Ubuntu runner disk
        run: ./scripts/free_ci_disk_linux.sh

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Install Linux engine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            liblzma-dev \
            pkg-config

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
        run: ./scripts/write_gclient.sh linux

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Configure Linux engine
        working-directory: flutter/engine/src
        run: |
          ./flutter/tools/gn \
            --runtime-mode=release \
            --target-dir=linux_release_x64 \
            --no-prebuilt-dart-sdk \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false'

      - name: Build Linux engine
        working-directory: flutter/engine/src
        run: |
          ninja -C out/linux_release_x64 \
            flutter/shell/platform/linux:flutter_gtk \
            flutter/build/archives:flutter_patched_sdk \
            flutter/tools/font_subset:font_subset

      - name: Verify Linux engine args
        run: |
          ./scripts/verify_engine_args.sh \
            flutter/engine/src/out/linux_release_x64/args.gn \
            dart_dynamic_modules=false \
            dart_enable_aot_patching=true \
            dart_enable_shorebird_interpreter=false \
            shorebird_enable_aot_patching=true \
            shorebird_use_interpreter=false \
            flutter_prebuilt_dart_sdk=false

      - name: Package Linux engine artifacts
        run: |
          set -euo pipefail
          out=flutter/engine/src/out/linux_release_x64
          mkdir -p artifacts/linux-engine

          gtk_zip="$(find "$out/zip_archives" -name 'linux-x64-flutter-gtk.zip' -type f -print -quit)"
          patched_sdk_zip="$(find "$out/zip_archives" -name 'flutter_patched_sdk_product.zip' -type f -print -quit)"
          artifacts_zip="$(find "$out/zip_archives" -path '*/linux-x64-release/artifacts.zip' -type f -print -quit)"
          if [ -z "$artifacts_zip" ]; then
            test -x "$out/gen_snapshot"
            artifacts_zip="$out/zip_archives/linux-x64-release/artifacts.zip"
            mkdir -p "$(dirname "$artifacts_zip")"
            python3 - "$out/gen_snapshot" "$artifacts_zip" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          info = zipfile.ZipInfo('gen_snapshot')
          info.external_attr = (source.stat().st_mode & 0xFFFF) << 16
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.writestr(info, source.read_bytes(), zipfile.ZIP_DEFLATED)
          PY
          fi
          test -n "$gtk_zip"
          test -n "$patched_sdk_zip"
          test -n "$artifacts_zip"

          engine_symbol_dir="$(mktemp -d)"
          unzip -q "$gtk_zip" -d "$engine_symbol_dir"
          engine_library="$(find "$engine_symbol_dir" -type f -name libflutter_linux_gtk.so -print -quit)"
          test -n "$engine_library"
          readelf --wide --dyn-syms "$engine_library" | awk '
            $5 == "GLOBAL" && $6 == "DEFAULT" && $7 != "UND" &&
                $8 == "shorebird_set_patch_decryption_key_provider" { found = 1 }
            END { if (!found) { print "missing exported patch decryption key provider" > "/dev/stderr"; exit 1 } }
          '
          cp "$gtk_zip" artifacts/linux-engine/
          cp "$patched_sdk_zip" artifacts/linux-engine/
          cp "$artifacts_zip" artifacts/linux-engine/artifacts.zip
          cp "$out/args.gn" artifacts/linux-engine/linux_release_x64.args.gn

          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision"
          mkdir -p "$mirror_root/linux-x64-release"
          cp "$gtk_zip" "$mirror_root/linux-x64-release/linux-x64-flutter-gtk.zip"
          cp "$artifacts_zip" "$mirror_root/linux-x64-release/artifacts.zip"
          cp "$patched_sdk_zip" "$mirror_root/flutter_patched_sdk_product.zip"
          test -f "$mirror_root/linux-x64-release/linux-x64-flutter-gtk.zip"
          test -f "$mirror_root/linux-x64-release/artifacts.zip"
          test -f "$mirror_root/flutter_patched_sdk_product.zip"
          font_zip="$out/zip_archives/linux-x64/font-subset.zip"
          cp "$font_zip" artifacts/linux-engine/font-subset.zip
          mkdir -p "$mirror_root/linux-x64"
          cp "$font_zip" "$mirror_root/linux-x64/font-subset.zip"
          test -f "$mirror_root/linux-x64/font-subset.zip"
          font_smoke_dir="$(mktemp -d)"
          font_dart="$(find "$out" -maxdepth 3 -type f -name dartvm -print -quit)"
          test -n "$font_dart"
          python3 - artifacts/linux-engine/font-subset.zip "$font_smoke_dir" "$font_dart" <<'PYFONT'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import zipfile

          archive_path, work, dart = map(Path, sys.argv[1:])
          executable = "font-subset.exe" if os.name == "nt" else "font-subset"
          with zipfile.ZipFile(archive_path) as archive:
              for name in (executable, "const_finder.dart.snapshot"):
                  if archive.getinfo(name).file_size == 0:
                      raise SystemExit(f"empty font tool: {name}")
              archive.extractall(work)
          binary = work / executable
          binary.chmod(0o755)
          source_font = Path("flutter/engine/src/flutter/txt/third_party/fonts/Roboto-Regular.ttf").resolve()
          output_font = (work / "subset.ttf").resolve()
          subprocess.run([str(binary.resolve()), str(output_font), str(source_font)],
                         input="65 66\n", text=True, check=True)
          if not 0 < output_font.stat().st_size < source_font.stat().st_size:
              raise SystemExit("font subset did not produce a smaller non-empty font")
          subprocess.run([str(dart.resolve()), str((work / "const_finder.dart.snapshot").resolve()),
                          "--kernel-file=unused.dill", "--class-library-uri=package:unused", "--class-name=Unused", "--help"],
                         check=True, stdout=subprocess.DEVNULL)
          PYFONT
          cat > artifacts/linux-engine/manifest.json <<EOF
          {
            "name": "linux-engine-x64",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "engine_revision": "${engine_revision}",
            "linux_build_dir": "flutter/engine/src/out/linux_release_x64",
            "runtime_mode": "release",
            "target_os": "linux",
            "target_arch": "x64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": false,
            "shorebird_enable_aot_patching": true,
            "shorebird_interpreter": false,
            "included": [
              "font-subset.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/linux-x64/font-subset.zip",
              "linux-x64-flutter-gtk.zip",
              "flutter_patched_sdk_product.zip",
              "artifacts.zip",
              "linux_release_x64.args.gn",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/linux-x64-release/linux-x64-flutter-gtk.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/linux-x64-release/artifacts.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/flutter_patched_sdk_product.zip"
            ]
          }
          EOF
          tar -C artifacts -czf linux-engine-x64.tar.gz linux-engine
          engine_extract_dir="$(mktemp -d)"
          tar -C "$engine_extract_dir" -xzf linux-engine-x64.tar.gz
          test -f "$engine_extract_dir/linux-engine/manifest.json"
          test -f "$engine_extract_dir/linux-engine/font-subset.zip"
          test -f "$engine_extract_dir/linux-engine/linux_release_x64.args.gn"
          test -f "$engine_extract_dir/linux-engine/linux-x64-flutter-gtk.zip"
          test -f "$engine_extract_dir/linux-engine/flutter_patched_sdk_product.zip"
          test -f "$engine_extract_dir/linux-engine/artifacts.zip"
          test -f "$engine_extract_dir/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/linux-x64-release/linux-x64-flutter-gtk.zip"
          test -f "$engine_extract_dir/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/linux-x64-release/artifacts.zip"
          test -f "$engine_extract_dir/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/flutter_patched_sdk_product.zip"
          ./scripts/write_sha256.sh linux-engine-x64.tar.gz linux-engine-x64.tar.gz.sha256

      - name: Upload Linux engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-engine-x64
          path: |
            linux-engine-x64.tar.gz
            linux-engine-x64.tar.gz.sha256
          if-no-files-found: error

  android-engine:
    name: Build Android engine artifacts
    needs: source-checks
    runs-on: ${{ inputs.linux_heavy_runner || 'ubuntu-latest' }}
    timeout-minutes: 240
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-linux-android
            jar: arm64_v8a_release.jar
            maven_artifact: arm64_v8a_release
          - arch: arm
            rust_target: armv7-linux-androideabi
            jar: armeabi_v7a_release.jar
            maven_artifact: armeabi_v7a_release
          - arch: x64
            rust_target: x86_64-linux-android
            jar: x86_64_release.jar
            maven_artifact: x86_64_release
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Free Ubuntu runner disk
        run: ./scripts/free_ci_disk_linux.sh

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
        run: ./scripts/write_gclient.sh linux

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Configure Android engine
        working-directory: flutter/engine/src
        run: |
          ./flutter/tools/gn \
            --android \
            --runtime-mode=release \
            --android-cpu=${{ matrix.arch }} \
            --target-dir=android_release_${{ matrix.arch }} \
            --no-prebuilt-dart-sdk \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false'

      - name: Build Android engine
        working-directory: flutter/engine/src
        run: |
          ninja -C out/android_release_${{ matrix.arch }} \
            flutter/shell/platform/android:flutter_jar_zip \
            flutter/shell/platform/android:android_jar \
            flutter/shell/platform/android:android_symbols \
            flutter/shell/platform/android:gen_snapshot
          if [[ "${{ matrix.arch }}" != arm ]]; then
            ninja -C out/android_release_${{ matrix.arch }} flutter/shell/platform/android:analyze_snapshot
          fi

      - name: Verify Android engine args
        run: |
          ./scripts/verify_engine_args.sh \
            flutter/engine/src/out/android_release_${{ matrix.arch }}/args.gn \
            dart_dynamic_modules=false \
            dart_enable_aot_patching=true \
            dart_enable_shorebird_interpreter=false \
            shorebird_enable_aot_patching=true \
            shorebird_use_interpreter=false \
            flutter_prebuilt_dart_sdk=false

      - name: Package Android engine artifacts
        run: |
          set -euo pipefail
          out=flutter/engine/src/out/android_release_${{ matrix.arch }}
          mkdir -p artifacts/android-engine

          cp "$out/args.gn" artifacts/android-engine/android_release_${{ matrix.arch }}.args.gn
          cp "$out/zip_archives/android-${{ matrix.arch }}-release/artifacts.zip" artifacts/android-engine/
          cp flutter/engine/src/flutter/shell/common/shorebird/shorebird_patch_encryption.h artifacts/android-engine/
          python3 - artifacts/android-engine/artifacts.zip artifacts/android-engine/shorebird_patch_encryption.h <<'PYHEADER'
          from pathlib import Path
          import sys
          import zipfile

          archive_path, header_path = map(Path, sys.argv[1:])
          header_name = "shorebird_patch_encryption.h"
          expected = header_path.read_bytes()
          if not expected:
              raise SystemExit("canonical patch encryption header is empty")
          with zipfile.ZipFile(archive_path, "a", zipfile.ZIP_DEFLATED) as archive:
              matches = [info for info in archive.infolist() if info.filename == header_name]
              if matches:
                  if len(matches) != 1 or archive.read(header_name) != expected:
                      raise SystemExit("conflicting patch encryption header in Android artifacts.zip")
              else:
                  archive.write(header_path, header_name)
          PYHEADER
          cp "$out/zip_archives/android-${{ matrix.arch }}-release/symbols.zip" artifacts/android-engine/
          cp "$out/flutter.jar" artifacts/android-engine/
          cp "$out/libflutter.so" artifacts/android-engine/
          if [ -f "$out/${{ matrix.jar }}" ]; then
            cp "$out/${{ matrix.jar }}" artifacts/android-engine/
          fi

          gen_snapshot=""
          for candidate in "$out/gen_snapshot_${{ matrix.arch }}" "$out/clang_x64/gen_snapshot" "$out/universal/gen_snapshot"; do
            if [ -f "$candidate" ]; then
              gen_snapshot="$candidate"
              break
            fi
          done
          if [ -z "$gen_snapshot" ]; then
            echo "missing Android gen_snapshot tool under $out" >&2
            find "$out" -maxdepth 3 -type f -name 'gen_snapshot*' -print >&2
            exit 66
          fi

          cp "$gen_snapshot" artifacts/android-engine/gen_snapshot_${{ matrix.arch }}
          analyze_snapshot_manifest=""
          if [[ "${{ matrix.arch }}" != arm ]]; then
            analyze_snapshot=""
            for candidate in "$out/analyze_snapshot_${{ matrix.arch }}" "$out/clang_x64/analyze_snapshot" "$out/universal/analyze_snapshot"; do
              if [ -f "$candidate" ]; then
                analyze_snapshot="$candidate"
                break
              fi
            done
            if [ -z "$analyze_snapshot" ]; then
              echo "missing Android analyze_snapshot tool under $out" >&2
              find "$out" -maxdepth 3 -type f -name 'analyze_snapshot*' -print >&2
              exit 66
            fi
            cp "$analyze_snapshot" artifacts/android-engine/analyze_snapshot_${{ matrix.arch }}
            analyze_snapshot_manifest='"analyze_snapshot_${{ matrix.arch }}",'
          fi

          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/android-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/android-${{ matrix.arch }}-release"
          mkdir -p "$mirror_root"
          cp artifacts/android-engine/artifacts.zip "$mirror_root/artifacts.zip"
          cp "$out/zip_archives/android-${{ matrix.arch }}-release/symbols.zip" "$mirror_root/symbols.zip"
          test -f "$mirror_root/artifacts.zip"
          test -f "$mirror_root/symbols.zip"
          cp "$out/zip_archives/android-${{ matrix.arch }}-release/linux-x64.zip" "$mirror_root/linux-x64.zip"
          test -f "$mirror_root/linux-x64.zip"

          maven_args=()
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            maven_args+=(--include-embedding)
          fi
          python3 scripts/package_android_maven.py \
            --out-dir "$out" \
            --mirror-root artifacts/android-engine/mirror/shorebird \
            --engine-revision "$engine_revision" \
            --artifact "${{ matrix.maven_artifact }}" "${maven_args[@]}"

          cat > artifacts/android-engine/manifest.json <<EOF
          {
            "name": "android-engine-${{ matrix.arch }}",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "engine_revision": "${engine_revision}",
            "android_build_dir": "flutter/engine/src/out/android_release_${{ matrix.arch }}",
            "runtime_mode": "release",
            "target_os": "android",
            "target_arch": "${{ matrix.arch }}",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": false,
            "shorebird_enable_aot_patching": true,
            "shorebird_interpreter": false,
            "included": [
              "artifacts.zip",
              "symbols.zip",
              "flutter.jar",
              "libflutter.so",
              "shorebird_patch_encryption.h",
              "gen_snapshot_${{ matrix.arch }}",
              ${analyze_snapshot_manifest}
              "android_release_${{ matrix.arch }}.args.gn",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/android-${{ matrix.arch }}-release/artifacts.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/android-${{ matrix.arch }}-release/symbols.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/android-${{ matrix.arch }}-release/linux-x64.zip"
            ]
          }
          EOF
          tar -C artifacts -czf android-engine-${{ matrix.arch }}.tar.gz android-engine
          engine_extract_dir="$(mktemp -d)"
          tar -C "$engine_extract_dir" -xzf android-engine-${{ matrix.arch }}.tar.gz
          test -f "$engine_extract_dir/android-engine/manifest.json"
          test -f "$engine_extract_dir/android-engine/android_release_${{ matrix.arch }}.args.gn"
          test -f "$engine_extract_dir/android-engine/artifacts.zip"
          test -f "$engine_extract_dir/android-engine/symbols.zip"
          test -f "$engine_extract_dir/android-engine/flutter.jar"
          test -f "$engine_extract_dir/android-engine/shorebird_patch_encryption.h"
          test -f "$engine_extract_dir/android-engine/libflutter.so"
          engine_library="$engine_extract_dir/android-engine/libflutter.so"
          readelf --wide --dyn-syms "$engine_library" | awk '
            $5 == "GLOBAL" && $6 == "DEFAULT" && $7 != "UND" &&
                $8 == "shorebird_set_patch_decryption_key_provider" { found = 1 }
            END { if (!found) { print "missing exported patch decryption key provider" > "/dev/stderr"; exit 1 } }
          '
          test -f "$engine_extract_dir/android-engine/gen_snapshot_${{ matrix.arch }}"
          "$engine_extract_dir/android-engine/gen_snapshot_${{ matrix.arch }}" --version
          if [[ "${{ matrix.arch }}" != arm ]]; then
            test -f "$engine_extract_dir/android-engine/analyze_snapshot_${{ matrix.arch }}"
          fi
          test -f "$engine_extract_dir/android-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/android-${{ matrix.arch }}-release/artifacts.zip"
          test -f "$engine_extract_dir/android-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/android-${{ matrix.arch }}-release/symbols.zip"
          python3 - "$engine_extract_dir/android-engine" <<'PYHEADER'
          from pathlib import Path
          import sys
          import zipfile

          root = Path(sys.argv[1])
          expected = (root / "shorebird_patch_encryption.h").read_bytes()
          with zipfile.ZipFile(root / "artifacts.zip") as archive:
              if archive.read("shorebird_patch_encryption.h") != expected:
                  raise SystemExit("Android archive lost the canonical patch encryption header")
          PYHEADER
          ./scripts/write_sha256.sh android-engine-${{ matrix.arch }}.tar.gz android-engine-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload Android engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-engine-${{ matrix.arch }}
          path: |
            android-engine-${{ matrix.arch }}.tar.gz
            android-engine-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  web-sdk:
    name: Build web SDK artifact
    needs: [source-checks, custom-dart-sdk]
