name: Open Shorebird CI

concurrency:
  group: open-shorebird-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_sdk_build:
        description: Build custom SDK and engine artifacts during manual dispatch.
        required: false
        default: true
        type: boolean
      run_gclient_sync:
        description: Run gclient sync before heavy SDK/engine builds.
        required: false
        default: true
        type: boolean
      base_flutter_engine_revision:
        description: Optional upstream Flutter engine revision for artifact proxy fallback metadata.
        required: false
        default: ""
        type: string
      linux_heavy_runner:
        description: Runner label for Linux SDK/Android/web heavy jobs.
        required: false
        default: ubuntu-latest
        type: string
      macos_heavy_runner:
        description: Runner label for macOS SDK and Apple engine heavy jobs.
        required: false
        default: macos-15
        type: string
      macos_x64_heavy_runner:
        description: Runner label for macOS x64 SDK and engine heavy jobs.
        required: false
        default: macos-15-intel
        type: string
      windows_heavy_runner:
        description: Runner label for Windows x64 SDK and engine heavy jobs.
        required: false
        default: windows-2022
        type: string
      sdk_min_free_disk_gb:
        description: Minimum free disk GiB required before SDK-only heavy jobs.
        required: false
        default: 8
        type: number
      engine_min_free_disk_gb:
        description: Minimum free disk GiB required before engine heavy jobs.
        required: false
        default: 8
        type: number
      run_runtime_smokes:
        description: Run Android/Linux runtime patch smokes on provisioned runners.
        required: false
        default: false
        type: boolean
      run_unsupported_web_build:
        description: Manually run the experimental web recipe (not part of supported-platform CI).
        required: false
        default: false
        type: boolean
      linux_runtime_runner:
        description: Runner label for the Linux runtime smoke job.
        required: false
        default: self-hosted
        type: string
      android_runtime_runner:
        description: Runner label for the Android runtime smoke job.
        required: false
        default: self-hosted
        type: string
      android_serial:
        description: Optional adb serial for the Android runtime smoke target.
        required: false
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  COPYFILE_DISABLE: "1"
  SHOREBIRD_UPSTREAM_REVISION: 5f04c3ace43b02d0fec7c19b99c88a85989c704f
  DART_SDK_CHANNEL: stable
  GO_VERSION: "1.26.10"
  JAVA_VERSION: "17"
  DEPOT_TOOLS_UPDATE: "0"
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  BASE_FLUTTER_ENGINE_REVISION: ${{ inputs.base_flutter_engine_revision || 'cf636b1dfb818dd6a3ff16e390e93b1a036969c8' }}
  SDK_MIN_FREE_DISK_GB: ${{ inputs.sdk_min_free_disk_gb || 8 }}
  ENGINE_MIN_FREE_DISK_GB: ${{ inputs.engine_min_free_disk_gb || 8 }}

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify upstream source and version
        run: |
          set -euo pipefail
          release_version="$(tr -d '[:space:]' < VERSION)"
          cli_version="$(sed -n 's/^version: //p' shorebird/packages/shorebird_cli/pubspec.yaml)"
          test -n "$release_version"
          test "$cli_version" = "$release_version"
          # Upstream main can advance its version before creating a release tag.
          # Verify the exact merged source instead of requiring that future tag.
          git -C shorebird merge-base --is-ancestor "$SHOREBIRD_UPSTREAM_REVISION" HEAD

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_CHANNEL }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: shorebird-server/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('shorebird/pubspec.lock', 'shorebird/**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Run source-level workspace checks
        env:
          SKIP_GCLIENT_SYNC: "1"
        run: ./scripts/bootstrap_linux.sh

      - name: Set up Java for variant authorization controls
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android API for variant authorization controls
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platforms;android-35"

      - name: Verify variant fixture source contracts
        run: |
          set -euo pipefail
          export ANDROID_VARIANT_ANDROID_JAR="${ANDROID_HOME:?}/platforms/android-35/android.jar"
          export ANDROID_VARIANT_JSON_JAR="${RUNNER_TEMP:?}/native-variant-host-java/json-20180813.jar"
          test -s "$ANDROID_VARIANT_ANDROID_JAR"
          test -x "${JAVA_HOME:?}/bin/javac"
          test -x "$JAVA_HOME/bin/java"
          mkdir -p "$(dirname "$ANDROID_VARIANT_JSON_JAR")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$ANDROID_VARIANT_JSON_JAR" \
            https://repo.maven.apache.org/maven2/org/json/json/20180813/json-20180813.jar
          printf '%s  %s\n' 518080049ba83181914419d11a25d9bc9833a2d729b6a6e7469fa52851356da8 "$ANDROID_VARIANT_JSON_JAR" | sha256sum --check --strict
          python3 -m py_compile testapps/license_flavor_patch_test/tool/macos_variant_e2e.py testapps/license_flavor_patch_test/tool/macos_variant_lifecycle.py
          python3 -m py_compile testapps/license_flavor_patch_test/tool/ios_variant_e2e.py testapps/license_flavor_patch_test/tool/ios_variant_adversarial.py
          python3 -m py_compile testapps/license_flavor_patch_test/tool/android_variant_app.py testapps/license_flavor_patch_test/tool/android_variant_e2e.py
          python3 -m py_compile testapps/license_flavor_patch_test/tool/native_variant_e2e.py testapps/license_flavor_patch_test/tool/native_variant_adversarial.py testapps/license_flavor_patch_test/tool/native_variant_desktop.py testapps/license_flavor_patch_test/tool/linux_variant_e2e.py testapps/license_flavor_patch_test/tool/windows_variant_e2e.py
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_macos_variant_e2e.py -v
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_macos_variant_lifecycle.py -v
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_ios_variant_e2e.py -v
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_ios_variant_adversarial.py -v
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_android_variant_app.py -v
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_android_variant_e2e.py -v
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p native_variant_test.py -v

      - name: Verify CI scripts
        run: |
          bash -n scripts/*.sh shorebird/third_party/flutter/bin/internal/shared.sh flutter/bin/internal/update_dart_sdk.sh
          python3 -m py_compile scripts/verify_native_desktop_arch.py scripts/test_native_desktop_arch.py
          python3 scripts/test_native_desktop_arch.py -v
          python3 scripts/test_write_gclient.py -v
          python3 scripts/test_build_rust_updater.py -v
          python3 -m py_compile scripts/prepare_flutter_version_tag.py scripts/test_prepare_flutter_version_tag.py
          python3 scripts/test_prepare_flutter_version_tag.py -v
          python3 scripts/test_ci_arm64_contract.py -v
          python3 -m py_compile scripts/validate_artifact_mirror.py
          python3 -m py_compile scripts/validate_release_manifest.py
          python3 -m py_compile scripts/safe_extract_tar.py
          python3 -m py_compile scripts/write_artifact_manifest.py
          python3 -m py_compile scripts/write_cli_toolchain_pins.py scripts/test_cli_toolchain_pins.py
          python3 scripts/test_cli_toolchain_pins.py -v
          python3 -m py_compile scripts/verify_dart_sdk_tooling.py
          python3 -m py_compile scripts/verify_native_cache_engine_tests.py scripts/verify_macos_interpreter_engine_tests.py
          python3 scripts/test_macos_interpreter_engine_tests.py -v
          python3 scripts/verify_native_cache_engine_tests.py --self-test
          python3 -m py_compile dart-sdk/tools/test_aot_structural_patch.py
          python3 -m py_compile dart-sdk/tools/test_aot_full_replacement.py
          python3 -m py_compile dart-sdk/tools/test_aot_no_tfa_startup.py
          python3 -m py_compile dart-sdk/tools/test_aot_product_metadata.py
          python3 -m py_compile dart-sdk/tools/test_aot_host_resolvers.py
          python3 -m py_compile dart-sdk/tools/test_interpreter_ffi_calls.py
          python3 -m py_compile dart-sdk/tools/test_aot_product_ffi.py
          python3 -m py_compile dart-sdk/tools/test_aot_product_ffi_callbacks.py
          python3 -m py_compile dart-sdk/tools/test_aot_full_replacement_ffi.py
          python3 dart-sdk/tools/test_aot_full_replacement_ffi_signing_test.py -v
          python3 -m py_compile testapps/license_flavor_patch_test/tool/ios_device_e2e.py
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_ios_device_e2e.py -v
          python3 -m py_compile testapps/license_flavor_patch_test/tool/macos_interpreter_e2e.py testapps/license_flavor_patch_test/tool/test_macos_interpreter_e2e.py
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_macos_interpreter_e2e.py -v
          python3 -m py_compile testapps/license_flavor_patch_test/tool/windows_native_cache_e2e.py
          python3 -m py_compile testapps/license_flavor_patch_test/tool/linux_native_cache_e2e.py
          python3 -m py_compile testapps/license_flavor_patch_test/tool/android_native_app.py
          python3 -m py_compile testapps/license_flavor_patch_test/tool/android_native_cache_e2e.py
          python3 -m py_compile testapps/license_flavor_patch_test/tool/owned_host_processes.py
          python3 -m py_compile testapps/license_flavor_patch_test/tool/android_native/compile_check.py
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_android_native_cache_e2e.py -v
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_android_native_app.py -v
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_owned_host_processes.py -v
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_linux_native_cache_e2e.py -v
          python3 -m unittest discover -s testapps/license_flavor_patch_test/tool -p test_windows_native_cache_e2e.py -v
          python3 -m py_compile scripts/package_android_maven.py
          python3 scripts/verify_android_maven.py
          python3 -m py_compile scripts/write_release_manifest.py
          python3 -m py_compile scripts/write_sha256.py
          python3 - <<'PY'
          from pathlib import Path

          compile(Path('flutter/DEPS').read_text(encoding='utf-8'), 'flutter/DEPS', 'exec')
          PY
          ./scripts/verify_ci_capacity.sh
          ./scripts/verify_dart_tool_sdk_validator.sh
          ./scripts/verify_open_infrastructure_defaults.sh
          ./scripts/verify_sync_open_sources.sh
          ./scripts/verify_powershell_open_defaults.sh
          ./scripts/verify_write_sha256.sh
          ./scripts/verify_release_manifest.sh
          ./scripts/verify_artifact_mirror_validator.sh
          ./scripts/verify_assemble_artifact_mirror.sh
          ./scripts/verify_artifact_mirror_workflow_assembly.sh
          ./scripts/verify_hosted_full_sdk_build.sh --help >/dev/null 2>&1
          ./scripts/verify_ios_interpreter_route_validator.sh
          ./scripts/verify_ci_workflow.sh

  cli-artifacts:
    name: Build CLI artifacts
    needs: source-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            artifact_os: linux
            artifact_arch: arm64
            extension: ""
            patch_zip: patch-linux-arm64.zip
            patch_entry: patch
            rust_target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            artifact_os: linux
            artifact_arch: x64
            extension: ""
            patch_zip: patch-linux-x64.zip
            patch_entry: patch
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            artifact_os: macos
            artifact_arch: x64
            extension: ""
            patch_zip: patch-darwin-x64.zip
            patch_entry: patch
            rust_target: x86_64-apple-darwin
          - os: macos-15
            artifact_os: macos
            artifact_arch: arm64
            extension: ""
            patch_zip: patch-darwin-arm64.zip
            patch_entry: patch
            rust_target: aarch64-apple-darwin
          - os: windows-11-arm
            artifact_os: windows
            artifact_arch: arm64
            extension: ".exe"
            patch_zip: patch-windows-arm64.zip
            patch_entry: patch.exe
            rust_target: aarch64-pc-windows-msvc
          - os: windows-latest
            artifact_os: windows
            artifact_arch: x64
            extension: ".exe"
            patch_zip: patch-windows-x64.zip
            patch_entry: patch.exe
            rust_target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_CHANNEL }}
          architecture: ${{ matrix.artifact_arch }}

      - name: Set up desktop verifier Python
        if: ${{ matrix.artifact_os == 'linux' || matrix.artifact_os == 'windows' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.artifact_arch }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install explicit host patch tool Rust target
        run: rustup target add '${{ matrix.rust_target }}'

      - name: Verify Rust
        run: |
          rustc --version
          cargo --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shorebird/pubspec.lock', 'shorebird/**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Test native mapping build integration
        env:
          FLUTTER_ROOT: ${{ github.workspace }}/flutter
        run: |
          set -euo pipefail
          results="$PWD/artifacts/native-mapping-build-tests"
          mkdir -p "$results"
          cd flutter/packages/flutter_tools
          {
            dart pub get
            dart test --reporter expanded \
              test/general.shard/shorebird/shorebird_native_assets_test.dart \
              test/general.shard/shorebird/shorebird_interpreter_test.dart \
              test/general.shard/shorebird/shorebird_replacement_host_test.dart \
              test/general.shard/shorebird/shorebird_build_key_test.dart \
              test/general.shard/build_system/targets/assets_test.dart \
              test/general.shard/build_system/targets/common_test.dart \
              test/general.shard/build_system/targets/macos_test.dart \
              test/general.shard/compile_batch_test.dart \
              test/commands.shard/hermetic/build_macos_test.dart
          } 2>&1 | tee "$results/tests.log"

      - name: Upload native mapping build test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mapping-build-tests-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
          path: artifacts/native-mapping-build-tests/tests.log
          if-no-files-found: error

      - name: Test native archive guards
        shell: bash
        run: ./scripts/run_native_archive_tests.sh

      - name: Upload native archive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-archive-tests-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
          path: artifacts/cli-native-archive-tests/tests.log
          if-no-files-found: error

      - name: Compile Shorebird CLI and open patch tools
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/cli
          mkdir -p artifacts/cli/bin/internal
          python3 scripts/write_cli_toolchain_pins.py write --workspace "$PWD" --package artifacts/cli
          cd shorebird
          dart pub get
          dart compile exe packages/shorebird_cli/bin/shorebird.dart \
            -o ../artifacts/cli/bin/shorebird${{ matrix.extension }}
          dart compile exe packages/open_aot_patch_tools/bin/open_aot_patch_tools.dart \
            -o ../artifacts/cli/bin/open_aot_patch_tools${{ matrix.extension }}
          dart compile exe packages/artifact_proxy/bin/server.dart \
            -o ../artifacts/cli/bin/artifact_proxy${{ matrix.extension }}
          cd ..
          flutter_revision="$(cat artifacts/cli/bin/internal/flutter.version)"
          engine_revision="$(cat artifacts/cli/bin/internal/engine.version)"
          cat > artifacts/cli/manifest.json <<EOF
          {
            "name": "open-shorebird-cli-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "flutter_revision": "${flutter_revision}",
            "engine_revision": "${engine_revision}",
            "target_os": "${{ matrix.artifact_os }}",
            "target_arch": "${{ matrix.artifact_arch }}",
            "included": [
              "bin/shorebird${{ matrix.extension }}",
              "bin/open_aot_patch_tools${{ matrix.extension }}",
              "bin/artifact_proxy${{ matrix.extension }}",
              "bin/internal/flutter.version",
              "bin/internal/engine.version"
            ]
          }
          EOF
          mkdir -p artifacts/cli-home
          HOME="$PWD/artifacts/cli-home" artifacts/cli/bin/open_aot_patch_tools${{ matrix.extension }} --help >/dev/null
          version_output="$(HOME="$PWD/artifacts/cli-home" artifacts/cli/bin/shorebird${{ matrix.extension }} --version)"
          printf '%s\n' "$version_output"
          grep -q 'https://github.com/tony-cloud/shorebird.git' <<<"$version_output"
          if grep -q 'git@github.com:shorebirdtech/shorebird.git' <<<"$version_output"; then
            echo "compiled CLI still reports the official Shorebird SSH remote" >&2
            exit 1
          fi
          HOME="$PWD/artifacts/cli-home" artifacts/cli/bin/artifact_proxy${{ matrix.extension }} --health-check
          python3 scripts/write_cli_toolchain_pins.py verify --workspace "$PWD" --package artifacts/cli
          tar -C artifacts/cli -czf open-shorebird-cli-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz .
          cli_extract_dir="$(mktemp -d)"
          mkdir -p artifacts/cli-extracted-home
          tar -C "$cli_extract_dir" -xzf open-shorebird-cli-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz
          test -f "$cli_extract_dir/manifest.json"
          test -f "$cli_extract_dir/bin/internal/flutter.version"
          test -f "$cli_extract_dir/bin/internal/engine.version"
          python3 scripts/write_cli_toolchain_pins.py verify --workspace "$PWD" --package "$cli_extract_dir"
          HOME="$PWD/artifacts/cli-extracted-home" "$cli_extract_dir/bin/open_aot_patch_tools${{ matrix.extension }}" --help >/dev/null
          extracted_version_output="$(HOME="$PWD/artifacts/cli-extracted-home" "$cli_extract_dir/bin/shorebird${{ matrix.extension }}" --version)"
          printf '%s\n' "$extracted_version_output"
          grep -q 'https://github.com/tony-cloud/shorebird.git' <<<"$extracted_version_output"
          if grep -q 'git@github.com:shorebirdtech/shorebird.git' <<<"$extracted_version_output"; then
            echo "extracted CLI still reports the official Shorebird SSH remote" >&2
            exit 1
          fi
          HOME="$PWD/artifacts/cli-extracted-home" "$cli_extract_dir/bin/artifact_proxy${{ matrix.extension }}" --health-check
          ./scripts/write_sha256.sh \
            open-shorebird-cli-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz \
            open-shorebird-cli-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz.sha256

      - name: Verify native desktop CLI machine types
        if: ${{ matrix.artifact_os == 'linux' || matrix.artifact_os == 'windows' }}
        run: |
          python scripts/verify_native_desktop_arch.py --require-native-host \
            --platform '${{ matrix.artifact_os }}' --arch '${{ matrix.artifact_arch }}' \
            --binary 'artifacts/cli/bin/shorebird${{ matrix.extension }}' \
            --binary 'artifacts/cli/bin/open_aot_patch_tools${{ matrix.extension }}' \
            --binary 'artifacts/cli/bin/artifact_proxy${{ matrix.extension }}'

      - name: Build mirror patch artifact
        shell: bash
        run: |
          set -euo pipefail
          cargo_target_dir="$PWD/artifacts/cargo-target/${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}"
          CARGO_TARGET_DIR="$cargo_target_dir" \
            cargo build --release --manifest-path updater/patch/Cargo.toml --bin patch --target "${{ matrix.rust_target }}"

          mkdir -p artifacts/mirror
          patch_binary="$cargo_target_dir/${{ matrix.rust_target }}/release/patch${{ matrix.extension }}"
          if [[ '${{ matrix.artifact_os }}' == linux || '${{ matrix.artifact_os }}' == windows ]]; then
            python scripts/verify_native_desktop_arch.py --require-native-host \
              --platform '${{ matrix.artifact_os }}' --arch '${{ matrix.artifact_arch }}' --binary "$patch_binary"
          fi
          cp "$patch_binary" "artifacts/mirror/${{ matrix.patch_entry }}"

          python_bin=python3
          if ! command -v "$python_bin" >/dev/null 2>&1; then
            python_bin=python
          fi
          "$python_bin" - \
            "artifacts/mirror/${{ matrix.patch_zip }}" \
            "artifacts/mirror/${{ matrix.patch_entry }}" \
            "${{ matrix.patch_entry }}" <<'PY'
          import sys
          import zipfile

          zip_path, input_path, archive_name = sys.argv[1:]
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write(input_path, archive_name)
          PY
          "$python_bin" - \
            "artifacts/mirror/${{ matrix.patch_zip }}" \
            "${{ matrix.patch_entry }}" <<'PY'
          import sys
          import zipfile

          zip_path, expected_entry = sys.argv[1:]
          with zipfile.ZipFile(zip_path) as archive:
              names = archive.namelist()
              if names != [expected_entry]:
                  raise SystemExit(
                      f"expected only {expected_entry!r} in {zip_path}, got {names!r}"
                  )
              info = archive.getinfo(expected_entry)
              if info.file_size <= 0:
                  raise SystemExit(f"{expected_entry} in {zip_path} is empty")
          PY
          ./scripts/write_sha256.sh \
            "artifacts/mirror/${{ matrix.patch_zip }}" \
            "artifacts/mirror/${{ matrix.patch_zip }}.sha256"
          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_patch_dir="artifacts/mirror/shorebird/$engine_revision"
          mkdir -p "$mirror_patch_dir"
          cp "artifacts/mirror/${{ matrix.patch_zip }}" "$mirror_patch_dir/${{ matrix.patch_zip }}"
          cp "artifacts/mirror/${{ matrix.patch_zip }}.sha256" "$mirror_patch_dir/${{ matrix.patch_zip }}.sha256"
          test -f "$mirror_patch_dir/${{ matrix.patch_zip }}"
          test -f "$mirror_patch_dir/${{ matrix.patch_zip }}.sha256"

      - name: Build mirror metadata
        if: ${{ matrix.artifact_os == 'linux' && matrix.artifact_arch == 'x64' }}
        shell: bash
        run: |
          set -euo pipefail
          engine_revision="$(cat flutter/bin/internal/engine.version)"
          base_engine_revision="${BASE_FLUTTER_ENGINE_REVISION:-$engine_revision}"
          manifest_path="artifacts/mirror/shorebird/$engine_revision/artifacts_manifest.yaml"
          python3 scripts/write_artifact_manifest.py \
            --flutter-engine-revision "$base_engine_revision" \
            --output "$manifest_path"
          ./scripts/write_sha256.sh "$manifest_path" "$manifest_path.sha256"
          test -f "artifacts/mirror/shorebird/$engine_revision/artifacts_manifest.yaml.sha256"

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
          path: |
            open-shorebird-cli-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz
            open-shorebird-cli-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload mirror patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror-${{ matrix.patch_zip }}
          path: |
            artifacts/mirror/${{ matrix.patch_zip }}
            artifacts/mirror/${{ matrix.patch_zip }}.sha256
            artifacts/mirror/shorebird/**/${{ matrix.patch_zip }}
            artifacts/mirror/shorebird/**/${{ matrix.patch_zip }}.sha256
          if-no-files-found: error

      - name: Upload mirror metadata
        if: ${{ matrix.artifact_os == 'linux' && matrix.artifact_arch == 'x64' }}
        uses: actions/upload-artifact@v4
        with:
          name: mirror-metadata
          path: |
            artifacts/mirror/shorebird/**/artifacts_manifest.yaml
            artifacts/mirror/shorebird/**/artifacts_manifest.yaml.sha256
          if-no-files-found: error

  server-artifacts:
    name: Build server artifacts
    needs: source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: ".exe"
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Dart for real client smoke
        if: ${{ matrix.goos == 'linux' && matrix.goarch == 'amd64' }}
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_CHANNEL }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: shorebird-server/go.sum

      - name: Test server
        working-directory: shorebird-server
        run: go test ./...

      - name: Smoke real Dart client against Go server
        if: ${{ matrix.goos == 'linux' && matrix.goarch == 'amd64' }}
        env:
          DART_BIN: dart
        run: ./scripts/run_server_client_smoke.sh

      - name: Build server binary
        working-directory: shorebird-server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/server-${GOOS}-${GOARCH}
          go build -trimpath -ldflags="-s -w" \
            -o ../artifacts/server-${GOOS}-${GOARCH}/shorebird-server${{ matrix.extension }} \
            ./cmd/server
          cp -R web ../artifacts/server-${GOOS}-${GOARCH}/
          cp .env.example ../artifacts/server-${GOOS}-${GOARCH}/
          cp README.md ../artifacts/server-${GOOS}-${GOARCH}/
          cp internal/api/handlers/openapi.yaml ../artifacts/server-${GOOS}-${GOARCH}/openapi.yaml
          server_revision="$(git rev-parse HEAD)"
          cat > ../artifacts/server-${GOOS}-${GOARCH}/manifest.json <<EOF
          {
            "name": "shorebird-server-${GOOS}-${GOARCH}",
            "git_sha": "${{ github.sha }}",
            "server_git_sha": "${server_revision}",
            "runner_os": "${{ runner.os }}",
            "goos": "${GOOS}",
            "goarch": "${GOARCH}",
            "included": [
              "shorebird-server${{ matrix.extension }}",
              "web/",
              ".env.example",
              "README.md",
              "openapi.yaml"
            ]
          }
          EOF
          tar -C ../artifacts -czf ../shorebird-server-${GOOS}-${GOARCH}.tar.gz server-${GOOS}-${GOARCH}
          ../scripts/write_sha256.sh \
            ../shorebird-server-${GOOS}-${GOARCH}.tar.gz \
            ../shorebird-server-${GOOS}-${GOARCH}.tar.gz.sha256

          if [[ "$GOOS" == "linux" && "$GOARCH" == "amd64" ]]; then
            smoke_dir="$(mktemp -d)"
            smoke_pid=""
            cleanup_server_smoke() {
              if [[ -n "$smoke_pid" ]] && kill -0 "$smoke_pid" 2>/dev/null; then
                kill "$smoke_pid" 2>/dev/null || true
                wait "$smoke_pid" 2>/dev/null || true
              fi
              rm -rf "$smoke_dir"
            }
            trap cleanup_server_smoke EXIT

            tar -C "$smoke_dir" -xzf ../shorebird-server-${GOOS}-${GOARCH}.tar.gz
            cd "$smoke_dir/server-${GOOS}-${GOARCH}"
            SERVER_HOST=127.0.0.1 \
              SERVER_PORT=18080 \
              SERVER_BASE_URL=http://127.0.0.1:18080 \
              DB_DRIVER=sqlite \
              DB_PATH="$smoke_dir/shorebird.db" \
              STORAGE_DRIVER=local \
              STORAGE_LOCAL_DIR="$smoke_dir/storage" \
              DEFAULT_ADMIN_PASSWORD=admin123456 \
              ./shorebird-server >"$smoke_dir/server.log" 2>&1 &
            smoke_pid="$!"

            for _ in {1..40}; do
              if curl -fsS http://127.0.0.1:18080/health >"$smoke_dir/health.json"; then
                break
              fi
              sleep 0.25
            done
            cat "$smoke_dir/health.json"
            grep -q '"status":"ok"' "$smoke_dir/health.json"
            curl -fsS http://127.0.0.1:18080/ >"$smoke_dir/index.html"
            grep -q '<!DOCTYPE html>' "$smoke_dir/index.html"
            curl -fsS http://127.0.0.1:18080/openapi.yaml >"$smoke_dir/openapi.yaml"
            grep -q 'openapi: 3.1.0' "$smoke_dir/openapi.yaml"
          fi

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            shorebird-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            shorebird-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  custom-dart-sdk:
    name: Build custom Dart SDK
    needs: source-checks
    runs-on: ${{ inputs.linux_heavy_runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Free Ubuntu runner disk
        run: ./scripts/free_ci_disk_linux.sh

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$SDK_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        run: ./scripts/write_gclient.sh linux

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: Generate patched Dart SDK build files
        working-directory: dart-sdk
        run: |
          python3 tools/gn.py \
            --mode release \
            --arch x64 \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=true'

      - name: Verify patched Dart SDK args
        run: ./scripts/verify_dart_sdk_args.sh dart-sdk/out/ReleaseX64/args.gn

      - name: Build patched Dart SDK
        working-directory: dart-sdk
        run: |
          ninja -C out/ReleaseX64 create_sdk runtime gen_snapshot dartaotruntime dart_engine_aot_shared dart gen_snapshot_product dartaotruntime_product vm_platform_product dart_engine_aot_shared_product dartvm product_metadata_test run_ffi_unit_tests

      - name: Run shared FFI ABI golden tests
        working-directory: dart-sdk
        run: python3 tools/test.py --mode=release --arch=x64 --tasks=2 --progress=line ffi_unit

      - name: Build ELF memory loader test
        working-directory: dart-sdk
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/linux-elf-memory-loader-tests"
          mkdir -p "$results"
          rm -f "$results/build.log" "$results/loader.log" "$results/acg-denial.log"
          ninja -C out/ReleaseX64 elf_loader_memory_test 2>&1 | tee "$results/build.log"

      - name: Run ELF memory loader test
        working-directory: dart-sdk
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/linux-elf-memory-loader-tests"
          test -x out/ReleaseX64/elf_loader_memory_test
          out/ReleaseX64/elf_loader_memory_test 2>&1 | tee "$results/loader.log"
          tr -d '\r' < "$results/loader.log" | grep -Fx 'ELF memory loader tests passed'

      - name: Upload ELF memory loader test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-elf-memory-loader-tests
          path: artifacts/linux-elf-memory-loader-tests/
          if-no-files-found: error

      - name: Verify built SDK developer tools
        run: python3 scripts/verify_dart_sdk_tooling.py --dart "$PWD/dart-sdk/out/ReleaseX64/dart-sdk/bin/dart"

      - name: Run focused patch API tests
        working-directory: dart-sdk/out/ReleaseX64
        run: |
          ./run_vm_tests DartAPI_AotPatchingConfiguration
          ./run_vm_tests DartAPI_BytecodePatchReloadConfiguration
          ./run_vm_tests DartAPI_SnapshotRegionSizes
          ./run_vm_tests DartAPI_SnapshotRegionSizesRejectInvalidHeaders

      - name: Run zone memory tagging capability tests
        working-directory: dart-sdk/out/ReleaseX64
        run: |
          set -euo pipefail
          ./run_vm_tests ZoneMemoryTaggingUnsupportedPreservesTaggedPointers
          ./run_vm_tests ZoneMemoryTaggingSetFailurePreservesTaggedPointers
          ./run_vm_tests ZoneMemoryTaggingGetFailure
          ./run_vm_tests ZoneMemoryTaggingIncompleteControl
          ./run_vm_tests ZoneMemoryTaggingSupportedFaultModes
          ./run_vm_tests ZoneWithMemoryTagging

      - name: Resolve public encryption tooling
        working-directory: shorebird
        run: ../dart-sdk/out/ReleaseX64/dart-sdk/bin/dart pub get

      - name: Test replacement compiler contracts
        working-directory: dart-sdk
        run: >-
          out/ReleaseX64/dart-sdk/bin/dart --packages=.dart_tool/package_config.json
          third_party/pkg/test/pkgs/test/bin/test.dart
          pkg/dart2bytecode/test/patch_test.dart
          pkg/dart2bytecode/test/full_replacement_test.dart
          pkg/dart2bytecode/test/native_assets_profile_test.dart
          pkg/frontend_server/test/shorebird_native_assets_descriptor_test.dart
          pkg/dart2bytecode/test/shorebird_ios_full_replacement_target_test.dart
          pkg/frontend_server/test/shorebird_ios_full_replacement_target_test.dart
          pkg/vm/test/shorebird_ios_full_replacement_target_test.dart
          pkg/vm/test/native_assets/synthesizer_test.dart --concurrency=1

      - name: Run encrypted no-JIT replacement regression
        run: >-
          python3 scripts/verify_encrypted_aot_runtime.py
          --build-dir dart-sdk/out/ReleaseX64
          --tooling-dart dart-sdk/out/ReleaseX64/dart-sdk/bin/dart

      - name: Run PRODUCT no-TFA startup regression
        run: python3 dart-sdk/tools/test_aot_no_tfa_startup.py --build-dir dart-sdk/out/ReleaseX64

      - name: Run boot-time structural patch regression
        run: python3 dart-sdk/tools/test_aot_structural_patch.py --build-dir dart-sdk/out/ReleaseX64

      - name: Run PRODUCT structural patch regression
        run: python3 dart-sdk/tools/test_aot_structural_patch.py --build-dir dart-sdk/out/ReleaseX64 --product

      - name: Run PRODUCT full replacement regression
        run: python3 dart-sdk/tools/test_aot_full_replacement.py --build-dir dart-sdk/out/ReleaseX64 --product

      - name: Run PRODUCT interpreter metadata regression
        run: python3 dart-sdk/tools/test_aot_product_metadata.py --build-dir dart-sdk/out/ReleaseX64

      - name: Run PRODUCT host resolver regression
        run: python3 dart-sdk/tools/test_aot_host_resolvers.py --build-dir dart-sdk/out/ReleaseX64

      - name: Run PRODUCT encrypted full replacement regression
        run: >-
          python3 scripts/verify_encrypted_aot_runtime.py --full-replacement --product
          --build-dir dart-sdk/out/ReleaseX64
          --tooling-dart dart-sdk/out/ReleaseX64/dart-sdk/bin/dart

      - name: Run encrypted structural patch regression
        run: >-
          python3 scripts/verify_encrypted_aot_runtime.py --structural
          --build-dir dart-sdk/out/ReleaseX64
          --tooling-dart dart-sdk/out/ReleaseX64/dart-sdk/bin/dart

      - name: Run PRODUCT encrypted structural patch regression
        run: >-
          python3 scripts/verify_encrypted_aot_runtime.py --structural --product
          --build-dir dart-sdk/out/ReleaseX64
          --tooling-dart dart-sdk/out/ReleaseX64/dart-sdk/bin/dart

      - name: Package Dart SDK artifact
        run: |
          mkdir -p artifacts/custom-dart-sdk-linux-x64
          cp -R dart-sdk/out/ReleaseX64/dart-sdk artifacts/custom-dart-sdk-linux-x64/
          cp dart-sdk/out/ReleaseX64/gen_snapshot artifacts/custom-dart-sdk-linux-x64/
          cp dart-sdk/out/ReleaseX64/dartaotruntime artifacts/custom-dart-sdk-linux-x64/
          cp dart-sdk/out/ReleaseX64/args.gn artifacts/custom-dart-sdk-linux-x64/
          dart_sdk_revision="$(git -C dart-sdk rev-parse HEAD)"
          cat > artifacts/custom-dart-sdk-linux-x64/manifest.json <<EOF
          {
            "name": "custom-dart-sdk-linux-x64",
            "git_sha": "${{ github.sha }}",
            "dart_sdk_git_sha": "${dart_sdk_revision}",
            "runner_os": "${{ runner.os }}",
            "dart_arch": "x64",
            "dart_build_dir": "dart-sdk/out/ReleaseX64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": true,
            "included": [
              "dart-sdk/",
              "gen_snapshot",
              "dartaotruntime",
              "args.gn"
            ]
          }
          EOF
          tar -C artifacts -czf custom-dart-sdk-linux-x64.tar.gz custom-dart-sdk-linux-x64
          sdk_extract_dir="$(mktemp -d)"
          tar -C "$sdk_extract_dir" -xzf custom-dart-sdk-linux-x64.tar.gz
          test -f "$sdk_extract_dir/custom-dart-sdk-linux-x64/manifest.json"
          test -f "$sdk_extract_dir/custom-dart-sdk-linux-x64/args.gn"
          test -x "$sdk_extract_dir/custom-dart-sdk-linux-x64/dart-sdk/bin/dart"
          test -x "$sdk_extract_dir/custom-dart-sdk-linux-x64/gen_snapshot"
          test -x "$sdk_extract_dir/custom-dart-sdk-linux-x64/dartaotruntime"
          "$sdk_extract_dir/custom-dart-sdk-linux-x64/dart-sdk/bin/dart" --version
          (
            cd dart-sdk/out/ReleaseX64
            zip -qr "$GITHUB_WORKSPACE/dart-sdk-linux-x64.zip" dart-sdk
          )
          release_sdk_extract_dir="$(mktemp -d)"
          unzip -q dart-sdk-linux-x64.zip -d "$release_sdk_extract_dir"
          test -x "$release_sdk_extract_dir/dart-sdk/bin/dart"
          "$release_sdk_extract_dir/dart-sdk/bin/dart" --version
          ./scripts/write_sha256.sh custom-dart-sdk-linux-x64.tar.gz custom-dart-sdk-linux-x64.tar.gz.sha256
          ./scripts/write_sha256.sh dart-sdk-linux-x64.zip dart-sdk-linux-x64.zip.sha256

      - name: Upload custom Dart SDK
        uses: actions/upload-artifact@v4
        with:
          name: custom-dart-sdk-linux-x64
          path: |
            custom-dart-sdk-linux-x64.tar.gz
            custom-dart-sdk-linux-x64.tar.gz.sha256
            dart-sdk-linux-x64.zip
            dart-sdk-linux-x64.zip.sha256
          if-no-files-found: error

