  custom-dart-sdk-macos-x64:
    name: Build custom Dart SDK (macOS x64)
    needs: source-checks
    runs-on: ${{ inputs.macos_x64_heavy_runner || 'macos-15-intel' }}
    timeout-minutes: 180
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$SDK_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        run: ./scripts/write_gclient.sh macos

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: Generate patched Dart SDK build files
        working-directory: dart-sdk
        run: |
          python3 tools/gn.py \
            --mode release \
            --arch x64 \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=true'

      - name: Verify patched Dart SDK args
        run: ./scripts/verify_dart_sdk_args.sh dart-sdk/xcodebuild/ReleaseX64/args.gn

      - name: Build patched Dart SDK
        working-directory: dart-sdk
        run: |
          python3 ../scripts/macos_x64_proof_transport.py verify-source --workspace .. --sdk-commit "$(git rev-parse HEAD)"
          ninja -C xcodebuild/ReleaseX64 create_sdk runtime gen_snapshot dartaotruntime dart_engine_aot_shared dart gen_snapshot_product dartaotruntime_product vm_platform_product dart_engine_aot_shared_product dartvm product_metadata_test run_ffi_unit_tests product_ffi_test product_ffi_callback_test product_full_ffi_test

      - name: Package unsigned native Intel FFI proof inputs
        run: >-
          python3 scripts/macos_x64_proof_transport.py package-build
          --workspace "$GITHUB_WORKSPACE"
          --build-dir dart-sdk/xcodebuild/ReleaseX64
          --output macos-x64-ffi-proof-build-inputs.zip

      - name: Upload unsigned native Intel FFI proof inputs
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-ffi-proof-build-inputs
          path: |
            macos-x64-ffi-proof-build-inputs.zip
            macos-x64-ffi-proof-build-inputs.zip.sha256
            macos-x64-ffi-proof-build-inputs.manifest.json
          if-no-files-found: error

      - name: Run shared FFI ABI golden tests
        working-directory: dart-sdk
        run: python3 tools/test.py --mode=release --arch=x64 --tasks=2 --progress=line ffi_unit

      - name: Verify built SDK developer tools
        run: python3 scripts/verify_dart_sdk_tooling.py --dart "$PWD/dart-sdk/xcodebuild/ReleaseX64/dart-sdk/bin/dart"

      - name: Test native mapping compiler provenance
        working-directory: dart-sdk
        run: >-
          xcodebuild/ReleaseX64/dart-sdk/bin/dart --packages=.dart_tool/package_config.json
          third_party/pkg/test/pkgs/test/bin/test.dart
          pkg/frontend_server/test/shorebird_native_assets_descriptor_test.dart
          pkg/dart2bytecode/test/shorebird_ios_full_replacement_target_test.dart
          pkg/frontend_server/test/shorebird_ios_full_replacement_target_test.dart
          pkg/vm/test/shorebird_ios_full_replacement_target_test.dart
          --concurrency=1

      - name: Run focused patch API tests
        working-directory: dart-sdk/xcodebuild/ReleaseX64
        run: |
          ./run_vm_tests DartAPI_AotPatchingConfiguration
          ./run_vm_tests DartAPI_BytecodePatchReloadConfiguration
          ./run_vm_tests DartAPI_SnapshotRegionSizes
          ./run_vm_tests DartAPI_SnapshotRegionSizesRejectInvalidHeaders

      - name: Run zone memory tagging capability tests
        working-directory: dart-sdk/xcodebuild/ReleaseX64
        run: |
          set -euo pipefail
          ./run_vm_tests ZoneMemoryTaggingUnsupportedPreservesTaggedPointers
          ./run_vm_tests ZoneMemoryTaggingSetFailurePreservesTaggedPointers
          ./run_vm_tests ZoneMemoryTaggingGetFailure
          ./run_vm_tests ZoneMemoryTaggingIncompleteControl
          ./run_vm_tests ZoneMemoryTaggingSupportedFaultModes
          ./run_vm_tests ZoneWithMemoryTagging

      - name: Run AOT bytecode replacement regression
        run: python3 dart-sdk/tools/test_aot_bytecode_patch.py --build-dir dart-sdk/xcodebuild/ReleaseX64

      - name: Run PRODUCT no-TFA startup regression
        run: python3 dart-sdk/tools/test_aot_no_tfa_startup.py --build-dir dart-sdk/xcodebuild/ReleaseX64

      - name: Run boot-time structural patch regression
        run: python3 dart-sdk/tools/test_aot_structural_patch.py --build-dir dart-sdk/xcodebuild/ReleaseX64

      - name: Run PRODUCT structural patch regression
        run: python3 dart-sdk/tools/test_aot_structural_patch.py --build-dir dart-sdk/xcodebuild/ReleaseX64 --product

      - name: Run PRODUCT full replacement regression
        run: python3 dart-sdk/tools/test_aot_full_replacement.py --build-dir dart-sdk/xcodebuild/ReleaseX64 --product

      - name: Run PRODUCT interpreter metadata regression
        run: python3 dart-sdk/tools/test_aot_product_metadata.py --build-dir dart-sdk/xcodebuild/ReleaseX64

      - name: Run PRODUCT host resolver regression
        run: python3 dart-sdk/tools/test_aot_host_resolvers.py --build-dir dart-sdk/xcodebuild/ReleaseX64

      - name: Package Dart SDK artifact
        run: |
          mkdir -p artifacts/custom-dart-sdk-macos-x64
          cp -R dart-sdk/xcodebuild/ReleaseX64/dart-sdk artifacts/custom-dart-sdk-macos-x64/
          cp dart-sdk/xcodebuild/ReleaseX64/gen_snapshot artifacts/custom-dart-sdk-macos-x64/
          cp dart-sdk/xcodebuild/ReleaseX64/dartaotruntime artifacts/custom-dart-sdk-macos-x64/
          cp dart-sdk/xcodebuild/ReleaseX64/args.gn artifacts/custom-dart-sdk-macos-x64/
          dart_sdk_revision="$(git -C dart-sdk rev-parse HEAD)"
          cat > artifacts/custom-dart-sdk-macos-x64/manifest.json <<EOF
          {
            "name": "custom-dart-sdk-macos-x64",
            "git_sha": "${{ github.sha }}",
            "dart_sdk_git_sha": "${dart_sdk_revision}",
            "runner_os": "${{ runner.os }}",
            "dart_arch": "x64",
            "dart_build_dir": "dart-sdk/xcodebuild/ReleaseX64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": true,
            "included": [
              "dart-sdk/",
              "gen_snapshot",
              "dartaotruntime",
              "args.gn"
            ]
          }
          EOF
          tar -C artifacts -czf custom-dart-sdk-macos-x64.tar.gz custom-dart-sdk-macos-x64
          sdk_extract_dir="$(mktemp -d)"
          tar -C "$sdk_extract_dir" -xzf custom-dart-sdk-macos-x64.tar.gz
          test -f "$sdk_extract_dir/custom-dart-sdk-macos-x64/manifest.json"
          test -f "$sdk_extract_dir/custom-dart-sdk-macos-x64/args.gn"
          test -x "$sdk_extract_dir/custom-dart-sdk-macos-x64/dart-sdk/bin/dart"
          test -x "$sdk_extract_dir/custom-dart-sdk-macos-x64/gen_snapshot"
          test -x "$sdk_extract_dir/custom-dart-sdk-macos-x64/dartaotruntime"
          "$sdk_extract_dir/custom-dart-sdk-macos-x64/dart-sdk/bin/dart" --version
          (
            cd dart-sdk/xcodebuild/ReleaseX64
            zip -qr "$GITHUB_WORKSPACE/dart-sdk-darwin-x64.zip" dart-sdk
          )
          release_sdk_extract_dir="$(mktemp -d)"
          unzip -q dart-sdk-darwin-x64.zip -d "$release_sdk_extract_dir"
          test -x "$release_sdk_extract_dir/dart-sdk/bin/dart"
          "$release_sdk_extract_dir/dart-sdk/bin/dart" --version
          ./scripts/write_sha256.sh custom-dart-sdk-macos-x64.tar.gz custom-dart-sdk-macos-x64.tar.gz.sha256
          ./scripts/write_sha256.sh dart-sdk-darwin-x64.zip dart-sdk-darwin-x64.zip.sha256

      - name: Upload custom Dart SDK
        uses: actions/upload-artifact@v4
        with:
          name: custom-dart-sdk-macos-x64
          path: |
            custom-dart-sdk-macos-x64.tar.gz
            custom-dart-sdk-macos-x64.tar.gz.sha256
            dart-sdk-darwin-x64.zip
            dart-sdk-darwin-x64.zip.sha256
          if-no-files-found: error


  custom-dart-sdk-windows:
    name: Build custom Dart SDK (Windows x64)
    needs: source-checks
    runs-on: ${{ inputs.windows_heavy_runner || 'windows-2022' }}
    timeout-minutes: 180
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      MSYS: winsymlinks:nativestrict
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare native Windows build tools
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks true
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 C++ toolchain is required' }
          "GYP_MSVS_OVERRIDE_PATH=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name, $value = $matches[1], $matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and [Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
              }
            }
          }
          if ($LASTEXITCODE) { throw 'VsDevCmd failed' }
          if (!(Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\um\Windows.h")) {
            throw 'Windows SDK 10.0.26100.0 is required by Dart/Chromium'
          }

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap Windows depot_tools
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\depot_tools\bootstrap\win_tools.bat"
          if ($LASTEXITCODE) { throw 'depot_tools Windows bootstrap failed' }
          if (!(Test-Path "$env:GITHUB_WORKSPACE\depot_tools\git.bat")) {
            throw 'depot_tools bootstrap did not generate the required git.bat wrapper'
          }
          $pythonRelative = (Get-Content "$env:GITHUB_WORKSPACE\depot_tools\python3_bin_reldir.txt" -Raw).Trim()
          $pythonBin = Join-Path "$env:GITHUB_WORKSPACE\depot_tools" $pythonRelative
          if (!(Test-Path "$pythonBin\python3.exe")) {
            throw 'depot_tools bootstrap did not install native python3.exe for GN'
          }
          $pythonBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$pythonBin;$env:PATH"
          & "$pythonBin\python3.exe" -c "import shutil, subprocess; assert shutil.which('python3.exe'); subprocess.check_call(['git.bat', '--version'])"
          if ($LASTEXITCODE) { throw 'native Python cannot invoke the depot_tools Git wrapper' }

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$SDK_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        run: ./scripts/write_gclient.sh windows

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: Generate patched Dart SDK build files
        working-directory: dart-sdk
        run: |
          # tools/gn.py Main passes an empty environment to GN. Match the public
          # tools/build.py caller so GN inherits native Python and Visual Studio.
          python3 - <<'PYGN'
          import os
          import sys

          # gn.py locates DART_ROOT from argv[0] when imported by build.py.
          sys.argv[0] = 'tools/gn.py'
          sys.path.insert(0, 'tools')
          import gn

          options = gn.parse_args([
              'tools/gn.py', '--mode', 'release', '--arch', 'x64',
              '--gn-args=dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=true',
          ])
          if options is None:
              raise SystemExit('invalid Dart GN options')
          raise SystemExit(gn.RunGnOnConfiguredConfigurations(options, dict(os.environ)))
          PYGN

      - name: Verify patched Dart SDK args
        run: ./scripts/verify_dart_sdk_args.sh dart-sdk/out/ReleaseX64/args.gn

      - name: Build patched Dart SDK
        working-directory: dart-sdk
        run: |
          ninja -C out/ReleaseX64 create_sdk runtime gen_snapshot dartaotruntime run_ffi_unit_tests

      - name: Run shared FFI ABI golden tests
        working-directory: dart-sdk
        run: python3 tools/test.py --mode=release --arch=x64 --tasks=2 --progress=line ffi_unit

      - name: Build ELF memory loader test
        working-directory: dart-sdk
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/windows-elf-memory-loader-tests"
          mkdir -p "$results"
          rm -f "$results/build.log" "$results/loader.log" "$results/acg-denial.log"
          ninja -C out/ReleaseX64 elf_loader_memory_test 2>&1 | tee "$results/build.log"

      - name: Run ELF memory loader test
        working-directory: dart-sdk
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/windows-elf-memory-loader-tests"
          test -x out/ReleaseX64/elf_loader_memory_test.exe
          out/ReleaseX64/elf_loader_memory_test.exe 2>&1 | tee "$results/loader.log"
          tr -d '\r' < "$results/loader.log" | grep -Fx 'ELF memory loader tests passed'
          # A fresh process confines the irreversible ACG policy to this test.
          out/ReleaseX64/elf_loader_memory_test.exe --acg-denial 2>&1 | tee "$results/acg-denial.log"
          tr -d '\r' < "$results/acg-denial.log" | grep -Fx 'ELF memory loader ACG denial test passed'

      - name: Upload ELF memory loader test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-elf-memory-loader-tests
          path: artifacts/windows-elf-memory-loader-tests/
          if-no-files-found: error

      - name: Verify built SDK developer tools
        run: python3 scripts/verify_dart_sdk_tooling.py --dart "$PWD/dart-sdk/out/ReleaseX64/dart-sdk/bin/dart.exe"

      - name: Test native mapping compiler provenance
        working-directory: dart-sdk
        run: >-
          out/ReleaseX64/dart-sdk/bin/dart.exe --packages=.dart_tool/package_config.json
          third_party/pkg/test/pkgs/test/bin/test.dart
          pkg/frontend_server/test/shorebird_native_assets_descriptor_test.dart
          pkg/dart2bytecode/test/shorebird_ios_full_replacement_target_test.dart
          pkg/frontend_server/test/shorebird_ios_full_replacement_target_test.dart
          pkg/vm/test/shorebird_ios_full_replacement_target_test.dart
          --concurrency=1

      - name: Run focused patch API tests
        working-directory: dart-sdk/out/ReleaseX64
        run: |
          ./run_vm_tests.exe DartAPI_AotPatchingConfiguration
          ./run_vm_tests.exe DartAPI_BytecodePatchReloadConfiguration
          ./run_vm_tests.exe DartAPI_SnapshotRegionSizes
          ./run_vm_tests.exe DartAPI_SnapshotRegionSizesRejectInvalidHeaders

      - name: Run zone memory tagging capability tests
        working-directory: dart-sdk/out/ReleaseX64
        run: |
          set -euo pipefail
          ./run_vm_tests.exe ZoneMemoryTaggingUnsupportedPreservesTaggedPointers
          ./run_vm_tests.exe ZoneMemoryTaggingSetFailurePreservesTaggedPointers
          ./run_vm_tests.exe ZoneMemoryTaggingGetFailure
          ./run_vm_tests.exe ZoneMemoryTaggingIncompleteControl
          ./run_vm_tests.exe ZoneMemoryTaggingSupportedFaultModes
          ./run_vm_tests.exe ZoneWithMemoryTagging

      - name: Package Dart SDK artifact
        run: |
          mkdir -p artifacts/custom-dart-sdk-windows-x64
          cp -R dart-sdk/out/ReleaseX64/dart-sdk artifacts/custom-dart-sdk-windows-x64/
          cp dart-sdk/out/ReleaseX64/gen_snapshot.exe artifacts/custom-dart-sdk-windows-x64/
          cp dart-sdk/out/ReleaseX64/dartaotruntime.exe artifacts/custom-dart-sdk-windows-x64/
          cp dart-sdk/out/ReleaseX64/args.gn artifacts/custom-dart-sdk-windows-x64/
          dart_sdk_revision="$(git -C dart-sdk rev-parse HEAD)"
          cat > artifacts/custom-dart-sdk-windows-x64/manifest.json <<EOF
          {
            "name": "custom-dart-sdk-windows-x64",
            "git_sha": "${{ github.sha }}",
            "dart_sdk_git_sha": "${dart_sdk_revision}",
            "runner_os": "${{ runner.os }}",
            "dart_arch": "x64",
            "dart_build_dir": "dart-sdk/out/ReleaseX64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": true,
            "included": [
              "dart-sdk/",
              "gen_snapshot.exe",
              "dartaotruntime.exe",
              "args.gn"
            ]
          }
          EOF
          tar -C artifacts -czf custom-dart-sdk-windows-x64.tar.gz custom-dart-sdk-windows-x64
          sdk_extract_dir="$(mktemp -d)"
          tar -C "$sdk_extract_dir" -xzf custom-dart-sdk-windows-x64.tar.gz
          test -f "$sdk_extract_dir/custom-dart-sdk-windows-x64/manifest.json"
          test -f "$sdk_extract_dir/custom-dart-sdk-windows-x64/args.gn"
          test -x "$sdk_extract_dir/custom-dart-sdk-windows-x64/dart-sdk/bin/dart.exe"
          test -x "$sdk_extract_dir/custom-dart-sdk-windows-x64/gen_snapshot.exe"
          test -x "$sdk_extract_dir/custom-dart-sdk-windows-x64/dartaotruntime.exe"
          "$sdk_extract_dir/custom-dart-sdk-windows-x64/dart-sdk/bin/dart.exe" --version
          (
            cd dart-sdk/out/ReleaseX64
            python3 -m zipfile -c "$GITHUB_WORKSPACE/dart-sdk-windows-x64.zip" dart-sdk
          )
          release_sdk_extract_dir="$(mktemp -d)"
          unzip -q dart-sdk-windows-x64.zip -d "$release_sdk_extract_dir"
          test -x "$release_sdk_extract_dir/dart-sdk/bin/dart.exe"
          "$release_sdk_extract_dir/dart-sdk/bin/dart.exe" --version
          ./scripts/write_sha256.sh custom-dart-sdk-windows-x64.tar.gz custom-dart-sdk-windows-x64.tar.gz.sha256
          ./scripts/write_sha256.sh dart-sdk-windows-x64.zip dart-sdk-windows-x64.zip.sha256

      - name: Upload custom Dart SDK
        uses: actions/upload-artifact@v4
        with:
          name: custom-dart-sdk-windows-x64
          path: |
            custom-dart-sdk-windows-x64.tar.gz
            custom-dart-sdk-windows-x64.tar.gz.sha256
            dart-sdk-windows-x64.zip
            dart-sdk-windows-x64.zip.sha256
          if-no-files-found: error


  linux-engine:
    name: Build Linux engine artifacts
    needs: source-checks
    runs-on: ${{ inputs.linux_heavy_runner || 'ubuntu-latest' }}
    timeout-minutes: 240
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Free Ubuntu runner disk
        run: ./scripts/free_ci_disk_linux.sh

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Install Linux engine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            liblzma-dev \
            pkg-config clang cmake ninja-build \
            libcurl4-openssl-dev libkeyutils-dev keyutils \
            xvfb xauth dbus-x11 libgl1-mesa-dri libegl1

      - name: Verify Linux session keyring support
        run: |
          python3 - <<'PYKEYRING'
          import ctypes, ctypes.util
          library = ctypes.CDLL(ctypes.util.find_library('keyutils'), use_errno=True)
          library.keyctl_join_session_keyring.argtypes = [ctypes.c_char_p]
          library.keyctl_join_session_keyring.restype = ctypes.c_int32
          library.keyctl_setperm.argtypes = [ctypes.c_int32, ctypes.c_uint32]
          library.keyctl_revoke.argtypes = [ctypes.c_int32]
          keyring = library.keyctl_join_session_keyring(None)
          if keyring <= 0:
              raise SystemExit('Linux kernel session keyring is unavailable')
          try:
              if library.keyctl_setperm(keyring, 0x3f000000) != 0:
                  raise SystemExit('Linux kernel session keyring permissions failed')
          finally:
              if library.keyctl_revoke(keyring) != 0:
                  raise SystemExit('Linux kernel session keyring cleanup failed')
          print('Linux kernel session keyring preflight passed')
          PYKEYRING

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
        run: ./scripts/write_gclient.sh linux

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Configure Linux engine
        working-directory: flutter/engine/src
        run: |
          ./flutter/tools/gn \
            --runtime-mode=release \
            --target-dir=linux_release_x64 \
            --enable-unittests \
            --no-prebuilt-dart-sdk \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false'

      - name: Build Linux engine
        working-directory: flutter/engine/src
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/linux-native-cache-tests"
          mkdir -p "$results"
          rm -f "$results/shorebird.xml" "$results/embedder.xml" "$results/shorebird-list.txt" "$results/"*.log
          ninja -C out/linux_release_x64 \
            flutter/shell/platform/linux:flutter_gtk \
            flutter/build/archives:flutter_patched_sdk \
            flutter/tools/font_subset:font_subset \
            flutter/build/dart:dart_sdk \
            flutter/flutter_frontend_server:frontend_server \
            flutter/tools/const_finder:const_finder \
            flutter/sky/packages/sky_engine:sky_engine \
            flutter/impeller/compiler:impellerc \
            flutter/shell/common/shorebird:shorebird_unittests \
            flutter/shell/platform/embedder:embedder_unittests \
            2>&1 | tee "$results/build.log"

      - name: Verify Linux engine args
        run: |
          ./scripts/verify_engine_args.sh \
            flutter/engine/src/out/linux_release_x64/args.gn \
            enable_unittests=true \
            dart_dynamic_modules=false \
            dart_enable_aot_patching=true \
            dart_enable_shorebird_interpreter=false \
            shorebird_enable_aot_patching=true \
            shorebird_use_interpreter=false \
            flutter_prebuilt_dart_sdk=false

      - name: Run Linux prepared native cache engine tests
        working-directory: flutter/engine/src
        run: |
          set -euo pipefail
          out="$PWD/out/linux_release_x64"
          results="$GITHUB_WORKSPACE/artifacts/linux-native-cache-tests"
          mkdir -p "$results"
          # Match the upstream engine runner's working directory and libraries.
          # Selected embedder controls use the software renderer, without X/GPU.
          export LD_LIBRARY_PATH="$out${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export FLUTTER_BUILD_DIRECTORY="$out"
          test -x "$out/shorebird_unittests"
          test -x "$out/embedder_unittests"
          test -s "$out/gen/flutter/shell/platform/embedder/assets/app_elf_snapshot.so"
          # Reused provisioned runners must not satisfy this run with stale XML.
          rm -f "$results/shorebird.xml" "$results/embedder.xml" "$results/shorebird-list.txt"
          "$out/shorebird_unittests" --gtest_filter='*' --gtest_list_tests \
            > "$results/shorebird-list.txt" 2> "$results/shorebird-list.stderr.log"
          "$out/shorebird_unittests" --gtest_filter='*' --gtest_repeat=1 \
            --gtest_output="xml:$results/shorebird.xml" 2>&1 | tee "$results/shorebird.log"
          embedder_filter='EmbedderTest.PreparedFDOwnershipAndImageSurviveMultipleEngines:EmbedderTest.PreparedMemoryImageSurvivesInputAndMultipleEngines:EmbedderTest.InvalidAOTDataSourcesMustReturnError:EmbedderTest.CanCreateAndCollectAValidElfSource:EmbedderTest.CanLaunchAndShutdownWithAValidElfSource'
          "$out/embedder_unittests" --gtest_filter="$embedder_filter" --gtest_repeat=1 \
            --gtest_output="xml:$results/embedder.xml" 2>&1 | tee "$results/embedder.log"
          python3 "$GITHUB_WORKSPACE/scripts/verify_native_cache_engine_tests.py" --platform linux \
            --shorebird-list "$results/shorebird-list.txt" \
            --shorebird-xml "$results/shorebird.xml" \
            --embedder-xml "$results/embedder.xml" 2>&1 | tee "$results/validation.log"

      - name: Upload Linux native cache engine test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-cache-engine-tests
          path: artifacts/linux-native-cache-tests/
          if-no-files-found: error

      - name: Set up Go for Linux lifecycle
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: shorebird-server/go.sum

      - name: Restore verified Flutter version tag for lifecycle
        shell: bash
        run: python3 scripts/prepare_flutter_version_tag.py flutter

      - name: Prepare Linux encrypted lifecycle tools
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/flutter/engine/src/out/linux_release_x64"
          unzip -q -o "$out/zip_archives/flutter_patched_sdk_product.zip" -d "$out"
          cache="$GITHUB_WORKSPACE/flutter/bin/cache"
          mkdir -p "$cache"
          rm -rf -- "$cache/dart-sdk"
          cp -a "$out/dart-sdk" "$cache/dart-sdk"
          export PUB_CACHE="$RUNNER_TEMP/shorebird-linux-lifecycle-pub"
          echo "PUB_CACHE=$PUB_CACHE" >> "$GITHUB_ENV"
          for project in shorebird flutter/packages/flutter_tools; do
            (cd "$GITHUB_WORKSPACE/$project" && "$out/dart-sdk/bin/dart" pub get)
          done
          (cd updater && cargo build --release --locked -p patch --bin patch)

      - name: Compile Linux session keyring provider contract
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/testapps/license_flavor_patch_test/tool/linux_native"
          out="$GITHUB_WORKSPACE/flutter/engine/src/out/linux_release_x64"
          results="$GITHUB_WORKSPACE/artifacts/linux-native-provider-tests"
          mkdir -p "$results"
          clang++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I"$out" $(pkg-config --cflags gtk+-3.0 libcurl) \
            "$fixture/native_cache_contract_test.cpp" \
            -o "$results/native_cache_contract_test" \
            $(pkg-config --libs gtk+-3.0 libcurl) -lkeyutils \
            2>&1 | tee "$results/build.log"

      - name: Run Linux encrypted native lifecycle
        timeout-minutes: 75
        run: |
          set -euo pipefail
          engine="$GITHUB_WORKSPACE/flutter/engine/src"
          out="$engine/out/linux_release_x64"
          work="$RUNNER_TEMP/shorebird-linux-e2e-$(python3 -c 'import uuid; print(uuid.uuid4())')"
          results="$GITHUB_WORKSPACE/artifacts/linux-native-cache-e2e"
          probe="$GITHUB_WORKSPACE/artifacts/linux-native-provider-tests/native_cache_contract_test"
          export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1
          dbus-run-session -- xvfb-run -a python3 testapps/license_flavor_patch_test/tool/linux_native_cache_e2e.py run --execute --engine-src "$engine" --host-engine linux_release_x64 --target-engine linux_release_x64 --tooling-dart "$out/dart-sdk/bin/dart" --patch-tool "$GITHUB_WORKSPACE/updater/target/release/patch" --pub-cache "$PUB_CACHE" --provider-probe "$probe" --work "$work" --results "$results"
          python3 - "$results/results.json" <<'PYREPORT'
          import json, sys
          report = json.load(open(sys.argv[1]))
          required = {
              'native-probe-self-test', 'native-probe-online', 'native-probe-offline',
              'actual-cli-release-free', 'actual-cli-patch-pro', 'ciphertext-installed',
              'offline-cold-U', 'offline-missing-key-BASE', 'offline-missing-recovery-U',
              'offline-wrong-key-BASE', 'offline-wrong-recovery-U',
              'online-U-receive-signed-rollback', 'offline-cold-rollback-BASE',
              'released-bundle-unchanged',
          }
          observed = {stage['name'] for stage in report.get('stages', [])}
          if not required.issubset(observed):
              raise SystemExit('Linux lifecycle execution evidence is incomplete')
          if (report.get('key_storage') != 'kernel-session-keyring' or
              report.get('key_storage_scope') != 'cold-app-processes-in-one-session'):
              raise SystemExit('Linux lifecycle key storage contract changed')
          if (report.get('schema') != 'linux-native-cache-e2e-v1' or
              report.get('result') != 'passed' or
              report.get('cleanup') != 'owned processes, ports, disposable app cache, private session removed; owned session keyring revoked'):
              raise SystemExit('Linux lifecycle did not produce a passing cleaned execution report')
          PYREPORT

      - name: Upload Linux native provider test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-provider-tests
          path: artifacts/linux-native-provider-tests/build.log
          if-no-files-found: error

      - name: Upload Linux encrypted lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-cache-e2e
          path: artifacts/linux-native-cache-e2e/results.json
          if-no-files-found: error

      - name: Run Linux native V2 variant lifecycle
        timeout-minutes: 90
        run: |
          set -euo pipefail
          engine="$GITHUB_WORKSPACE/flutter/engine/src"
          out="$engine/out/linux_release_x64"
          work="$RUNNER_TEMP/shorebird-linux-variant-e2e-$(python3 -c 'import uuid; print(uuid.uuid4())')"
          results="$GITHUB_WORKSPACE/artifacts/linux-native-variant-e2e"
          probe="$GITHUB_WORKSPACE/artifacts/linux-native-provider-tests/native_cache_contract_test"
          export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1
          dbus-run-session -- xvfb-run -a python3 testapps/license_flavor_patch_test/tool/linux_variant_e2e.py run --execute --arch x64 --engine-src "$engine" --host-engine linux_release_x64 --target-engine linux_release_x64 --tooling-dart "$out/dart-sdk/bin/dart" --patch-tool "$GITHUB_WORKSPACE/updater/target/release/patch" --pub-cache "$PUB_CACHE" --provider-probe "$probe" --work "$work" --results "$results" 2>&1 | tee "$results.log"
          python3 - "$results/results.json" linux x64 <<'PYVARIANT'
          import json, sys
          report_path, platform, arch = sys.argv[1:]
          report = json.load(open(report_path))
          runtime_arch = {'x64': 'x86_64', 'arm64': 'aarch64'}[arch]
          if (report.get('schema') != 'native-variant-e2e-v2' or
              report.get('result') != 'passed' or report.get('runtime_acceptance') is not True or
              report.get('platform') != platform or report.get('target_arch') != arch or
              report.get('runtime_arch') != runtime_arch or
              report.get('cleanup') != 'owned platform processes, services, private work, app cache and provider keys removed'):
              raise SystemExit('Native V2 lifecycle requires real cleaned execution on the selected platform and architecture')
          machines = report.get('binary_architectures', {})
          if not machines or any(value.get('architecture') != arch or value.get('native_target') is not True for value in machines.values()):
              raise SystemExit('Native V2 binary architecture receipts are incomplete')
          required = {
              'actual-cli-staged-native-scope', 'actual-cli-release-free',
              'actual-cli-patch-pro_seed', 'actual-cli-patch-pro', 'actual-cli-patch-enterprise',
              'initial-free-public-installation', 'same-content-higher-epoch', 'same-content-cold-adoption',
              'offline-missing-key-free', 'offline-missing-key-recovery-pro',
              'offline-wrong-key-free', 'offline-wrong-key-recovery-pro',
              'released-bundle-unchanged', 'native-v2-final-cache',
          }
          previous = 'free'
          for index, variant in enumerate(('pro', 'enterprise', 'pro', 'free', 'enterprise', 'free')):
              required.update((f'online-{index}-{previous}-accept-{variant}', f'offline-cold-{index}-{variant}'))
              previous = variant
          adversarial_required = {
              'adversarial-select-pro-check',
              'adversarial-select-pro-cold',
              'owned-ciphertext-flip',
              'ciphertext-offline-free',
              'ciphertext-signed-free-check',
              'ciphertext-signed-free-cold',
              'ciphertext-same-pro-redownload-check',
              'ciphertext-same-pro-redownload-cold',
              'ciphertext-real-redownload',
              'untrusted-cached-signature-flip',
              'cached-signature-still-valid-pro',
              'server-returned-old-response-capture',
              'actual-leased-pro-check',
              'actual-leased-pro-cold',
              'platform-clock-expired-free',
              'platform-lease-expiry',
              'old-signed-response-rejected',
              'old-signed-response-requests',
              'corrupt-stale-response-combined-rejected',
              'corrupt-stale-response-combined-requests',
              'expired-server-signed-free',
              'expired-server-free-cold',
              'before-enterprise-rollback-check',
              'before-enterprise-rollback-cold',
              'rollback-enterprise',
              'rollback-server-signed-free',
              'rollback-cold-free',
              'rollforward-enterprise',
              'rollforward-alone-still-free',
              'rollforward-cold-free',
              'explicit-enterprise-restored-check',
              'explicit-enterprise-restored-cold',
              'adversarial-final-signed-free-check',
              'adversarial-final-signed-free-cold',
              'adversarial-final-offline-free',
          }
          required.update(adversarial_required)
          expected_cases = (
              'owned-ciphertext-offline-content-unavailable',
              'signed-free-same-pro-real-redownload',
              'cached-signature-keeps-valid-pro',
              'actual-paid-lease-platform-clock-expiry',
              'server-returned-older-response-rejected-independent-nonce',
              'corrupt-stale-response-combined-rejection',
              'enterprise-rollback-signed-free',
              'rollforward-alone-stays-free',
              'explicit-enterprise-reauthorization',
              'final-offline-free',
          )
          if report.get('adversarial_cases') != list(expected_cases):
              raise SystemExit('Native V2 adversarial case completion is missing or changed')
          if not required.issubset({stage['name'] for stage in report.get('stages', [])}):
              raise SystemExit('Native V2 lifecycle publication, grants, fallback, data and cold-boot evidence is incomplete')
          if report.get('provisioning', {}).get('accepted', 0) < 1 or not report.get('final_application_data'):
              raise SystemExit('Native V2 lifecycle authenticated delivery or application data proof is missing')
          stages = {stage['name']: stage.get('evidence', {}) for stage in report['stages']}
          if stages['ciphertext-real-redownload'].get('check_status') != 'outdated':
              raise SystemExit('Native V2 ciphertext recovery did not execute a real public download')
          import math
          lease = stages['platform-lease-expiry']
          if (any(type(lease.get(field)) not in (int, float) or not math.isfinite(lease[field]) for field in ('deadline', 'wait_completed', 'launch_started')) or
              lease['wait_completed'] <= lease['deadline'] or lease['launch_started'] <= lease['deadline']):
              raise SystemExit('Native V2 expiry lacks an observed platform clock boundary')
          for label in ('old-signed-response', 'corrupt-stale-response-combined'):
              delivered = stages[label + '-requests']
              checks = delivered.get('requests')
              if (type(delivered.get('delivered_check_responses')) is not int or delivered['delivered_check_responses'] < 1 or
                  not isinstance(checks, list) or len(checks) != delivered['delivered_check_responses'] or
                  delivered.get('real_api_and_provisioning_stopped') is not True):
                  raise SystemExit('Native V2 rejection lacks successful owned replay delivery with real services stopped')
          PYVARIANT

      - name: Upload Linux native V2 variant lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-variant-e2e
          path: |
            artifacts/linux-native-variant-e2e/
            artifacts/linux-native-variant-e2e.log
          if-no-files-found: error

      - name: Package Linux engine artifacts
        run: |
          set -euo pipefail
          out=flutter/engine/src/out/linux_release_x64
          mkdir -p artifacts/linux-engine

          gtk_zip="$(find "$out/zip_archives" -name 'linux-x64-flutter-gtk.zip' -type f -print -quit)"
          patched_sdk_zip="$(find "$out/zip_archives" -name 'flutter_patched_sdk_product.zip' -type f -print -quit)"
          artifacts_zip="$(find "$out/zip_archives" -path '*/linux-x64-release/artifacts.zip' -type f -print -quit)"
          if [ -z "$artifacts_zip" ]; then
            test -x "$out/gen_snapshot"
            artifacts_zip="$out/zip_archives/linux-x64-release/artifacts.zip"
            mkdir -p "$(dirname "$artifacts_zip")"
            python3 - "$out/gen_snapshot" "$artifacts_zip" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          info = zipfile.ZipInfo('gen_snapshot')
          info.external_attr = (source.stat().st_mode & 0xFFFF) << 16
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.writestr(info, source.read_bytes(), zipfile.ZIP_DEFLATED)
          PY
          fi
          test -n "$gtk_zip"
          test -n "$patched_sdk_zip"
          test -n "$artifacts_zip"

          engine_symbol_dir="$(mktemp -d)"
          unzip -q "$gtk_zip" -d "$engine_symbol_dir"
          engine_library="$(find "$engine_symbol_dir" -type f -name libflutter_linux_gtk.so -print -quit)"
          test -n "$engine_library"
          readelf --wide --dyn-syms "$engine_library" | awk '
            $5 == "GLOBAL" && $6 == "DEFAULT" && $7 != "UND" &&
                $8 == "shorebird_set_patch_decryption_key_provider" { found = 1 }
            END { if (!found) { print "missing exported patch decryption key provider" > "/dev/stderr"; exit 1 } }
          '
          cp "$gtk_zip" artifacts/linux-engine/
          cp "$patched_sdk_zip" artifacts/linux-engine/
          cp "$artifacts_zip" artifacts/linux-engine/artifacts.zip
          cp "$out/args.gn" artifacts/linux-engine/linux_release_x64.args.gn

          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision"
          mkdir -p "$mirror_root/linux-x64-release"
          cp "$gtk_zip" "$mirror_root/linux-x64-release/linux-x64-flutter-gtk.zip"
          cp "$artifacts_zip" "$mirror_root/linux-x64-release/artifacts.zip"
          cp "$patched_sdk_zip" "$mirror_root/flutter_patched_sdk_product.zip"
          test -f "$mirror_root/linux-x64-release/linux-x64-flutter-gtk.zip"
          test -f "$mirror_root/linux-x64-release/artifacts.zip"
          test -f "$mirror_root/flutter_patched_sdk_product.zip"
          font_zip="$out/zip_archives/linux-x64/font-subset.zip"
          cp "$font_zip" artifacts/linux-engine/font-subset.zip
          mkdir -p "$mirror_root/linux-x64"
          cp "$font_zip" "$mirror_root/linux-x64/font-subset.zip"
          test -f "$mirror_root/linux-x64/font-subset.zip"
          font_smoke_dir="$(mktemp -d)"
          font_dart="$(find "$out" -maxdepth 3 -type f -name dartvm -print -quit)"
          test -n "$font_dart"
          python3 - artifacts/linux-engine/font-subset.zip "$font_smoke_dir" "$font_dart" <<'PYFONT'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import zipfile

          archive_path, work, dart = map(Path, sys.argv[1:])
          executable = "font-subset.exe" if os.name == "nt" else "font-subset"
          with zipfile.ZipFile(archive_path) as archive:
              for name in (executable, "const_finder.dart.snapshot"):
                  if archive.getinfo(name).file_size == 0:
                      raise SystemExit(f"empty font tool: {name}")
              archive.extractall(work)
          binary = work / executable
          binary.chmod(0o755)
          source_font = Path("flutter/engine/src/flutter/txt/third_party/fonts/Roboto-Regular.ttf").resolve()
          output_font = (work / "subset.ttf").resolve()
          subprocess.run([str(binary.resolve()), str(output_font), str(source_font)],
                         input="65 66\n", text=True, check=True)
          if not 0 < output_font.stat().st_size < source_font.stat().st_size:
              raise SystemExit("font subset did not produce a smaller non-empty font")
          subprocess.run([str(dart.resolve()), str((work / "const_finder.dart.snapshot").resolve()),
                          "--kernel-file=unused.dill", "--class-library-uri=package:unused", "--class-name=Unused", "--help"],
                         check=True, stdout=subprocess.DEVNULL)
          PYFONT
          cat > artifacts/linux-engine/manifest.json <<EOF
          {
            "name": "linux-engine-x64",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "engine_revision": "${engine_revision}",
            "linux_build_dir": "flutter/engine/src/out/linux_release_x64",
            "runtime_mode": "release",
            "target_os": "linux",
            "target_arch": "x64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": false,
            "shorebird_enable_aot_patching": true,
            "shorebird_interpreter": false,
            "included": [
              "font-subset.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/linux-x64/font-subset.zip",
              "linux-x64-flutter-gtk.zip",
              "flutter_patched_sdk_product.zip",
              "artifacts.zip",
              "linux_release_x64.args.gn",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/linux-x64-release/linux-x64-flutter-gtk.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/linux-x64-release/artifacts.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/flutter_patched_sdk_product.zip"
            ]
          }
          EOF
          tar -C artifacts -czf linux-engine-x64.tar.gz linux-engine
          engine_extract_dir="$(mktemp -d)"
          tar -C "$engine_extract_dir" -xzf linux-engine-x64.tar.gz
          test -f "$engine_extract_dir/linux-engine/manifest.json"
          test -f "$engine_extract_dir/linux-engine/font-subset.zip"
          test -f "$engine_extract_dir/linux-engine/linux_release_x64.args.gn"
          test -f "$engine_extract_dir/linux-engine/linux-x64-flutter-gtk.zip"
          test -f "$engine_extract_dir/linux-engine/flutter_patched_sdk_product.zip"
          test -f "$engine_extract_dir/linux-engine/artifacts.zip"
          test -f "$engine_extract_dir/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/linux-x64-release/linux-x64-flutter-gtk.zip"
          test -f "$engine_extract_dir/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/linux-x64-release/artifacts.zip"
          test -f "$engine_extract_dir/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/flutter_patched_sdk_product.zip"
          ./scripts/write_sha256.sh linux-engine-x64.tar.gz linux-engine-x64.tar.gz.sha256

      - name: Upload Linux engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-engine-x64
          path: |
            linux-engine-x64.tar.gz
            linux-engine-x64.tar.gz.sha256
          if-no-files-found: error

  android-engine:
    name: Build Android engine artifacts
    needs: source-checks
    runs-on: ${{ inputs.linux_heavy_runner || 'ubuntu-latest' }}
    timeout-minutes: 240
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-linux-android
            jar: arm64_v8a_release.jar
            maven_artifact: arm64_v8a_release
          - arch: arm
            rust_target: armv7-linux-androideabi
            jar: armeabi_v7a_release.jar
            maven_artifact: armeabi_v7a_release
          - arch: x64
            rust_target: x86_64-linux-android
            jar: x86_64_release.jar
            maven_artifact: x86_64_release
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Free Ubuntu runner disk
        run: ./scripts/free_ci_disk_linux.sh

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
        run: ./scripts/write_gclient.sh linux

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Configure Android engine
        working-directory: flutter/engine/src
        run: |
          ./flutter/tools/gn \
            --android \
            --runtime-mode=release \
            --android-cpu=${{ matrix.arch }} \
            --target-dir=android_release_${{ matrix.arch }} \
            --no-prebuilt-dart-sdk \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false'

      - name: Build Android engine
        working-directory: flutter/engine/src
        run: |
          ninja -C out/android_release_${{ matrix.arch }} \
            flutter/shell/platform/android:flutter_jar_zip \
            flutter/shell/platform/android:android_jar \
            flutter/shell/platform/android:android_symbols \
            flutter/shell/platform/android:gen_snapshot
          if [[ "${{ matrix.arch }}" != arm ]]; then
            ninja -C out/android_release_${{ matrix.arch }} flutter/shell/platform/android:analyze_snapshot
          fi

      - name: Verify Android engine args
        run: |
          ./scripts/verify_engine_args.sh \
            flutter/engine/src/out/android_release_${{ matrix.arch }}/args.gn \
            dart_dynamic_modules=false \
            dart_enable_aot_patching=true \
            dart_enable_shorebird_interpreter=false \
            shorebird_enable_aot_patching=true \
            shorebird_use_interpreter=false \
            flutter_prebuilt_dart_sdk=false

      - name: Package Android engine artifacts
        run: |
          set -euo pipefail
          out=flutter/engine/src/out/android_release_${{ matrix.arch }}
          mkdir -p artifacts/android-engine

          cp "$out/args.gn" artifacts/android-engine/android_release_${{ matrix.arch }}.args.gn
          cp "$out/zip_archives/android-${{ matrix.arch }}-release/artifacts.zip" artifacts/android-engine/
          cp flutter/engine/src/flutter/shell/common/shorebird/shorebird_patch_encryption.h artifacts/android-engine/
          python3 - artifacts/android-engine/artifacts.zip artifacts/android-engine/shorebird_patch_encryption.h <<'PYHEADER'
          from pathlib import Path
          import sys
          import zipfile

          archive_path, header_path = map(Path, sys.argv[1:])
          header_name = "shorebird_patch_encryption.h"
          expected = header_path.read_bytes()
          if not expected:
              raise SystemExit("canonical patch encryption header is empty")
          with zipfile.ZipFile(archive_path, "a", zipfile.ZIP_DEFLATED) as archive:
              matches = [info for info in archive.infolist() if info.filename == header_name]
              if matches:
                  if len(matches) != 1 or archive.read(header_name) != expected:
                      raise SystemExit("conflicting patch encryption header in Android artifacts.zip")
              else:
                  archive.write(header_path, header_name)
          PYHEADER
          cp "$out/zip_archives/android-${{ matrix.arch }}-release/symbols.zip" artifacts/android-engine/
          cp "$out/flutter.jar" artifacts/android-engine/
          cp "$out/libflutter.so" artifacts/android-engine/
          if [ -f "$out/${{ matrix.jar }}" ]; then
            cp "$out/${{ matrix.jar }}" artifacts/android-engine/
          fi

          gen_snapshot=""
          for candidate in "$out/gen_snapshot_${{ matrix.arch }}" "$out/clang_x64/gen_snapshot" "$out/universal/gen_snapshot"; do
            if [ -f "$candidate" ]; then
              gen_snapshot="$candidate"
              break
            fi
          done
          if [ -z "$gen_snapshot" ]; then
            echo "missing Android gen_snapshot tool under $out" >&2
            find "$out" -maxdepth 3 -type f -name 'gen_snapshot*' -print >&2
            exit 66
          fi

          cp "$gen_snapshot" artifacts/android-engine/gen_snapshot_${{ matrix.arch }}
          analyze_snapshot_manifest=""
          if [[ "${{ matrix.arch }}" != arm ]]; then
            analyze_snapshot=""
            for candidate in "$out/analyze_snapshot_${{ matrix.arch }}" "$out/clang_x64/analyze_snapshot" "$out/universal/analyze_snapshot"; do
              if [ -f "$candidate" ]; then
                analyze_snapshot="$candidate"
                break
              fi
            done
            if [ -z "$analyze_snapshot" ]; then
              echo "missing Android analyze_snapshot tool under $out" >&2
              find "$out" -maxdepth 3 -type f -name 'analyze_snapshot*' -print >&2
              exit 66
            fi
            cp "$analyze_snapshot" artifacts/android-engine/analyze_snapshot_${{ matrix.arch }}
            analyze_snapshot_manifest='"analyze_snapshot_${{ matrix.arch }}",'
          fi

          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/android-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/android-${{ matrix.arch }}-release"
          mkdir -p "$mirror_root"
          cp artifacts/android-engine/artifacts.zip "$mirror_root/artifacts.zip"
          cp "$out/zip_archives/android-${{ matrix.arch }}-release/symbols.zip" "$mirror_root/symbols.zip"
          test -f "$mirror_root/artifacts.zip"
          test -f "$mirror_root/symbols.zip"
          cp "$out/zip_archives/android-${{ matrix.arch }}-release/linux-x64.zip" "$mirror_root/linux-x64.zip"
          test -f "$mirror_root/linux-x64.zip"

          maven_args=()
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            maven_args+=(--include-embedding)
          fi
          python3 scripts/package_android_maven.py \
            --out-dir "$out" \
            --mirror-root artifacts/android-engine/mirror/shorebird \
            --engine-revision "$engine_revision" \
            --artifact "${{ matrix.maven_artifact }}" "${maven_args[@]}"

          cat > artifacts/android-engine/manifest.json <<EOF
          {
            "name": "android-engine-${{ matrix.arch }}",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "engine_revision": "${engine_revision}",
            "android_build_dir": "flutter/engine/src/out/android_release_${{ matrix.arch }}",
            "runtime_mode": "release",
            "target_os": "android",
            "target_arch": "${{ matrix.arch }}",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": false,
            "shorebird_enable_aot_patching": true,
            "shorebird_interpreter": false,
            "included": [
              "artifacts.zip",
              "symbols.zip",
              "flutter.jar",
              "libflutter.so",
              "shorebird_patch_encryption.h",
              "gen_snapshot_${{ matrix.arch }}",
              ${analyze_snapshot_manifest}
              "android_release_${{ matrix.arch }}.args.gn",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/android-${{ matrix.arch }}-release/artifacts.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/android-${{ matrix.arch }}-release/symbols.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/android-${{ matrix.arch }}-release/linux-x64.zip"
            ]
          }
          EOF
          # All products are staged, including Maven JARs and host tools. The
          # completed build tree otherwise competes with tar and verification
          # copies for the runner's remaining disk space.
          case "$out" in
            flutter/engine/src/out/android_release_arm|flutter/engine/src/out/android_release_arm64|flutter/engine/src/out/android_release_x64) ;;
            *) echo "refusing to reclaim unexpected Android build path: $out" >&2; exit 64 ;;
          esac
          rm -rf -- "$out"
          tar -C artifacts -czf android-engine-${{ matrix.arch }}.tar.gz android-engine
          # Verification below uses only the produced archive, so release the
          # staging copy before extracting another copy of the same products.
          rm -rf -- artifacts/android-engine
          engine_extract_dir="$(mktemp -d)"
          tar -C "$engine_extract_dir" -xzf android-engine-${{ matrix.arch }}.tar.gz
          test -f "$engine_extract_dir/android-engine/manifest.json"
          test -f "$engine_extract_dir/android-engine/android_release_${{ matrix.arch }}.args.gn"
          test -f "$engine_extract_dir/android-engine/artifacts.zip"
          test -f "$engine_extract_dir/android-engine/symbols.zip"
          test -f "$engine_extract_dir/android-engine/flutter.jar"
          test -f "$engine_extract_dir/android-engine/shorebird_patch_encryption.h"
          test -f "$engine_extract_dir/android-engine/libflutter.so"
          engine_library="$engine_extract_dir/android-engine/libflutter.so"
          readelf --wide --dyn-syms "$engine_library" | awk '
            $5 == "GLOBAL" && $6 == "DEFAULT" && $7 != "UND" &&
                $8 == "shorebird_set_patch_decryption_key_provider" { found = 1 }
            END { if (!found) { print "missing exported patch decryption key provider" > "/dev/stderr"; exit 1 } }
          '
          test -f "$engine_extract_dir/android-engine/gen_snapshot_${{ matrix.arch }}"
          "$engine_extract_dir/android-engine/gen_snapshot_${{ matrix.arch }}" --version
          if [[ "${{ matrix.arch }}" != arm ]]; then
            test -f "$engine_extract_dir/android-engine/analyze_snapshot_${{ matrix.arch }}"
          fi
          test -f "$engine_extract_dir/android-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/android-${{ matrix.arch }}-release/artifacts.zip"
          test -f "$engine_extract_dir/android-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/android-${{ matrix.arch }}-release/symbols.zip"
          python3 - "$engine_extract_dir/android-engine" <<'PYHEADER'
          from pathlib import Path
          import sys
          import zipfile

          root = Path(sys.argv[1])
          expected = (root / "shorebird_patch_encryption.h").read_bytes()
          with zipfile.ZipFile(root / "artifacts.zip") as archive:
              if archive.read("shorebird_patch_encryption.h") != expected:
                  raise SystemExit("Android archive lost the canonical patch encryption header")
          PYHEADER
          rm -rf -- "$engine_extract_dir"
          ./scripts/write_sha256.sh android-engine-${{ matrix.arch }}.tar.gz android-engine-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload Android engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-engine-${{ matrix.arch }}
          path: |
            android-engine-${{ matrix.arch }}.tar.gz
            android-engine-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  web-sdk:
    name: Build web SDK artifact
    needs: [source-checks, custom-dart-sdk]
    runs-on: ${{ inputs.linux_heavy_runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    # Shorebird does not support web patching. This recipe is excluded from
    # push/PR CI and requires explicit opt-in during a manual experiment.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_unsupported_web_build }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Free Ubuntu runner disk
        run: ./scripts/free_ci_disk_linux.sh

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
        run: ./scripts/write_gclient.sh linux

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Download custom Dart tool SDK
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-linux-x64
          path: artifacts/custom-dart-sdk-linux-x64

      - name: Install custom Dart tool SDK
        run: |
          set -euo pipefail
          archive=artifacts/custom-dart-sdk-linux-x64/custom-dart-sdk-linux-x64.tar.gz
          tar -C artifacts/custom-dart-sdk-linux-x64 -xzf "$archive"
          custom_sdk=artifacts/custom-dart-sdk-linux-x64/custom-dart-sdk-linux-x64/dart-sdk
          test -x "$custom_sdk/bin/dart"
          rm -rf dart-sdk/tools/sdks/dart-sdk
          cp -R "$custom_sdk" dart-sdk/tools/sdks/dart-sdk

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Sync Flutter prebuilt Dart SDK
        run: ./scripts/sync_flutter_prebuilt_dart_sdk.sh linux-x64

      - name: Configure web SDK
        working-directory: flutter/engine/src
        run: |
          ./flutter/tools/gn \
            --web \
            --runtime-mode=release \
            --target-dir=wasm_release \
            --gn-args='dart_dynamic_modules=false'

      - name: Build web SDK
        working-directory: flutter/engine/src
        run: ninja -C out/wasm_release flutter/web_sdk:flutter_web_sdk_archive

      - name: Verify web SDK args
        run: |
          ./scripts/verify_engine_args.sh \
            flutter/engine/src/out/wasm_release/args.gn \
            dart_dynamic_modules=false \
            flutter_prebuilt_dart_sdk=true

      - name: Package web SDK artifact
        run: |
          set -euo pipefail
          out=flutter/engine/src/out/wasm_release
          mkdir -p artifacts/web-sdk
          cp "$out/args.gn" artifacts/web-sdk/wasm_release.args.gn
          cp "$out/zip_archives/flutter-web-sdk.zip" artifacts/web-sdk/

          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/web-sdk/mirror/shorebird/flutter_infra_release/flutter/$engine_revision"
          mkdir -p "$mirror_root"
          cp "$out/zip_archives/flutter-web-sdk.zip" "$mirror_root/flutter-web-sdk.zip"
          test -f "$mirror_root/flutter-web-sdk.zip"
          cat > artifacts/web-sdk/manifest.json <<EOF
          {
            "name": "flutter-web-sdk",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "engine_revision": "${engine_revision}",
            "web_build_dir": "flutter/engine/src/out/wasm_release",
            "runtime_mode": "release",
            "target_os": "wasm",
            "target_arch": "wasm",
            "dart_dynamic_modules": false,
            "included": [
              "flutter-web-sdk.zip",
              "wasm_release.args.gn",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/flutter-web-sdk.zip"
            ]
          }
          EOF
          tar -C artifacts -czf flutter-web-sdk.tar.gz web-sdk
          sdk_extract_dir="$(mktemp -d)"
          tar -C "$sdk_extract_dir" -xzf flutter-web-sdk.tar.gz
          test -f "$sdk_extract_dir/web-sdk/manifest.json"
          test -f "$sdk_extract_dir/web-sdk/wasm_release.args.gn"
          test -f "$sdk_extract_dir/web-sdk/flutter-web-sdk.zip"
          test -f "$sdk_extract_dir/web-sdk/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/flutter-web-sdk.zip"
          ./scripts/write_sha256.sh flutter-web-sdk.tar.gz flutter-web-sdk.tar.gz.sha256

      - name: Upload web SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-sdk
          path: |
            flutter-web-sdk.tar.gz
            flutter-web-sdk.tar.gz.sha256
          if-no-files-found: error

  ios-engine:
    name: Build iOS engine artifacts
    needs: source-checks
    runs-on: ${{ inputs.macos_heavy_runner || 'macos-15' }}
    timeout-minutes: 300
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Require iOS cache controls Swift controls
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          command -v swiftc
          command -v xcrun
          test -x "$(xcrun --find swiftc)"
          export PYTHONPATH="$GITHUB_WORKSPACE/testapps/license_flavor_patch_test/tool${PYTHONPATH:+:$PYTHONPATH}"
          python3 - <<'PYSWIFT'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames(['test_ios_variant_adversarial.NativeCacheControlsTest'])
          expected = 3
          if suite.countTestCases() != expected:
              raise SystemExit('Required Swift control test inventory changed')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != expected:
              raise SystemExit('Required Swift controls failed, skipped, or did not execute completely')
          PYSWIFT

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-darwin

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
        run: ./scripts/write_gclient.sh macos

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Configure host snapshotter
        working-directory: flutter/engine/src
        run: |
          ./flutter/tools/gn \
            --runtime-mode=release \
            --mac-cpu=arm64 \
            --target-dir=host_release_arm64 \
            --no-prebuilt-dart-sdk \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=true shorebird_use_interpreter=true flutter_prebuilt_dart_sdk=false'

      - name: Build host snapshotter
        working-directory: flutter/engine/src
        run: ninja -C out/host_release_arm64 gen_snapshot

      - name: Configure iOS engine
        working-directory: flutter/engine/src
        run: |
          ./flutter/tools/gn \
            --ios \
            --runtime-mode=release \
            --target-dir=ios_release \
            --no-prebuilt-dart-sdk \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=true shorebird_use_interpreter=true shorebird_enable_aot_patching=false flutter_prebuilt_dart_sdk=false'

      - name: Build iOS engine
        working-directory: flutter/engine/src
        run: |
          ninja -C out/ios_release \
            flutter/shell/platform/darwin/ios:flutter_framework \
            create_macos_gen_snapshots \
            create_macos_analyze_snapshots

      - name: Verify iOS interpreter route
        run: ./scripts/verify_ios_interpreter_route.sh

      - name: Package iOS engine artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios-engine/host_release_arm64 artifacts/ios-engine/ios-release

          require_path() {
            local path="$1"
            if [ ! -e "$path" ]; then
              echo "missing required path: $path" >&2
              find flutter/engine/src/out/ios_release -maxdepth 3 \( -name 'Flutter*' -o -name '*snapshot*' \) -print >&2 || true
              exit 1
            fi
          }

          require_directory() {
            require_path "$1"
            if [ ! -d "$1" ]; then
              echo "required path is not a directory: $1" >&2
              exit 1
            fi
          }

          require_executable() {
            require_path "$1"
            if [ ! -x "$1" ]; then
              echo "required path is not executable: $1" >&2
              exit 1
            fi
          }

          require_executable flutter/engine/src/out/host_release_arm64/gen_snapshot
          require_directory flutter/engine/src/out/ios_release/Flutter.xcframework
          require_executable flutter/engine/src/out/ios_release/universal/gen_snapshot_arm64
          require_executable flutter/engine/src/out/ios_release/analyze_snapshot_arm64
          cp -R flutter/engine/src/out/ios_release/Flutter.framework artifacts/ios-engine/
          cp -R flutter/engine/src/out/ios_release/Flutter.xcframework artifacts/ios-engine/
          cp flutter/engine/src/out/host_release_arm64/gen_snapshot artifacts/ios-engine/host_release_arm64/
          cp flutter/engine/src/out/ios_release/args.gn artifacts/ios-engine/ios_release.args.gn
          cp flutter/engine/src/out/host_release_arm64/args.gn artifacts/ios-engine/host_release_arm64.args.gn

          ios_zip_staging="$(mktemp -d)"
          cp -R flutter/engine/src/out/ios_release/Flutter.xcframework "$ios_zip_staging/"
          cp flutter/engine/src/out/ios_release/universal/gen_snapshot_arm64 "$ios_zip_staging/"
          cp flutter/engine/src/out/ios_release/analyze_snapshot_arm64 "$ios_zip_staging/"
          cat > "$ios_zip_staging/entitlements.txt" <<'EOF'
          analyze_snapshot_arm64
          gen_snapshot_arm64
          EOF
          cat > "$ios_zip_staging/without_entitlements.txt" <<'EOF'
          Flutter.xcframework/ios-arm64/Flutter.framework/Flutter
          EOF
          : > "$ios_zip_staging/unsigned_binaries.txt"
          python3 - "$ios_zip_staging" artifacts/ios-engine/ios-release/artifacts.zip <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys
          import zipfile

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  archive_name = path.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(archive_name)
                  info.external_attr = (path.stat().st_mode & 0xFFFF) << 16
                  with path.open("rb") as file:
                      archive.writestr(info, file.read(), zipfile.ZIP_DEFLATED)
          PY

          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/ios-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/ios-release"
          mkdir -p "$mirror_root"
          cp artifacts/ios-engine/ios-release/artifacts.zip "$mirror_root/artifacts.zip"
          test -f "$mirror_root/artifacts.zip"
          cat > artifacts/ios-engine/manifest.json <<EOF
          {
            "name": "ios-interpreter-engine",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "engine_revision": "${engine_revision}",
            "ios_build_dir": "flutter/engine/src/out/ios_release",
            "host_build_dir": "flutter/engine/src/out/host_release_arm64",
            "runtime_mode": "release",
            "target_os": "ios",
            "target_arch": "arm64",
            "shorebird_interpreter": true,
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": true,
            "shorebird_enable_aot_patching": false,
            "shorebird_use_interpreter": true,
            "included": [
              "Flutter.framework/",
              "Flutter.xcframework/",
              "ios-release/artifacts.zip",
              "host_release_arm64/gen_snapshot",
              "ios_release.args.gn",
              "host_release_arm64.args.gn",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/ios-release/artifacts.zip"
            ]
          }
          EOF
          tar -C artifacts -czf ios-interpreter-engine.tar.gz ios-engine
          engine_extract_dir="$(mktemp -d)"
          tar -C "$engine_extract_dir" -xzf ios-interpreter-engine.tar.gz
          test -f "$engine_extract_dir/ios-engine/manifest.json"
          test -d "$engine_extract_dir/ios-engine/Flutter.framework"
          test -d "$engine_extract_dir/ios-engine/Flutter.xcframework"
          engine_library="$engine_extract_dir/ios-engine/Flutter.xcframework/ios-arm64/Flutter.framework/Flutter"
          nm -gU "$engine_library" | awk '
            $NF == "_shorebird_set_patch_decryption_key_provider" { found = 1 }
            END { if (!found) { print "missing exported patch decryption key provider" > "/dev/stderr"; exit 1 } }
          '
          test -f "$engine_extract_dir/ios-engine/ios-release/artifacts.zip"
          test -f "$engine_extract_dir/ios-engine/ios_release.args.gn"
          test -f "$engine_extract_dir/ios-engine/host_release_arm64.args.gn"
          test -x "$engine_extract_dir/ios-engine/host_release_arm64/gen_snapshot"
          test -f "$engine_extract_dir/ios-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/ios-release/artifacts.zip"
          python3 - "$engine_extract_dir/ios-engine/ios-release/artifacts.zip" <<'PY'
          import sys
          import zipfile

          required = {
              "Flutter.xcframework/Info.plist",
              "Flutter.xcframework/ios-arm64/Flutter.framework/Flutter",
              "gen_snapshot_arm64",
              "analyze_snapshot_arm64",
              "entitlements.txt",
              "without_entitlements.txt",
              "unsigned_binaries.txt",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"missing iOS artifacts.zip entries: {missing}")
          PY
          ./scripts/write_sha256.sh ios-interpreter-engine.tar.gz ios-interpreter-engine.tar.gz.sha256

      - name: Upload iOS engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-interpreter-engine
          path: |
            ios-interpreter-engine.tar.gz
            ios-interpreter-engine.tar.gz.sha256
          if-no-files-found: error

  macos-engine:
    name: Build macOS engine artifacts
    needs: source-checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ${{ inputs.macos_heavy_runner || 'macos-15' }}
            rust_target: aarch64-apple-darwin
          - arch: x64
            runner: ${{ inputs.macos_x64_heavy_runner || 'macos-15-intel' }}
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Require macOS provider ledger Swift controls
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          command -v swiftc
          command -v xcrun
          test -x "$(xcrun --find swiftc)"
          export PYTHONPATH="$GITHUB_WORKSPACE/testapps/license_flavor_patch_test/tool${PYTHONPATH:+:$PYTHONPATH}"
          python3 - <<'PYSWIFT'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames(['test_macos_variant_e2e.VariantFixtureTest.test_actual_swift_provider_ledger_is_fresh_bounded_atomic_thread_safe_and_fail_closed'])
          expected = 1
          if suite.countTestCases() != expected:
              raise SystemExit('Required Swift control test inventory changed')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != expected:
              raise SystemExit('Required Swift controls failed, skipped, or did not execute completely')
          PYSWIFT

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Install Apple Rust targets
        run: rustup target add ${{ matrix.rust_target }}

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
        run: ./scripts/write_gclient.sh macos

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Configure macOS engine
        working-directory: flutter/engine/src
        run: |
          ./flutter/tools/gn \
            --mac \
            --runtime-mode=release \
            --mac-cpu=${{ matrix.arch }} \
            --target-dir=macos_release_${{ matrix.arch }} \
            --no-prebuilt-dart-sdk \
            --enable-unittests \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=true shorebird_enable_aot_patching=true shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false'

      - name: Build macOS engine
        working-directory: flutter/engine/src
        run: |
          ninja -C out/macos_release_${{ matrix.arch }} \
            flutter/shell/platform/darwin/macos:zip_macos_flutter_framework \
            flutter/build/archives:flutter_patched_sdk \
            create_macos_gen_snapshots create_macos_analyze_snapshots \
            flutter/tools/font_subset:font_subset \
            flutter/shell/common/shorebird:shorebird_unittests \
            flutter/shell/platform/embedder:embedder_unittests \
            flutter/runtime:runtime_unittests \
            flutter/shell/platform/darwin/macos:flutter_desktop_darwin_unittests

      - name: Verify macOS engine args
        run: |
          ./scripts/verify_engine_args.sh \
            flutter/engine/src/out/macos_release_${{ matrix.arch }}/args.gn \
            dart_dynamic_modules=false \
            dart_enable_aot_patching=true \
            dart_enable_shorebird_interpreter=true \
            shorebird_enable_aot_patching=true \
            shorebird_use_interpreter=false \
            flutter_prebuilt_dart_sdk=false

      - name: Test macOS interpreter integration
        run: |
          set -euo pipefail
          out="$PWD/flutter/engine/src/out/macos_release_${{ matrix.arch }}"
          results="$PWD/artifacts/macos-interpreter-tests"
          mkdir -p "$results"
          export FLUTTER_BUILD_DIRECTORY="$out"
          export DYLD_LIBRARY_PATH="$out${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          test -x "$out/runtime_unittests"
          rm -f "$results/runtime-list.txt" "$results/runtime.xml" "$results/runtime-tests.log" "$results/runtime-list-stderr.log"
          runtime_filter='DartIsolateTest.UncommittedInterpreterGroupSuppressesApplicationShutdownCallback:DartIsolateTest.CommittedInterpreterGroupRetainsApplicationShutdownCallback'
          (
            cd "$out"
            "$out/runtime_unittests" --gtest_filter="$runtime_filter" --gtest_list_tests > "$results/runtime-list.txt" 2> "$results/runtime-list-stderr.log"
            "$out/runtime_unittests" --gtest_filter="$runtime_filter" --gtest_repeat=1 --gtest_output="xml:$results/runtime.xml" > "$results/runtime-tests.log" 2>&1
          )
          "$out/shorebird_unittests" --gtest_list_tests > "$results/shorebird-list.txt" 2> "$results/shorebird-list-stderr.log"
          "$out/shorebird_unittests" --gtest_output="xml:$results/shorebird.xml" > "$results/shorebird-tests.log" 2>&1
          embedder_filter='ShorebirdInterpreterEmbedderTest.*:EmbedderTest.InvalidAOTDataSourcesMustReturnError:EmbedderTest.CanCreateAndCollectAValidElfSource:EmbedderTest.CanLaunchAndShutdownWithAValidElfSource'
          "$out/embedder_unittests" --gtest_filter="$embedder_filter" --gtest_list_tests > "$results/embedder-list.txt" 2> "$results/embedder-list-stderr.log"
          "$out/embedder_unittests" --gtest_filter="$embedder_filter" --gtest_output="xml:$results/embedder.xml" > "$results/embedder-tests.log" 2>&1
          cocoa_filter='FlutterEngineTest.FullInterpreterNeverUsesNativeOrElfRoute:FlutterEngineTest.LegacyProfileKeepsPublicInitializerAndElfRoute:FlutterDartProjectShorebirdTest.*'
          "$out/flutter_desktop_darwin_unittests" --gtest_filter="$cocoa_filter" --gtest_list_tests > "$results/cocoa-list.txt" 2> "$results/cocoa-list-stderr.log"
          "$out/flutter_desktop_darwin_unittests" --gtest_filter="$cocoa_filter" --gtest_output="xml:$results/cocoa.xml" > "$results/cocoa-tests.log" 2>&1
          python3 scripts/verify_macos_interpreter_engine_tests.py "$results" --arch=${{ matrix.arch }}

      - name: Upload macOS interpreter test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-interpreter-engine-tests-${{ matrix.arch }}
          path: artifacts/macos-interpreter-tests/
          if-no-files-found: error

      - name: Package macOS engine artifacts
        run: |
          set -euo pipefail
          out=flutter/engine/src/out/macos_release_${{ matrix.arch }}
          mkdir -p artifacts/macos-engine

          framework_zip="$(find "$out/zip_archives" -name 'FlutterMacOS.framework.zip' -type f -print -quit)"
          patched_sdk_zip="$(find "$out/zip_archives" -name 'flutter_patched_sdk_product.zip' -type f -print -quit)"
          test -n "$framework_zip"
          test -n "$patched_sdk_zip"

          cp "$framework_zip" artifacts/macos-engine/
          cp "$patched_sdk_zip" artifacts/macos-engine/
          cp "$out/args.gn" artifacts/macos-engine/macos_release_${{ matrix.arch }}.args.gn
          cp "$out/universal/gen_snapshot_${{ matrix.arch }}" artifacts/macos-engine/
          cp "$out/analyze_snapshot_${{ matrix.arch }}" artifacts/macos-engine/
          for tool in gen_snapshot analyze_snapshot; do
            codesign --force --sign - "artifacts/macos-engine/${tool}_${{ matrix.arch }}"
            lipo "artifacts/macos-engine/${tool}_${{ matrix.arch }}" -verify_arch arm64
            lipo "artifacts/macos-engine/${tool}_${{ matrix.arch }}" -verify_arch x86_64
          done
          artifacts/macos-engine/gen_snapshot_${{ matrix.arch }} --version
          artifacts/macos-engine/analyze_snapshot_${{ matrix.arch }} --sdk_version
          tools_mirror="artifacts/macos-engine/mirror/shorebird/$(cat flutter/bin/internal/engine.version)"
          mkdir -p "$tools_mirror"
          cp "artifacts/macos-engine/analyze_snapshot_${{ matrix.arch }}" "$tools_mirror/analyze-snapshot-macos-${{ matrix.arch }}"

          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/macos-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision"
          mkdir -p "$mirror_root/darwin-${{ matrix.arch }}-release"
          cp "$framework_zip" "$mirror_root/darwin-${{ matrix.arch }}-release/FlutterMacOS.framework.zip"
          test -f "$mirror_root/darwin-${{ matrix.arch }}-release/FlutterMacOS.framework.zip"
          font_zip="$out/zip_archives/darwin-${{ matrix.arch }}/font-subset.zip"
          cp "$font_zip" artifacts/macos-engine/font-subset.zip
          mkdir -p "$mirror_root/darwin-${{ matrix.arch }}"
          cp "$font_zip" "$mirror_root/darwin-${{ matrix.arch }}/font-subset.zip"
          test -f "$mirror_root/darwin-${{ matrix.arch }}/font-subset.zip"
          font_smoke_dir="$(mktemp -d)"
          font_dart="$(find "$out" -maxdepth 3 -type f -name dartvm -print -quit)"
          test -n "$font_dart"
          python3 - artifacts/macos-engine/font-subset.zip "$font_smoke_dir" "$font_dart" <<'PYFONT'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import zipfile

          archive_path, work, dart = map(Path, sys.argv[1:])
          executable = "font-subset.exe" if os.name == "nt" else "font-subset"
          with zipfile.ZipFile(archive_path) as archive:
              for name in (executable, "const_finder.dart.snapshot"):
                  if archive.getinfo(name).file_size == 0:
                      raise SystemExit(f"empty font tool: {name}")
              archive.extractall(work)
          binary = work / executable
          binary.chmod(0o755)
          source_font = Path("flutter/engine/src/flutter/txt/third_party/fonts/Roboto-Regular.ttf").resolve()
          output_font = (work / "subset.ttf").resolve()
          subprocess.run([str(binary.resolve()), str(output_font), str(source_font)],
                         input="65 66\n", text=True, check=True)
          if not 0 < output_font.stat().st_size < source_font.stat().st_size:
              raise SystemExit("font subset did not produce a smaller non-empty font")
          subprocess.run([str(dart.resolve()), str((work / "const_finder.dart.snapshot").resolve()),
                          "--kernel-file=unused.dill", "--class-library-uri=package:unused", "--class-name=Unused", "--help"],
                         check=True, stdout=subprocess.DEVNULL)
          PYFONT
          cat > artifacts/macos-engine/manifest.json <<EOF
          {
            "name": "macos-engine-${{ matrix.arch }}",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "engine_revision": "${engine_revision}",
            "macos_build_dir": "flutter/engine/src/out/macos_release_${{ matrix.arch }}",
            "runtime_mode": "release",
            "target_os": "macos",
            "target_arch": "${{ matrix.arch }}",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": true,
            "shorebird_enable_aot_patching": true,
            "shorebird_interpreter": false,
            "included": [
              "font-subset.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/darwin-${{ matrix.arch }}/font-subset.zip",
              "FlutterMacOS.framework.zip",
              "flutter_patched_sdk_product.zip",
              "macos_release_${{ matrix.arch }}.args.gn",
              "gen_snapshot_${{ matrix.arch }}",
              "analyze_snapshot_${{ matrix.arch }}",
              "mirror/shorebird/${engine_revision}/analyze-snapshot-macos-${{ matrix.arch }}",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/darwin-${{ matrix.arch }}-release/FlutterMacOS.framework.zip"
            ]
          }
          EOF
          tar -C artifacts -czf macos-engine-${{ matrix.arch }}.tar.gz macos-engine
          engine_extract_dir="$(mktemp -d)"
          tar -C "$engine_extract_dir" -xzf macos-engine-${{ matrix.arch }}.tar.gz
          test -f "$engine_extract_dir/macos-engine/manifest.json"
          test -f "$engine_extract_dir/macos-engine/font-subset.zip"
          test -f "$engine_extract_dir/macos-engine/macos_release_${{ matrix.arch }}.args.gn"
          test -f "$engine_extract_dir/macos-engine/FlutterMacOS.framework.zip"
          unzip -q "$engine_extract_dir/macos-engine/FlutterMacOS.framework.zip" -d "$engine_extract_dir/framework"
          engine_library="$engine_extract_dir/framework/FlutterMacOS.framework/Versions/A/FlutterMacOS"
          nm -gU "$engine_library" | awk '
            $NF == "_shorebird_set_patch_decryption_key_provider" { found = 1 }
            END { if (!found) { print "missing exported patch decryption key provider" > "/dev/stderr"; exit 1 } }
          '
          test -f "$engine_extract_dir/macos-engine/flutter_patched_sdk_product.zip"
          test -f "$engine_extract_dir/macos-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/darwin-${{ matrix.arch }}-release/FlutterMacOS.framework.zip"
          ./scripts/write_sha256.sh macos-engine-${{ matrix.arch }}.tar.gz macos-engine-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload macOS engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-engine-${{ matrix.arch }}
          path: |
            macos-engine-${{ matrix.arch }}.tar.gz
            macos-engine-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  macos-engine-universal:
    name: Assemble universal macOS engine
    needs: [source-checks, macos-engine]
    runs-on: ${{ inputs.macos_heavy_runner || 'macos-15' }}
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download macOS arm64 engine
        uses: actions/download-artifact@v4
        with:
          name: macos-engine-arm64
          path: downloaded-artifacts/arm64

      - name: Download macOS x64 engine
        uses: actions/download-artifact@v4
        with:
          name: macos-engine-x64
          path: downloaded-artifacts/x64

      - name: Assemble universal macOS artifacts
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            mkdir -p "macos-input/$arch"
            python3 scripts/safe_extract_tar.py "downloaded-artifacts/$arch/macos-engine-$arch.tar.gz" "macos-input/$arch"
            unzip -q "macos-input/$arch/macos-engine/FlutterMacOS.framework.zip" -d "macos-input/$arch/framework"
          done
          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/macos-engine-universal/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/darwin-x64-release"
          mkdir -p "$mirror_root"
          python3 flutter/engine/src/flutter/sky/tools/create_macos_framework.py \
            --dst "$PWD/macos-composed/framework" \
            --arm64-out-dir "$PWD/macos-input/arm64/framework" \
            --x64-out-dir "$PWD/macos-input/x64/framework" --zip
          python3 flutter/engine/src/flutter/sky/tools/create_macos_gen_snapshots.py \
            --dst "$PWD/macos-composed/snapshot" \
            --arm64-path "$PWD/macos-input/arm64/macos-engine/gen_snapshot_arm64" \
            --x64-path "$PWD/macos-input/x64/macos-engine/gen_snapshot_x64" --zip
          lipo macos-composed/framework/FlutterMacOS.framework/Versions/A/FlutterMacOS -verify_arch arm64
          lipo macos-composed/framework/FlutterMacOS.framework/Versions/A/FlutterMacOS -verify_arch x86_64
          for engine_arch in arm64 x86_64; do
            nm -arch "$engine_arch" -gU macos-composed/framework/FlutterMacOS.framework/Versions/A/FlutterMacOS | awk '
              $NF == "_shorebird_set_patch_decryption_key_provider" { found = 1 }
              END { if (!found) { print "missing universal framework patch decryption key provider export" > "/dev/stderr"; exit 1 } }
            '
          done
          cp macos-composed/framework/framework.zip "$mirror_root/framework.zip"
          cp macos-composed/snapshot/gen_snapshot.zip "$mirror_root/gen_snapshot.zip"
          python3 - "$mirror_root/artifacts.zip" <<'PYZIP'
          from pathlib import Path
          import sys
          import zipfile

          # Release artifacts.zip contains host tools; the two target snapshotters
          # used by Flutter's universal macOS build live in gen_snapshot.zip.
          with zipfile.ZipFile(sys.argv[1], "w", zipfile.ZIP_DEFLATED) as archive:
              for source, name in [
                  ("macos-input/x64/macos-engine/gen_snapshot_x64", "gen_snapshot"),
                  ("macos-input/x64/macos-engine/analyze_snapshot_x64", "analyze_snapshot"),
              ]:
                  archive.write(source, name)
              archive.writestr("entitlements.txt", "gen_snapshot\nanalyze_snapshot\n")
              archive.writestr("without_entitlements.txt", "\n")
          PYZIP
          test -f "$mirror_root/framework.zip"
          test -f "$mirror_root/gen_snapshot.zip"
          test -f "$mirror_root/artifacts.zip"
          cat > artifacts/macos-engine-universal/manifest.json <<EOF
          {
            "name": "macos-engine-universal",
            "git_sha": "${{ github.sha }}",
            "engine_revision": "${engine_revision}",
            "target_os": "macos",
            "target_archs": ["arm64", "x64"],
            "included": [
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/darwin-x64-release/framework.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/darwin-x64-release/gen_snapshot.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/darwin-x64-release/artifacts.zip"
            ]
          }
          EOF
          tar -C artifacts -czf macos-engine-universal.tar.gz macos-engine-universal
          engine_extract_dir="$(mktemp -d)"
          python3 scripts/safe_extract_tar.py macos-engine-universal.tar.gz "$engine_extract_dir"
          python3 - "$mirror_root" <<'PYZIP'
          from pathlib import Path
          import sys
          import zipfile

          root = Path(sys.argv[1])
          for archive_name, required in {
              "framework.zip": {"FlutterMacOS.xcframework/Info.plist"},
              "gen_snapshot.zip": {"gen_snapshot_arm64", "gen_snapshot_x64"},
              "artifacts.zip": {"gen_snapshot", "analyze_snapshot"},
          }.items():
              with zipfile.ZipFile(root / archive_name) as archive:
                  missing = required - set(archive.namelist())
                  if missing:
                      raise SystemExit(f"{archive_name} missing {sorted(missing)}")
          PYZIP
          ./scripts/write_sha256.sh macos-engine-universal.tar.gz macos-engine-universal.tar.gz.sha256

      - name: Upload universal macOS engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-engine-universal
          path: |
            macos-engine-universal.tar.gz
            macos-engine-universal.tar.gz.sha256
          if-no-files-found: error

  windows-engine:
    name: Build Windows engine artifacts
    needs: source-checks
    runs-on: ${{ inputs.windows_heavy_runner || 'windows-2022' }}
    timeout-minutes: 300
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      MSYS: winsymlinks:nativestrict
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare native Windows build tools
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks true
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 C++ toolchain is required' }
          "GYP_MSVS_OVERRIDE_PATH=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name, $value = $matches[1], $matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and [Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
              }
            }
          }
          if ($LASTEXITCODE) { throw 'VsDevCmd failed' }
          if (!(Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\um\Windows.h")) {
            throw 'Windows SDK 10.0.26100.0 is required by Dart/Chromium'
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap Windows depot_tools
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\depot_tools\bootstrap\win_tools.bat"
          if ($LASTEXITCODE) { throw 'depot_tools Windows bootstrap failed' }
          if (!(Test-Path "$env:GITHUB_WORKSPACE\depot_tools\git.bat")) {
            throw 'depot_tools bootstrap did not generate the required git.bat wrapper'
          }
          $pythonRelative = (Get-Content "$env:GITHUB_WORKSPACE\depot_tools\python3_bin_reldir.txt" -Raw).Trim()
          $pythonBin = Join-Path "$env:GITHUB_WORKSPACE\depot_tools" $pythonRelative
          if (!(Test-Path "$pythonBin\python3.exe")) {
            throw 'depot_tools bootstrap did not install native python3.exe for GN'
          }
          $pythonBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$pythonBin;$env:PATH"
          & "$pythonBin\python3.exe" -c "import shutil, subprocess; assert shutil.which('python3.exe'); subprocess.check_call(['git.bat', '--version'])"
          if ($LASTEXITCODE) { throw 'native Python cannot invoke the depot_tools Git wrapper' }

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Install Windows Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
        run: ./scripts/write_gclient.sh windows

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Configure Windows engine
        working-directory: flutter/engine/src
        run: |
          python3 flutter/tools/gn \
            --windows-cpu=x64 \
            --runtime-mode=release --target-dir=windows_release_x64 \
            --enable-unittests \
            --no-prebuilt-dart-sdk \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false'

      - name: Build Windows engine
        shell: pwsh
        working-directory: flutter/engine/src
        run: |
          # Git Bash prepends its GNU link.exe ahead of the MSVC linker.
          $linker = (Get-Command link.exe -CommandType Application).Source
          if (!$linker.StartsWith($env:GYP_MSVS_OVERRIDE_PATH, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected the Visual Studio linker, found $linker"
          }
          Write-Host "Using native Microsoft linker: $linker"
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-native-cache-tests'
          New-Item -ItemType Directory -Force $results | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue "$results/*.log", "$results/*.xml", "$results/shorebird-list.txt"
          ninja -C out/windows_release_x64 flutter/build/archives:windows_flutter flutter/tools/font_subset:font_subset flutter/shell/common/shorebird:shorebird_unittests flutter/shell/platform/embedder:embedder_unittests flutter/shell/platform/windows:flutter_windows_unittests flutter/build/dart:dart_sdk flutter/flutter_frontend_server:frontend_server flutter/tools/const_finder:const_finder flutter/sky/packages/sky_engine:sky_engine flutter/shell/platform/windows:windows flutter/build/archives:flutter_patched_sdk flutter/impeller/compiler:impellerc 2>&1 | Tee-Object -FilePath "$results/build.log"
          if ($LASTEXITCODE) { throw 'Windows engine and native cache test build failed' }

      - name: Verify Windows engine args
        run: |
          ./scripts/verify_engine_args.sh \
            flutter/engine/src/out/windows_release_x64/args.gn \
            enable_unittests=true \
            dart_dynamic_modules=false dart_enable_aot_patching=true \
            dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true \
            shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false

      - name: Run Windows prepared native cache engine tests
        working-directory: flutter/engine/src
        run: |
          set -euo pipefail
          out="$(cygpath -m "$PWD/out/windows_release_x64")"
          results="$(cygpath -m "$GITHUB_WORKSPACE")/artifacts/windows-native-cache-tests"
          mkdir -p "$results"
          # Native fixtures need Windows paths and the built DLLs on PATH.
          export PATH="$PWD/out/windows_release_x64:$PATH"
          export FLUTTER_BUILD_DIRECTORY="$out"
          test -x "$out/shorebird_unittests.exe"
          test -x "$out/embedder_unittests.exe"
          test -x "$out/flutter_windows_unittests.exe"
          test -s "$out/icudtl.dat"
          test -s "$out/gen/flutter/shell/platform/windows/assets/app_elf_snapshot.so"
          test -s "$out/gen/flutter/shell/platform/embedder/assets/app_elf_snapshot.so"
          rm -f "$results/shorebird.xml" "$results/embedder.xml" "$results/shorebird-list.txt"
          rm -f "$results/windows.xml"
          "$out/shorebird_unittests.exe" --gtest_filter='*' --gtest_list_tests \
            > "$results/shorebird-list.txt" 2> "$results/shorebird-list.stderr.log"
          "$out/shorebird_unittests.exe" --gtest_filter='*' --gtest_repeat=1 \
            --gtest_output="xml:$results/shorebird.xml" 2>&1 | tee "$results/shorebird.log"
          embedder_filter='EmbedderTest.PreparedMemoryImageSurvivesInputAndMultipleEngines:EmbedderTest.InvalidAOTDataSourcesMustReturnError:EmbedderTest.CanCreateAndCollectAValidElfSource:EmbedderTest.CanLaunchAndShutdownWithAValidElfSource'
          "$out/embedder_unittests.exe" --gtest_filter="$embedder_filter" --gtest_repeat=1 \
            --gtest_output="xml:$results/embedder.xml" 2>&1 | tee "$results/embedder.log"
          # The adapter owns a 10-second Dart signal deadline per engine.
          # Bound the separate native process too, including its UI-thread teardown.
          python3 - "$out" "$results" <<'PYWINDOWSTEST' 2>&1 | tee "$results/windows.log"
          from pathlib import Path
          import subprocess
          import sys

          out, results = map(Path, sys.argv[1:])
          subprocess.run([
              str(out / 'flutter_windows_unittests.exe'),
              '--gtest_filter=ShorebirdFlutterWindowsEngineTest.*',
              '--gtest_repeat=1',
              f'--gtest_output=xml:{results / "windows.xml"}',
          ], cwd=out, timeout=120, check=True)
          PYWINDOWSTEST
          python3 "$GITHUB_WORKSPACE/scripts/verify_native_cache_engine_tests.py" --platform windows \
            --shorebird-list "$results/shorebird-list.txt" \
            --shorebird-xml "$results/shorebird.xml" \
            --embedder-xml "$results/embedder.xml" \
            --windows-xml "$results/windows.xml" 2>&1 | tee "$results/validation.log"

      - name: Run Windows updater tests
        shell: pwsh
        working-directory: updater
        run: |
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-native-cache-tests'
          New-Item -ItemType Directory -Force $results | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue "$results/updater.log"
          rustup show active-toolchain
          if ($LASTEXITCODE) { throw 'Windows stable Rust toolchain is unavailable' }
          cargo test -p updater --locked -- --test-threads=1 2>&1 | Tee-Object -FilePath "$results/updater.log"
          if ($LASTEXITCODE) { throw 'Windows updater tests failed' }

      - name: Upload Windows native cache engine test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-cache-engine-tests
          path: artifacts/windows-native-cache-tests/
          if-no-files-found: error

      - name: Set up Go for Windows lifecycle
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: shorebird-server/go.sum

      - name: Restore verified Flutter version tag for lifecycle
        shell: bash
        run: python3 scripts/prepare_flutter_version_tag.py flutter

      - name: Prepare Windows encrypted lifecycle tools
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'flutter/engine/src/out/windows_release_x64'
          Expand-Archive -LiteralPath "$out/zip_archives/flutter_patched_sdk_product.zip" -DestinationPath $out -Force
          # Flutter's local snapshotter lookup searches the output root.
          Copy-Item "$out/gen_snapshot/gen_snapshot.exe" "$out/gen_snapshot.exe" -Force
          $cache = Join-Path $env:GITHUB_WORKSPACE 'flutter/bin/cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          if (Test-Path "$cache/dart-sdk") { Remove-Item -Recurse -Force "$cache/dart-sdk" }
          Copy-Item "$out/dart-sdk" "$cache/dart-sdk" -Recurse
          $env:PUB_CACHE = Join-Path $env:RUNNER_TEMP 'shorebird-lifecycle-pub'
          "PUB_CACHE=$env:PUB_CACHE" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          foreach ($project in @('shorebird', 'flutter/packages/flutter_tools')) {
            Push-Location (Join-Path $env:GITHUB_WORKSPACE $project)
            try {
              & "$out/dart-sdk/bin/dart.exe" pub get
              if ($LASTEXITCODE) { throw "Lifecycle dependency resolution failed: $project" }
            } finally { Pop-Location }
          }
          Push-Location updater
          try {
            cargo build --release --locked -p patch --bin patch
            if ($LASTEXITCODE) { throw 'Windows public patch tool build failed' }
          } finally { Pop-Location }

      - name: Run Windows DPAPI provider contract
        shell: pwsh
        run: |
          $fixture = (Resolve-Path testapps/license_flavor_patch_test/tool/windows_native).Path
          $public = (Resolve-Path flutter/engine/src/out/windows_release_x64).Path
          $build = Join-Path $env:RUNNER_TEMP ("shorebird-native-probe-" + [guid]::NewGuid())
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-native-provider-tests'
          New-Item -ItemType Directory $build | Out-Null
          New-Item -ItemType Directory -Force $results | Out-Null
          Push-Location $build
          try {
            cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /I"$public" "$fixture/native_cache_contract_test.cpp" /Fe:native_cache_contract_test.exe /link winhttp.lib crypt32.lib bcrypt.lib 2>&1 | Tee-Object "$results/build.log"
            if ($LASTEXITCODE) { throw 'Native provider probe compilation failed' }
            & ./native_cache_contract_test.exe 2>&1 | Tee-Object "$results/test.log"
            if ($LASTEXITCODE) { throw 'Native provider probe failed' }
          } finally {
            Pop-Location
            Remove-Item -Recurse -Force $build
          }

      - name: Run Windows encrypted native lifecycle
        shell: pwsh
        timeout-minutes: 75
        run: |
          $engine = Join-Path $env:GITHUB_WORKSPACE 'flutter/engine/src'
          $out = Join-Path $engine 'out/windows_release_x64'
          $work = Join-Path $env:RUNNER_TEMP ("shorebird-native-e2e-" + [guid]::NewGuid())
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-native-cache-e2e'
          python3 testapps/license_flavor_patch_test/tool/windows_native_cache_e2e.py run --execute --engine-src $engine --host-engine windows_release_x64 --target-engine windows_release_x64 --tooling-dart "$out/dart-sdk/bin/dart.exe" --patch-tool "$env:GITHUB_WORKSPACE/updater/target/release/patch.exe" --pub-cache $env:PUB_CACHE --work $work --results $results
          if ($LASTEXITCODE) { throw 'Windows encrypted native lifecycle failed' }
          $report = Get-Content "$results/results.json" -Raw | ConvertFrom-Json
          if ($report.schema -ne 'windows-native-cache-e2e-v1' -or $report.result -ne 'passed' -or $report.cleanup -ne 'owned processes, ports, disposable app cache, private session removed') {
            throw 'Windows lifecycle did not produce a passing cleaned execution report'
          }

      - name: Upload Windows native provider test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-provider-tests
          path: artifacts/windows-native-provider-tests/
          if-no-files-found: error

      - name: Upload Windows encrypted lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-cache-e2e
          path: artifacts/windows-native-cache-e2e/results.json
          if-no-files-found: error

      - name: Run Windows native V2 variant lifecycle
        shell: pwsh
        timeout-minutes: 90
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = Join-Path $env:GITHUB_WORKSPACE 'flutter/engine/src'
          $out = Join-Path $engine 'out/windows_release_x64'
          $work = Join-Path $env:RUNNER_TEMP ("shorebird-variant-e2e-" + [guid]::NewGuid())
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-native-variant-e2e'
          python3 testapps/license_flavor_patch_test/tool/windows_variant_e2e.py run --execute --arch x64 --engine-src $engine --host-engine windows_release_x64 --target-engine windows_release_x64 --tooling-dart "$out/dart-sdk/bin/dart.exe" --patch-tool "$env:GITHUB_WORKSPACE/updater/target/release/patch.exe" --pub-cache $env:PUB_CACHE --work $work --results $results 2>&1 | Tee-Object "$results.log"
          if ($LASTEXITCODE) { throw 'Windows native V2 variant lifecycle failed' }
          $validate = @'
          import json, sys
          report_path, platform, arch = sys.argv[1:]
          report = json.load(open(report_path))
          runtime_arch = {'x64': 'x86_64', 'arm64': 'aarch64'}[arch]
          if (report.get('schema') != 'native-variant-e2e-v2' or
              report.get('result') != 'passed' or report.get('runtime_acceptance') is not True or
              report.get('platform') != platform or report.get('target_arch') != arch or
              report.get('runtime_arch') != runtime_arch or
              report.get('cleanup') != 'owned platform processes, services, private work, app cache and provider keys removed'):
              raise SystemExit('Native V2 lifecycle requires real cleaned execution on the selected platform and architecture')
          machines = report.get('binary_architectures', {})
          if not machines or any(value.get('architecture') != arch or value.get('native_target') is not True for value in machines.values()):
              raise SystemExit('Native V2 binary architecture receipts are incomplete')
          required = {
              'actual-cli-staged-native-scope', 'actual-cli-release-free',
              'actual-cli-patch-pro_seed', 'actual-cli-patch-pro', 'actual-cli-patch-enterprise',
              'initial-free-public-installation', 'same-content-higher-epoch', 'same-content-cold-adoption',
              'offline-missing-key-free', 'offline-missing-key-recovery-pro',
              'offline-wrong-key-free', 'offline-wrong-key-recovery-pro',
              'released-bundle-unchanged', 'native-v2-final-cache',
          }
          previous = 'free'
          for index, variant in enumerate(('pro', 'enterprise', 'pro', 'free', 'enterprise', 'free')):
              required.update((f'online-{index}-{previous}-accept-{variant}', f'offline-cold-{index}-{variant}'))
              previous = variant
          adversarial_required = {
              'adversarial-select-pro-check',
              'adversarial-select-pro-cold',
              'owned-ciphertext-flip',
              'ciphertext-offline-free',
              'ciphertext-signed-free-check',
              'ciphertext-signed-free-cold',
              'ciphertext-same-pro-redownload-check',
              'ciphertext-same-pro-redownload-cold',
              'ciphertext-real-redownload',
              'untrusted-cached-signature-flip',
              'cached-signature-still-valid-pro',
              'server-returned-old-response-capture',
              'actual-leased-pro-check',
              'actual-leased-pro-cold',
              'platform-clock-expired-free',
              'platform-lease-expiry',
              'old-signed-response-rejected',
              'old-signed-response-requests',
              'corrupt-stale-response-combined-rejected',
              'corrupt-stale-response-combined-requests',
              'expired-server-signed-free',
              'expired-server-free-cold',
              'before-enterprise-rollback-check',
              'before-enterprise-rollback-cold',
              'rollback-enterprise',
              'rollback-server-signed-free',
              'rollback-cold-free',
              'rollforward-enterprise',
              'rollforward-alone-still-free',
              'rollforward-cold-free',
              'explicit-enterprise-restored-check',
              'explicit-enterprise-restored-cold',
              'adversarial-final-signed-free-check',
              'adversarial-final-signed-free-cold',
              'adversarial-final-offline-free',
          }
          required.update(adversarial_required)
          expected_cases = (
              'owned-ciphertext-offline-content-unavailable',
              'signed-free-same-pro-real-redownload',
              'cached-signature-keeps-valid-pro',
              'actual-paid-lease-platform-clock-expiry',
              'server-returned-older-response-rejected-independent-nonce',
              'corrupt-stale-response-combined-rejection',
              'enterprise-rollback-signed-free',
              'rollforward-alone-stays-free',
              'explicit-enterprise-reauthorization',
              'final-offline-free',
          )
          if report.get('adversarial_cases') != list(expected_cases):
              raise SystemExit('Native V2 adversarial case completion is missing or changed')
          if not required.issubset({stage['name'] for stage in report.get('stages', [])}):
              raise SystemExit('Native V2 lifecycle publication, grants, fallback, data and cold-boot evidence is incomplete')
          if report.get('provisioning', {}).get('accepted', 0) < 1 or not report.get('final_application_data'):
              raise SystemExit('Native V2 lifecycle authenticated delivery or application data proof is missing')
          stages = {stage['name']: stage.get('evidence', {}) for stage in report['stages']}
          if stages['ciphertext-real-redownload'].get('check_status') != 'outdated':
              raise SystemExit('Native V2 ciphertext recovery did not execute a real public download')
          import math
          lease = stages['platform-lease-expiry']
          if (any(type(lease.get(field)) not in (int, float) or not math.isfinite(lease[field]) for field in ('deadline', 'wait_completed', 'launch_started')) or
              lease['wait_completed'] <= lease['deadline'] or lease['launch_started'] <= lease['deadline']):
              raise SystemExit('Native V2 expiry lacks an observed platform clock boundary')
          for label in ('old-signed-response', 'corrupt-stale-response-combined'):
              delivered = stages[label + '-requests']
              checks = delivered.get('requests')
              if (type(delivered.get('delivered_check_responses')) is not int or delivered['delivered_check_responses'] < 1 or
                  not isinstance(checks, list) or len(checks) != delivered['delivered_check_responses'] or
                  delivered.get('real_api_and_provisioning_stopped') is not True):
                  raise SystemExit('Native V2 rejection lacks successful owned replay delivery with real services stopped')
          '@
          python3 -c $validate "$results/results.json" windows x64
          if ($LASTEXITCODE) { throw 'Windows native V2 variant execution receipt failed' }

      - name: Upload Windows native V2 variant lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-variant-e2e
          path: |
            artifacts/windows-native-variant-e2e/
            artifacts/windows-native-variant-e2e.log
          if-no-files-found: error

      - name: Package Windows engine artifacts
        run: |
          set -euo pipefail
          out=flutter/engine/src/out/windows_release_x64
          mkdir -p artifacts/windows-engine
          cp "$out/args.gn" artifacts/windows-engine/windows_release_x64.args.gn
          cp "$out/zip_archives/windows-x64-release/windows-x64-flutter.zip" artifacts/windows-engine/
          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/windows-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/windows-x64-release"
          mkdir -p "$mirror_root"
          cp artifacts/windows-engine/windows-x64-flutter.zip "$mirror_root/windows-x64-flutter.zip"
          test -f "$mirror_root/windows-x64-flutter.zip"
          font_zip="$out/zip_archives/windows-x64/font-subset.zip"
          cp "$font_zip" artifacts/windows-engine/font-subset.zip
          font_mirror="artifacts/windows-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/windows-x64"
          mkdir -p "$font_mirror"
          cp "$font_zip" "$font_mirror/font-subset.zip"
          test -f "$font_mirror/font-subset.zip"
          font_smoke_dir="$(mktemp -d)"
          font_dart="$(find "$out" -maxdepth 3 -type f -name dartvm.exe -print -quit)"
          test -n "$font_dart"
          python3 - artifacts/windows-engine/font-subset.zip "$font_smoke_dir" "$font_dart" <<'PYFONT'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import zipfile

          archive_path, work, dart = map(Path, sys.argv[1:])
          executable = "font-subset.exe" if os.name == "nt" else "font-subset"
          with zipfile.ZipFile(archive_path) as archive:
              for name in (executable, "const_finder.dart.snapshot"):
                  if archive.getinfo(name).file_size == 0:
                      raise SystemExit(f"empty font tool: {name}")
              archive.extractall(work)
          binary = work / executable
          binary.chmod(0o755)
          source_font = Path("flutter/engine/src/flutter/txt/third_party/fonts/Roboto-Regular.ttf").resolve()
          output_font = (work / "subset.ttf").resolve()
          subprocess.run([str(binary.resolve()), str(output_font), str(source_font)],
                         input="65 66\n", text=True, check=True)
          if not 0 < output_font.stat().st_size < source_font.stat().st_size:
              raise SystemExit("font subset did not produce a smaller non-empty font")
          subprocess.run([str(dart.resolve()), str((work / "const_finder.dart.snapshot").resolve()),
                          "--kernel-file=unused.dill", "--class-library-uri=package:unused", "--class-name=Unused", "--help"],
                         check=True, stdout=subprocess.DEVNULL)
          PYFONT
          cat > artifacts/windows-engine/manifest.json <<EOF
          {
            "name": "windows-engine-x64",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "engine_revision": "${engine_revision}",
            "target_os": "windows",
            "target_arch": "x64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": false,
            "shorebird_enable_aot_patching": true,
            "shorebird_use_interpreter": false,
            "included": [
              "font-subset.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/windows-x64/font-subset.zip",
              "windows_release_x64.args.gn",
              "windows-x64-flutter.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/windows-x64-release/windows-x64-flutter.zip"
            ]
          }
          EOF
          tar -C artifacts -czf windows-engine-x64.tar.gz windows-engine
          engine_extract_dir="$(mktemp -d)"
          tar -C "$engine_extract_dir" -xzf windows-engine-x64.tar.gz
          test -f "$engine_extract_dir/windows-engine/manifest.json"
          test -f "$engine_extract_dir/windows-engine/font-subset.zip"
          test -f "$engine_extract_dir/windows-engine/windows_release_x64.args.gn"
          test -f "$engine_extract_dir/windows-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/windows-x64-release/windows-x64-flutter.zip"
          python3 - "$engine_extract_dir/windows-engine/windows-x64-flutter.zip" <<'PYZIP'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              required = {"flutter_windows.dll", "flutter_windows.dll.lib", "gen_snapshot.exe", "flutter_windows.h"}
              missing = required - set(archive.namelist())
              if missing:
                  raise SystemExit(f"missing Windows engine files: {sorted(missing)}")
          PYZIP
          unzip -q "$engine_extract_dir/windows-engine/windows-x64-flutter.zip" -d "$engine_extract_dir/windows-tools"
          "$engine_extract_dir/windows-tools/gen_snapshot.exe" --version
          python3 - "$engine_extract_dir/windows-tools/flutter_windows.dll" <<'PYDLL'
          import ctypes
          import sys

          library = ctypes.WinDLL(sys.argv[1])
          getattr(library, "shorebird_set_patch_decryption_key_provider")
          PYDLL
          ./scripts/write_sha256.sh windows-engine-x64.tar.gz windows-engine-x64.tar.gz.sha256

      - name: Upload Windows engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-engine-x64
          path: |
            windows-engine-x64.tar.gz
            windows-engine-x64.tar.gz.sha256
          if-no-files-found: error

  android-host-tools:
    name: Build Android host snapshotters
    needs: source-checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      MSYS: winsymlinks:nativestrict
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, arm64, x64]
        host: [darwin-x64, windows-x64]
        include:
          - host: darwin-x64
            runner: ${{ inputs.macos_heavy_runner || 'macos-15' }}
            gclient_platform: macos
            snapshot_target: flutter/shell/platform/android:gen_snapshot
          - host: windows-x64
            runner: ${{ inputs.windows_heavy_runner || 'windows-2022' }}
            gclient_platform: windows
            snapshot_target: flutter/build/archives:archive_win_gen_snapshot
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare native Windows build tools
        if: ${{ matrix.host == 'windows-x64' }}
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks true
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 C++ toolchain is required' }
          "GYP_MSVS_OVERRIDE_PATH=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name, $value = $matches[1], $matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and [Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
              }
            }
          }
          if ($LASTEXITCODE) { throw 'VsDevCmd failed' }
          if (!(Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\um\Windows.h")) {
            throw 'Windows SDK 10.0.26100.0 is required by Dart/Chromium'
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap Windows depot_tools
        if: ${{ matrix.host == 'windows-x64' }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\depot_tools\bootstrap\win_tools.bat"
          if ($LASTEXITCODE) { throw 'depot_tools Windows bootstrap failed' }
          if (!(Test-Path "$env:GITHUB_WORKSPACE\depot_tools\git.bat")) {
            throw 'depot_tools bootstrap did not generate the required git.bat wrapper'
          }
          $pythonRelative = (Get-Content "$env:GITHUB_WORKSPACE\depot_tools\python3_bin_reldir.txt" -Raw).Trim()
          $pythonBin = Join-Path "$env:GITHUB_WORKSPACE\depot_tools" $pythonRelative
          if (!(Test-Path "$pythonBin\python3.exe")) {
            throw 'depot_tools bootstrap did not install native python3.exe for GN'
          }
          $pythonBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$pythonBin;$env:PATH"
          & "$pythonBin\python3.exe" -c "import shutil, subprocess; assert shutil.which('python3.exe'); subprocess.check_call(['git.bat', '--version'])"
          if ($LASTEXITCODE) { throw 'native Python cannot invoke the depot_tools Git wrapper' }

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
        run: ./scripts/write_gclient.sh ${{ matrix.gclient_platform }}

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Configure Android host snapshotters
        working-directory: flutter/engine/src
        run: |
          python3 flutter/tools/gn --android --android-cpu=${{ matrix.arch }} \
            --runtime-mode=release --target-dir=android_release_${{ matrix.arch }} \
            --no-prebuilt-dart-sdk \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false'

      - name: Build Android host snapshotters
        working-directory: flutter/engine/src
        run: ninja -C out/android_release_${{ matrix.arch }} ${{ matrix.snapshot_target }}

      - name: Verify Android host snapshotter args
        run: |
          ./scripts/verify_engine_args.sh \
            flutter/engine/src/out/android_release_${{ matrix.arch }}/args.gn \
            dart_dynamic_modules=false dart_enable_aot_patching=true \
            dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true \
            shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false

      - name: Package Android host snapshotters
        run: |
          set -euo pipefail
          engine_revision="$(cat flutter/bin/internal/engine.version)"
          out=flutter/engine/src/out/android_release_${{ matrix.arch }}
          mirror_root="artifacts/android-host-tools/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/android-${{ matrix.arch }}-release"
          mkdir -p "$mirror_root"
          cp "$out/zip_archives/android-${{ matrix.arch }}-release/${{ matrix.host }}.zip" "$mirror_root/${{ matrix.host }}.zip"
          test -f "$mirror_root/${{ matrix.host }}.zip"
          cp "$out/args.gn" artifacts/android-host-tools/args.gn
          python3 - "$mirror_root/${{ matrix.host }}.zip" "${{ matrix.host }}" <<'PYZIP'
          import sys
          import zipfile

          name = "gen_snapshot.exe" if sys.argv[2] == "windows-x64" else "gen_snapshot"
          with zipfile.ZipFile(sys.argv[1]) as archive:
              if name not in archive.namelist() or archive.getinfo(name).file_size == 0:
                  raise SystemExit(f"missing executable snapshotter: {name}")
          PYZIP
          snapshotter_smoke="$(mktemp -d)"
          unzip -q "$mirror_root/${{ matrix.host }}.zip" -d "$snapshotter_smoke"
          if [[ "${{ matrix.host }}" == darwin-x64 ]]; then
            codesign --force --sign - "$snapshotter_smoke/gen_snapshot"
            lipo "$snapshotter_smoke/gen_snapshot" -verify_arch arm64
            lipo "$snapshotter_smoke/gen_snapshot" -verify_arch x86_64
            "$snapshotter_smoke/gen_snapshot" --version
            # Publish the same signed universal binary that passed the host smoke.
            rm "$mirror_root/${{ matrix.host }}.zip"
            snapshotter_archive="$PWD/$mirror_root/${{ matrix.host }}.zip"
            (cd "$snapshotter_smoke" && zip -qr "$snapshotter_archive" .)
          else
            "$snapshotter_smoke/gen_snapshot.exe" --version
          fi
          cat > artifacts/android-host-tools/manifest.json <<EOF
          {
            "name": "android-host-tools-${{ matrix.host }}-${{ matrix.arch }}",
            "git_sha": "${{ github.sha }}",
            "engine_revision": "${engine_revision}",
            "target_os": "android",
            "target_arch": "${{ matrix.arch }}",
            "host": "${{ matrix.host }}",
            "included": [
              "args.gn",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/android-${{ matrix.arch }}-release/${{ matrix.host }}.zip"
            ]
          }
          EOF
          tar -C artifacts -czf android-host-tools-${{ matrix.host }}-${{ matrix.arch }}.tar.gz android-host-tools
          engine_extract_dir="$(mktemp -d)"
          tar -C "$engine_extract_dir" -xzf android-host-tools-${{ matrix.host }}-${{ matrix.arch }}.tar.gz
          test -f "$engine_extract_dir/android-host-tools/manifest.json"
          test -f "$engine_extract_dir/android-host-tools/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/android-${{ matrix.arch }}-release/${{ matrix.host }}.zip"
          ./scripts/write_sha256.sh android-host-tools-${{ matrix.host }}-${{ matrix.arch }}.tar.gz android-host-tools-${{ matrix.host }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload Android host snapshotters
        uses: actions/upload-artifact@v4
        with:
          name: android-host-tools-${{ matrix.host }}-${{ matrix.arch }}
          path: |
            android-host-tools-${{ matrix.host }}-${{ matrix.arch }}.tar.gz
            android-host-tools-${{ matrix.host }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  custom-dart-sdk-linux-arm64:
    name: Build custom Dart SDK (Linux native ARM64)
    needs: source-checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up native ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Record native runtime verifier interpreter
        run: |
          native_python="$(python -c 'import sys; print(sys.executable)')"
          if command -v cygpath >/dev/null 2>&1; then native_python="$(cygpath -m "$native_python")"; fi
          echo "NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"
          "$native_python" scripts/verify_native_desktop_arch.py --platform linux --arch arm64 --require-native-host

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Free Ubuntu runner disk
        run: ./scripts/free_ci_disk_linux.sh

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$SDK_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        run: ./scripts/write_gclient.sh linux

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: Generate patched Dart SDK build files
        working-directory: dart-sdk
        run: |
          "$NATIVE_PYTHON" tools/gn.py \
            --mode release \
            --arch arm64 \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=true'

      - name: Verify patched Dart SDK args
        run: ./scripts/verify_dart_sdk_args.sh dart-sdk/out/ReleaseARM64/args.gn

      - name: Verify ARM64 SDK target configuration
        run: ./scripts/verify_engine_args.sh dart-sdk/out/ReleaseARM64/args.gn 'target_cpu="arm64"' 'host_cpu="arm64"'

      - name: Build patched Dart SDK
        working-directory: dart-sdk
        run: |
          ninja -C out/ReleaseARM64 create_sdk runtime gen_snapshot dartaotruntime dart_engine_aot_shared dart gen_snapshot_product dartaotruntime_product vm_platform_product dart_engine_aot_shared_product dartvm product_metadata_test run_ffi_unit_tests

      - name: Run shared FFI ABI golden tests
        working-directory: dart-sdk
        run: python3 tools/test.py --mode=release --arch=arm64 --tasks=2 --progress=line ffi_unit

      - name: Build ELF memory loader test
        working-directory: dart-sdk
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/linux-elf-memory-loader-tests"
          mkdir -p "$results"
          rm -f "$results/build.log" "$results/loader.log" "$results/acg-denial.log"
          ninja -C out/ReleaseARM64 elf_loader_memory_test 2>&1 | tee "$results/build.log"

      - name: Run ELF memory loader test
        working-directory: dart-sdk
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/linux-elf-memory-loader-tests"
          test -x out/ReleaseARM64/elf_loader_memory_test
          out/ReleaseARM64/elf_loader_memory_test 2>&1 | tee "$results/loader.log"
          tr -d '\r' < "$results/loader.log" | grep -Fx 'ELF memory loader tests passed'

      - name: Upload ELF memory loader test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-elf-memory-loader-tests-arm64
          path: artifacts/linux-elf-memory-loader-tests/
          if-no-files-found: error

      - name: Verify built SDK developer tools
        run: python3 scripts/verify_dart_sdk_tooling.py --dart "$PWD/dart-sdk/out/ReleaseARM64/dart-sdk/bin/dart"

      - name: Run focused patch API tests
        working-directory: dart-sdk/out/ReleaseARM64
        run: |
          ./run_vm_tests DartAPI_AotPatchingConfiguration
          ./run_vm_tests DartAPI_BytecodePatchReloadConfiguration
          ./run_vm_tests DartAPI_SnapshotRegionSizes
          ./run_vm_tests DartAPI_SnapshotRegionSizesRejectInvalidHeaders

      - name: Run zone memory tagging capability tests
        working-directory: dart-sdk/out/ReleaseARM64
        run: |
          set -euo pipefail
          ./run_vm_tests ZoneMemoryTaggingUnsupportedPreservesTaggedPointers
          ./run_vm_tests ZoneMemoryTaggingSetFailurePreservesTaggedPointers
          ./run_vm_tests ZoneMemoryTaggingGetFailure
          ./run_vm_tests ZoneMemoryTaggingIncompleteControl
          ./run_vm_tests ZoneMemoryTaggingSupportedFaultModes
          ./run_vm_tests ZoneWithMemoryTagging

      - name: Resolve public encryption tooling
        working-directory: shorebird
        run: ../dart-sdk/out/ReleaseARM64/dart-sdk/bin/dart pub get

      - name: Test replacement compiler contracts
        working-directory: dart-sdk
        run: >-
          out/ReleaseARM64/dart-sdk/bin/dart --packages=.dart_tool/package_config.json
          third_party/pkg/test/pkgs/test/bin/test.dart
          pkg/dart2bytecode/test/patch_test.dart
          pkg/dart2bytecode/test/full_replacement_test.dart
          pkg/dart2bytecode/test/native_assets_profile_test.dart
          pkg/frontend_server/test/shorebird_native_assets_descriptor_test.dart
          pkg/dart2bytecode/test/shorebird_ios_full_replacement_target_test.dart
          pkg/frontend_server/test/shorebird_ios_full_replacement_target_test.dart
          pkg/vm/test/shorebird_ios_full_replacement_target_test.dart
          pkg/vm/test/native_assets/synthesizer_test.dart --concurrency=1

      - name: Run encrypted no-JIT replacement regression
        run: >-
          python3 scripts/verify_encrypted_aot_runtime.py
          --build-dir dart-sdk/out/ReleaseARM64
          --tooling-dart dart-sdk/out/ReleaseARM64/dart-sdk/bin/dart

      - name: Run PRODUCT no-TFA startup regression
        run: python3 dart-sdk/tools/test_aot_no_tfa_startup.py --build-dir dart-sdk/out/ReleaseARM64

      - name: Run boot-time structural patch regression
        run: python3 dart-sdk/tools/test_aot_structural_patch.py --build-dir dart-sdk/out/ReleaseARM64

      - name: Run PRODUCT structural patch regression
        run: python3 dart-sdk/tools/test_aot_structural_patch.py --build-dir dart-sdk/out/ReleaseARM64 --product

      - name: Run PRODUCT full replacement regression
        run: python3 dart-sdk/tools/test_aot_full_replacement.py --build-dir dart-sdk/out/ReleaseARM64 --product

      - name: Run PRODUCT interpreter metadata regression
        run: python3 dart-sdk/tools/test_aot_product_metadata.py --build-dir dart-sdk/out/ReleaseARM64

      - name: Run PRODUCT host resolver regression
        run: python3 dart-sdk/tools/test_aot_host_resolvers.py --build-dir dart-sdk/out/ReleaseARM64

      - name: Run PRODUCT encrypted full replacement regression
        run: >-
          python3 scripts/verify_encrypted_aot_runtime.py --full-replacement --product
          --build-dir dart-sdk/out/ReleaseARM64
          --tooling-dart dart-sdk/out/ReleaseARM64/dart-sdk/bin/dart

      - name: Run encrypted structural patch regression
        run: >-
          python3 scripts/verify_encrypted_aot_runtime.py --structural
          --build-dir dart-sdk/out/ReleaseARM64
          --tooling-dart dart-sdk/out/ReleaseARM64/dart-sdk/bin/dart

      - name: Run PRODUCT encrypted structural patch regression
        run: >-
          python3 scripts/verify_encrypted_aot_runtime.py --structural --product
          --build-dir dart-sdk/out/ReleaseARM64
          --tooling-dart dart-sdk/out/ReleaseARM64/dart-sdk/bin/dart

      - name: Package Dart SDK artifact
        run: |
          mkdir -p artifacts/custom-dart-sdk-linux-arm64
          cp -R dart-sdk/out/ReleaseARM64/dart-sdk artifacts/custom-dart-sdk-linux-arm64/
          cp dart-sdk/out/ReleaseARM64/gen_snapshot artifacts/custom-dart-sdk-linux-arm64/
          cp dart-sdk/out/ReleaseARM64/dartaotruntime artifacts/custom-dart-sdk-linux-arm64/
          cp dart-sdk/out/ReleaseARM64/args.gn artifacts/custom-dart-sdk-linux-arm64/
          dart_sdk_revision="$(git -C dart-sdk rev-parse HEAD)"
          cat > artifacts/custom-dart-sdk-linux-arm64/manifest.json <<EOF
          {
            "name": "custom-dart-sdk-linux-arm64",
            "git_sha": "${{ github.sha }}",
            "dart_sdk_git_sha": "${dart_sdk_revision}",
            "runner_os": "${{ runner.os }}",
            "dart_arch": "arm64",
            "dart_build_dir": "dart-sdk/out/ReleaseARM64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": true,
            "included": [
              "dart-sdk/",
              "gen_snapshot",
              "dartaotruntime",
              "args.gn"
            ]
          }
          EOF
          tar -C artifacts -czf custom-dart-sdk-linux-arm64.tar.gz custom-dart-sdk-linux-arm64
          sdk_extract_dir="$(mktemp -d)"
          tar -C "$sdk_extract_dir" -xzf custom-dart-sdk-linux-arm64.tar.gz
          test -f "$sdk_extract_dir/custom-dart-sdk-linux-arm64/manifest.json"
          test -f "$sdk_extract_dir/custom-dart-sdk-linux-arm64/args.gn"
          test -x "$sdk_extract_dir/custom-dart-sdk-linux-arm64/dart-sdk/bin/dart"
          test -x "$sdk_extract_dir/custom-dart-sdk-linux-arm64/gen_snapshot"
          test -x "$sdk_extract_dir/custom-dart-sdk-linux-arm64/dartaotruntime"
          "$sdk_extract_dir/custom-dart-sdk-linux-arm64/dart-sdk/bin/dart" --version
          (
            cd dart-sdk/out/ReleaseARM64
            zip -qr "$GITHUB_WORKSPACE/dart-sdk-linux-arm64.zip" dart-sdk
          )
          release_sdk_extract_dir="$(mktemp -d)"
          unzip -q dart-sdk-linux-arm64.zip -d "$release_sdk_extract_dir"
          test -x "$release_sdk_extract_dir/dart-sdk/bin/dart"
          "$release_sdk_extract_dir/dart-sdk/bin/dart" --version
          ./scripts/write_sha256.sh custom-dart-sdk-linux-arm64.tar.gz custom-dart-sdk-linux-arm64.tar.gz.sha256
          ./scripts/write_sha256.sh dart-sdk-linux-arm64.zip dart-sdk-linux-arm64.zip.sha256

      - name: Verify packaged native ARM64 Dart SDK
        run: |
          "$NATIVE_PYTHON" scripts/verify_native_desktop_arch.py --platform linux --arch arm64 --require-native-host \
            --binary dart-sdk/out/ReleaseARM64/dart-sdk/bin/dart \
            --binary dart-sdk/out/ReleaseARM64/gen_snapshot \
            --binary dart-sdk/out/ReleaseARM64/dartaotruntime \
            --build-tool dart-sdk/buildtools/gn \
            --build-tool dart-sdk/buildtools/linux-arm64/clang/bin/clang++

      - name: Upload custom Dart SDK
        uses: actions/upload-artifact@v4
        with:
          name: custom-dart-sdk-linux-arm64
          path: |
            custom-dart-sdk-linux-arm64.tar.gz
            custom-dart-sdk-linux-arm64.tar.gz.sha256
            dart-sdk-linux-arm64.zip
            dart-sdk-linux-arm64.zip.sha256
          if-no-files-found: error

  custom-dart-sdk-windows-arm64:
    name: Build custom Dart SDK (Windows arm64)
    needs: source-checks
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 180
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    env:
