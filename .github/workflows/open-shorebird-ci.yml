          if command -v cygpath >/dev/null 2>&1; then native_python="$(cygpath -m "$native_python")"; fi
          echo "NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"
          "$native_python" scripts/verify_native_desktop_arch.py --platform windows --arch arm64 --require-native-host

      - name: Prepare native Windows build tools
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks true
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[18.0,19.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2026 ARM64 C++ toolchain is required' }
          "GYP_MSVS_OVERRIDE_PATH=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "vs2026_install=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=arm64 -host_arch=arm64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name, $value = $matches[1], $matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and [Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
              }
            }
          }
          if ($LASTEXITCODE) { throw 'VsDevCmd failed' }
          if (!(Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\um\Windows.h")) {
            throw 'Windows SDK 10.0.26100.0 is required by Dart/Chromium'
          }

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap Windows depot_tools
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\depot_tools\bootstrap\win_tools.bat"
          if ($LASTEXITCODE) { throw 'depot_tools Windows bootstrap failed' }
          if (!(Test-Path "$env:GITHUB_WORKSPACE\depot_tools\git.bat")) {
            throw 'depot_tools bootstrap did not generate the required git.bat wrapper'
          }
          $pythonRelative = (Get-Content "$env:GITHUB_WORKSPACE\depot_tools\python3_bin_reldir.txt" -Raw).Trim()
          $pythonBin = Join-Path "$env:GITHUB_WORKSPACE\depot_tools" $pythonRelative
          if (!(Test-Path "$pythonBin\python3.exe")) {
            throw 'depot_tools bootstrap did not install python3.exe for GN'
          }
          $pythonBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$pythonBin;$env:PATH"
          & "$pythonBin\python3.exe" -c "import shutil, subprocess; assert shutil.which('python3.exe'); subprocess.check_call(['git.bat', '--version'])"
          if ($LASTEXITCODE) { throw 'Python cannot invoke the depot_tools Git wrapper' }

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$SDK_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        run: ./scripts/write_gclient.sh windows

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: Generate patched Dart SDK build files
        working-directory: dart-sdk
        run: |
          # tools/gn.py Main passes an empty environment to GN. Match the public
          # tools/build.py caller so GN inherits native Python and Visual Studio.
          "$NATIVE_PYTHON" - <<'PYGN'
          import os
          import sys

          # gn.py locates DART_ROOT from argv[0] when imported by build.py.
          sys.argv[0] = 'tools/gn.py'
          sys.path.insert(0, 'tools')
          import gn

          options = gn.parse_args([
              'tools/gn.py', '--mode', 'release', '--arch', 'arm64',
              '--gn-args=dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=true',
          ])
          if options is None:
              raise SystemExit('invalid Dart GN options')
          raise SystemExit(gn.RunGnOnConfiguredConfigurations(options, dict(os.environ)))
          PYGN

      - name: Verify patched Dart SDK args
        run: ./scripts/verify_dart_sdk_args.sh dart-sdk/out/ReleaseARM64/args.gn

      - name: Verify ARM64 SDK target configuration
        run: ./scripts/verify_engine_args.sh dart-sdk/out/ReleaseARM64/args.gn 'target_cpu="arm64"' 'host_cpu="arm64"'

      - name: Build patched Dart SDK
        working-directory: dart-sdk
        run: |
          ninja -C out/ReleaseARM64 create_sdk runtime gen_snapshot dartaotruntime run_ffi_unit_tests

      - name: Run shared FFI ABI golden tests
        working-directory: dart-sdk
        run: python3 tools/test.py --mode=release --arch=arm64 --tasks=2 --progress=line ffi_unit

      - name: Build ELF memory loader test
        working-directory: dart-sdk
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/windows-elf-memory-loader-tests"
          mkdir -p "$results"
          rm -f "$results/build.log" "$results/loader.log" "$results/acg-denial.log"
          ninja -C out/ReleaseARM64 elf_loader_memory_test 2>&1 | tee "$results/build.log"

      - name: Run ELF memory loader test
        working-directory: dart-sdk
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/windows-elf-memory-loader-tests"
          test -x out/ReleaseARM64/elf_loader_memory_test.exe
          out/ReleaseARM64/elf_loader_memory_test.exe 2>&1 | tee "$results/loader.log"
          tr -d '\r' < "$results/loader.log" | grep -Fx 'ELF memory loader tests passed'
          # A fresh process confines the irreversible ACG policy to this test.
          out/ReleaseARM64/elf_loader_memory_test.exe --acg-denial 2>&1 | tee "$results/acg-denial.log"
          tr -d '\r' < "$results/acg-denial.log" | grep -Fx 'ELF memory loader ACG denial test passed'

      - name: Upload ELF memory loader test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-elf-memory-loader-tests-arm64
          path: artifacts/windows-elf-memory-loader-tests/
          if-no-files-found: error

      - name: Verify built SDK developer tools
        run: python3 scripts/verify_dart_sdk_tooling.py --dart "$PWD/dart-sdk/out/ReleaseARM64/dart-sdk/bin/dart.exe"

      - name: Test native mapping compiler provenance
        working-directory: dart-sdk
        run: >-
          out/ReleaseARM64/dart-sdk/bin/dart.exe --packages=.dart_tool/package_config.json
          third_party/pkg/test/pkgs/test/bin/test.dart
          pkg/frontend_server/test/shorebird_native_assets_descriptor_test.dart
          pkg/dart2bytecode/test/shorebird_ios_full_replacement_target_test.dart
          pkg/frontend_server/test/shorebird_ios_full_replacement_target_test.dart
          pkg/vm/test/shorebird_ios_full_replacement_target_test.dart
          --concurrency=1

      - name: Run focused patch API tests
        working-directory: dart-sdk/out/ReleaseARM64
        run: |
          ./run_vm_tests.exe DartAPI_AotPatchingConfiguration
          ./run_vm_tests.exe DartAPI_BytecodePatchReloadConfiguration
          ./run_vm_tests.exe DartAPI_SnapshotRegionSizes
          ./run_vm_tests.exe DartAPI_SnapshotRegionSizesRejectInvalidHeaders

      - name: Run zone memory tagging capability tests
        working-directory: dart-sdk/out/ReleaseARM64
        run: |
          set -euo pipefail
          ./run_vm_tests.exe ZoneMemoryTaggingUnsupportedPreservesTaggedPointers
          ./run_vm_tests.exe ZoneMemoryTaggingSetFailurePreservesTaggedPointers
          ./run_vm_tests.exe ZoneMemoryTaggingGetFailure
          ./run_vm_tests.exe ZoneMemoryTaggingIncompleteControl
          ./run_vm_tests.exe ZoneMemoryTaggingSupportedFaultModes
          ./run_vm_tests.exe ZoneWithMemoryTagging

      - name: Package Dart SDK artifact
        run: |
          mkdir -p artifacts/custom-dart-sdk-windows-arm64
          cp -R dart-sdk/out/ReleaseARM64/dart-sdk artifacts/custom-dart-sdk-windows-arm64/
          cp dart-sdk/out/ReleaseARM64/gen_snapshot.exe artifacts/custom-dart-sdk-windows-arm64/
          cp dart-sdk/out/ReleaseARM64/dartaotruntime.exe artifacts/custom-dart-sdk-windows-arm64/
          cp dart-sdk/out/ReleaseARM64/args.gn artifacts/custom-dart-sdk-windows-arm64/
          dart_sdk_revision="$(git -C dart-sdk rev-parse HEAD)"
          cat > artifacts/custom-dart-sdk-windows-arm64/manifest.json <<EOF
          {
            "name": "custom-dart-sdk-windows-arm64",
            "git_sha": "${{ github.sha }}",
            "dart_sdk_git_sha": "${dart_sdk_revision}",
            "runner_os": "${{ runner.os }}",
            "dart_arch": "arm64",
            "dart_build_dir": "dart-sdk/out/ReleaseARM64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": true,
            "included": [
              "dart-sdk/",
              "gen_snapshot.exe",
              "dartaotruntime.exe",
              "args.gn"
            ]
          }
          EOF
          tar -C artifacts -czf custom-dart-sdk-windows-arm64.tar.gz custom-dart-sdk-windows-arm64
          sdk_extract_dir="$(mktemp -d)"
          tar -C "$sdk_extract_dir" -xzf custom-dart-sdk-windows-arm64.tar.gz
          test -f "$sdk_extract_dir/custom-dart-sdk-windows-arm64/manifest.json"
          test -f "$sdk_extract_dir/custom-dart-sdk-windows-arm64/args.gn"
          test -x "$sdk_extract_dir/custom-dart-sdk-windows-arm64/dart-sdk/bin/dart.exe"
          test -x "$sdk_extract_dir/custom-dart-sdk-windows-arm64/gen_snapshot.exe"
          test -x "$sdk_extract_dir/custom-dart-sdk-windows-arm64/dartaotruntime.exe"
          "$sdk_extract_dir/custom-dart-sdk-windows-arm64/dart-sdk/bin/dart.exe" --version
          (
            cd dart-sdk/out/ReleaseARM64
            python3 -m zipfile -c "$GITHUB_WORKSPACE/dart-sdk-windows-arm64.zip" dart-sdk
          )
          release_sdk_extract_dir="$(mktemp -d)"
          unzip -q dart-sdk-windows-arm64.zip -d "$release_sdk_extract_dir"
          test -x "$release_sdk_extract_dir/dart-sdk/bin/dart.exe"
          "$release_sdk_extract_dir/dart-sdk/bin/dart.exe" --version
          ./scripts/write_sha256.sh custom-dart-sdk-windows-arm64.tar.gz custom-dart-sdk-windows-arm64.tar.gz.sha256
          ./scripts/write_sha256.sh dart-sdk-windows-arm64.zip dart-sdk-windows-arm64.zip.sha256

      - name: Verify packaged native ARM64 Dart SDK
        run: |
          "$NATIVE_PYTHON" scripts/verify_native_desktop_arch.py --platform windows --arch arm64 --require-native-host \
            --binary dart-sdk/out/ReleaseARM64/dart-sdk/bin/dart.exe \
            --binary dart-sdk/out/ReleaseARM64/gen_snapshot.exe \
            --binary dart-sdk/out/ReleaseARM64/dartaotruntime.exe \
            --build-tool dart-sdk/buildtools/win/gn.exe \
            --build-tool dart-sdk/buildtools/win-x64/clang/bin/clang-cl.exe

      - name: Upload custom Dart SDK
        uses: actions/upload-artifact@v4
        with:
          name: custom-dart-sdk-windows-arm64
          path: |
            custom-dart-sdk-windows-arm64.tar.gz
            custom-dart-sdk-windows-arm64.tar.gz.sha256
            dart-sdk-windows-arm64.zip
            dart-sdk-windows-arm64.zip.sha256
          if-no-files-found: error


  linux-engine-arm64:
    name: Build Linux engine artifacts (native ARM64)
    needs: source-checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up native ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Record native runtime verifier interpreter
        run: |
          native_python="$(python -c 'import sys; print(sys.executable)')"
          if command -v cygpath >/dev/null 2>&1; then native_python="$(cygpath -m "$native_python")"; fi
          echo "NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"
          "$native_python" scripts/verify_native_desktop_arch.py --platform linux --arch arm64 --require-native-host

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Free Ubuntu runner disk
        run: ./scripts/free_ci_disk_linux.sh

      - name: Install Linux ARM64 Rust target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Install Linux engine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            liblzma-dev \
            pkg-config clang cmake ninja-build \
            libcurl4-openssl-dev libkeyutils-dev keyutils \
            xvfb xauth dbus-x11 libgl1-mesa-dri libegl1

      - name: Verify Linux session keyring support
        run: |
          python3 - <<'PYKEYRING'
          import ctypes, ctypes.util
          library = ctypes.CDLL(ctypes.util.find_library('keyutils'), use_errno=True)
          library.keyctl_join_session_keyring.argtypes = [ctypes.c_char_p]
          library.keyctl_join_session_keyring.restype = ctypes.c_int32
          library.keyctl_setperm.argtypes = [ctypes.c_int32, ctypes.c_uint32]
          library.keyctl_revoke.argtypes = [ctypes.c_int32]
          keyring = library.keyctl_join_session_keyring(None)
          if keyring <= 0:
              raise SystemExit('Linux kernel session keyring is unavailable')
          try:
              if library.keyctl_setperm(keyring, 0x3f000000) != 0:
                  raise SystemExit('Linux kernel session keyring permissions failed')
          finally:
              if library.keyctl_revoke(keyring) != 0:
                  raise SystemExit('Linux kernel session keyring cleanup failed')
          print('Linux kernel session keyring preflight passed')
          PYKEYRING

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
          INCLUDE_ANDROID_DEPS: "0"
        run: ./scripts/write_gclient.sh linux

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Configure Linux engine
        working-directory: flutter/engine/src
        run: |
          "$NATIVE_PYTHON" flutter/tools/gn --linux --linux-cpu=arm64 \
            --runtime-mode=release \
            --target-dir=linux_release_arm64 \
            --enable-unittests \
            --no-prebuilt-dart-sdk \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false'

      - name: Build Linux engine
        working-directory: flutter/engine/src
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/linux-native-cache-tests"
          mkdir -p "$results"
          rm -f "$results/shorebird.xml" "$results/embedder.xml" "$results/shorebird-list.txt" "$results/"*.log
          ninja -C out/linux_release_arm64 \
            flutter/shell/platform/linux:flutter_gtk \
            flutter/build/archives:flutter_patched_sdk \
            flutter/tools/font_subset:font_subset \
            flutter/build/dart:dart_sdk \
            flutter/flutter_frontend_server:frontend_server \
            flutter/tools/const_finder:const_finder \
            flutter/sky/packages/sky_engine:sky_engine \
            flutter/impeller/compiler:impellerc \
            flutter/shell/common/shorebird:shorebird_unittests \
            flutter/shell/platform/embedder:embedder_unittests \
            2>&1 | tee "$results/build.log"

      - name: Verify Linux engine args
        run: |
          ./scripts/verify_engine_args.sh \
            flutter/engine/src/out/linux_release_arm64/args.gn \
            'target_cpu="arm64"' 'host_cpu="arm64"' \
            enable_unittests=true \
            dart_dynamic_modules=false \
            dart_enable_aot_patching=true \
            dart_enable_shorebird_interpreter=false \
            shorebird_enable_aot_patching=true \
            shorebird_use_interpreter=false \
            flutter_prebuilt_dart_sdk=false

      - name: Run Linux prepared native cache engine tests
        working-directory: flutter/engine/src
        run: |
          set -euo pipefail
          out="$PWD/out/linux_release_arm64"
          results="$GITHUB_WORKSPACE/artifacts/linux-native-cache-tests"
          mkdir -p "$results"
          # Match the upstream engine runner's working directory and libraries.
          # Selected embedder controls use the software renderer, without X/GPU.
          export LD_LIBRARY_PATH="$out${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export FLUTTER_BUILD_DIRECTORY="$out"
          test -x "$out/shorebird_unittests"
          test -x "$out/embedder_unittests"
          test -s "$out/gen/flutter/shell/platform/embedder/assets/app_elf_snapshot.so"
          # Reused provisioned runners must not satisfy this run with stale XML.
          rm -f "$results/shorebird.xml" "$results/embedder.xml" "$results/shorebird-list.txt"
          "$out/shorebird_unittests" --gtest_filter='*' --gtest_list_tests \
            > "$results/shorebird-list.txt" 2> "$results/shorebird-list.stderr.log"
          "$out/shorebird_unittests" --gtest_filter='*' --gtest_repeat=1 \
            --gtest_output="xml:$results/shorebird.xml" 2>&1 | tee "$results/shorebird.log"
          embedder_filter='EmbedderTest.PreparedFDOwnershipAndImageSurviveMultipleEngines:EmbedderTest.PreparedMemoryImageSurvivesInputAndMultipleEngines:EmbedderTest.InvalidAOTDataSourcesMustReturnError:EmbedderTest.CanCreateAndCollectAValidElfSource:EmbedderTest.CanLaunchAndShutdownWithAValidElfSource'
          "$out/embedder_unittests" --gtest_filter="$embedder_filter" --gtest_repeat=1 \
            --gtest_output="xml:$results/embedder.xml" 2>&1 | tee "$results/embedder.log"
          python3 "$GITHUB_WORKSPACE/scripts/verify_native_cache_engine_tests.py" --platform linux \
            --shorebird-list "$results/shorebird-list.txt" \
            --shorebird-xml "$results/shorebird.xml" \
            --embedder-xml "$results/embedder.xml" 2>&1 | tee "$results/validation.log"

      - name: Upload Linux native cache engine test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-cache-engine-tests-arm64
          path: artifacts/linux-native-cache-tests/
          if-no-files-found: error

      - name: Set up Go for Linux lifecycle
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: shorebird-server/go.sum

      - name: Verify native ARM64 engine and SDK machine types
        run: |
          "$NATIVE_PYTHON" scripts/verify_native_desktop_arch.py --platform linux --arch arm64 --require-native-host \
            --binary flutter/engine/src/out/linux_release_arm64/dart-sdk/bin/dart \
            --binary flutter/engine/src/out/linux_release_arm64/libflutter_linux_gtk.so \
            --build-tool flutter/engine/src/flutter/buildtools/linux-arm64/clang/bin/clang++ \
            --build-tool flutter/engine/src/flutter/third_party/gn/gn --build-tool "$(command -v python3)"

      - name: Restore verified Flutter version tag for lifecycle
        shell: bash
        run: python3 scripts/prepare_flutter_version_tag.py flutter

      - name: Prepare Linux encrypted lifecycle tools
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/flutter/engine/src/out/linux_release_arm64"
          unzip -q -o "$out/zip_archives/flutter_patched_sdk_product.zip" -d "$out"
          cache="$GITHUB_WORKSPACE/flutter/bin/cache"
          mkdir -p "$cache"
          rm -rf -- "$cache/dart-sdk"
          cp -a "$out/dart-sdk" "$cache/dart-sdk"
          export PUB_CACHE="$RUNNER_TEMP/shorebird-linux-lifecycle-pub"
          echo "PUB_CACHE=$PUB_CACHE" >> "$GITHUB_ENV"
          for project in shorebird flutter/packages/flutter_tools; do
            (cd "$GITHUB_WORKSPACE/$project" && "$out/dart-sdk/bin/dart" pub get)
          done
          (cd updater && cargo build --release --locked -p patch --bin patch)

      - name: Compile Linux session keyring provider contract
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/testapps/license_flavor_patch_test/tool/linux_native"
          out="$GITHUB_WORKSPACE/flutter/engine/src/out/linux_release_arm64"
          results="$GITHUB_WORKSPACE/artifacts/linux-native-provider-tests"
          mkdir -p "$results"
          clang++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I"$out" $(pkg-config --cflags gtk+-3.0 libcurl) \
            "$fixture/native_cache_contract_test.cpp" \
            -o "$results/native_cache_contract_test" \
            $(pkg-config --libs gtk+-3.0 libcurl) -lkeyutils \
            2>&1 | tee "$results/build.log"

      - name: Run Linux encrypted native lifecycle
        timeout-minutes: 75
        run: |
          set -euo pipefail
          engine="$GITHUB_WORKSPACE/flutter/engine/src"
          out="$engine/out/linux_release_arm64"
          work="$RUNNER_TEMP/shorebird-linux-e2e-$(python3 -c 'import uuid; print(uuid.uuid4())')"
          results="$GITHUB_WORKSPACE/artifacts/linux-native-cache-e2e"
          probe="$GITHUB_WORKSPACE/artifacts/linux-native-provider-tests/native_cache_contract_test"
          export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1
          dbus-run-session -- xvfb-run -a "$NATIVE_PYTHON" testapps/license_flavor_patch_test/tool/linux_native_cache_e2e.py run --execute --arch arm64 --engine-src "$engine" --host-engine linux_release_arm64 --target-engine linux_release_arm64 --tooling-dart "$out/dart-sdk/bin/dart" --patch-tool "$GITHUB_WORKSPACE/updater/target/release/patch" --pub-cache "$PUB_CACHE" --provider-probe "$probe" --work "$work" --results "$results"
          python3 - "$results/results.json" <<'PYREPORT'
          import json, sys
          report = json.load(open(sys.argv[1]))
          if report.get('target_arch') != 'arm64' or report.get('runtime_arch') != 'aarch64':
              raise SystemExit('ARM64 native lifecycle architecture evidence is missing')
          required = {
              'native-probe-self-test', 'native-probe-online', 'native-probe-offline',
              'actual-cli-release-free', 'actual-cli-patch-pro', 'ciphertext-installed',
              'offline-cold-U', 'offline-missing-key-BASE', 'offline-missing-recovery-U',
              'offline-wrong-key-BASE', 'offline-wrong-recovery-U',
              'online-U-receive-signed-rollback', 'offline-cold-rollback-BASE',
              'released-bundle-unchanged',
          }
          observed = {stage['name'] for stage in report.get('stages', [])}
          if not required.issubset(observed):
              raise SystemExit('Linux lifecycle execution evidence is incomplete')
          if (report.get('key_storage') != 'kernel-session-keyring' or
              report.get('key_storage_scope') != 'cold-app-processes-in-one-session'):
              raise SystemExit('Linux lifecycle key storage contract changed')
          if (report.get('schema') != 'linux-native-cache-e2e-v1' or
              report.get('result') != 'passed' or
              report.get('cleanup') != 'owned processes, ports, disposable app cache, private session removed; owned session keyring revoked'):
              raise SystemExit('Linux lifecycle did not produce a passing cleaned execution report')
          PYREPORT
          "$NATIVE_PYTHON" scripts/verify_native_desktop_arch.py --platform linux --arch arm64 --require-native-host --lifecycle-report "$results/results.json"

      - name: Upload Linux native provider test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-provider-tests-arm64
          path: artifacts/linux-native-provider-tests/build.log
          if-no-files-found: error

      - name: Upload Linux encrypted lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-cache-e2e-arm64
          path: artifacts/linux-native-cache-e2e/results.json
          if-no-files-found: error

      - name: Run Linux native V2 variant lifecycle
        timeout-minutes: 90
        run: |
          set -euo pipefail
          engine="$GITHUB_WORKSPACE/flutter/engine/src"
          out="$engine/out/linux_release_arm64"
          work="$RUNNER_TEMP/shorebird-linux-variant-e2e-$(python3 -c 'import uuid; print(uuid.uuid4())')"
          results="$GITHUB_WORKSPACE/artifacts/linux-native-variant-e2e"
          probe="$GITHUB_WORKSPACE/artifacts/linux-native-provider-tests/native_cache_contract_test"
          export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1
          dbus-run-session -- xvfb-run -a "$NATIVE_PYTHON" testapps/license_flavor_patch_test/tool/linux_variant_e2e.py run --execute --arch arm64 --engine-src "$engine" --host-engine linux_release_arm64 --target-engine linux_release_arm64 --tooling-dart "$out/dart-sdk/bin/dart" --patch-tool "$GITHUB_WORKSPACE/updater/target/release/patch" --pub-cache "$PUB_CACHE" --provider-probe "$probe" --work "$work" --results "$results" 2>&1 | tee "$results.log"
          "$NATIVE_PYTHON" - "$results/results.json" linux arm64 <<'PYVARIANT'
          import json, sys
          report_path, platform, arch = sys.argv[1:]
          report = json.load(open(report_path))
          runtime_arch = {'x64': 'x86_64', 'arm64': 'aarch64'}[arch]
          if (report.get('schema') != 'native-variant-e2e-v2' or
              report.get('result') != 'passed' or report.get('runtime_acceptance') is not True or
              report.get('platform') != platform or report.get('target_arch') != arch or
              report.get('runtime_arch') != runtime_arch or
              report.get('cleanup') != 'owned platform processes, services, private work, app cache and provider keys removed'):
              raise SystemExit('Native V2 lifecycle requires real cleaned execution on the selected platform and architecture')
          machines = report.get('binary_architectures', {})
          if not machines or any(value.get('architecture') != arch or value.get('native_target') is not True for value in machines.values()):
              raise SystemExit('Native V2 binary architecture receipts are incomplete')
          required = {
              'actual-cli-staged-native-scope', 'actual-cli-release-free',
              'actual-cli-patch-pro_seed', 'actual-cli-patch-pro', 'actual-cli-patch-enterprise',
              'initial-free-public-installation', 'same-content-higher-epoch', 'same-content-cold-adoption',
              'offline-missing-key-free', 'offline-missing-key-recovery-pro',
              'offline-wrong-key-free', 'offline-wrong-key-recovery-pro',
              'released-bundle-unchanged', 'native-v2-final-cache',
          }
          previous = 'free'
          for index, variant in enumerate(('pro', 'enterprise', 'pro', 'free', 'enterprise', 'free')):
              required.update((f'online-{index}-{previous}-accept-{variant}', f'offline-cold-{index}-{variant}'))
              previous = variant
          adversarial_required = {
              'adversarial-select-pro-check',
              'adversarial-select-pro-cold',
              'owned-ciphertext-flip',
              'ciphertext-offline-free',
              'ciphertext-signed-free-check',
              'ciphertext-signed-free-cold',
              'ciphertext-same-pro-redownload-check',
              'ciphertext-same-pro-redownload-cold',
              'ciphertext-real-redownload',
              'untrusted-cached-signature-flip',
              'cached-signature-still-valid-pro',
              'server-returned-old-response-capture',
              'actual-leased-pro-check',
              'actual-leased-pro-cold',
              'platform-clock-expired-free',
              'platform-lease-expiry',
              'old-signed-response-rejected',
              'old-signed-response-requests',
              'corrupt-stale-response-combined-rejected',
              'corrupt-stale-response-combined-requests',
              'expired-server-signed-free',
              'expired-server-free-cold',
              'before-enterprise-rollback-check',
              'before-enterprise-rollback-cold',
              'rollback-enterprise',
              'rollback-server-signed-free',
              'rollback-cold-free',
              'rollforward-enterprise',
              'rollforward-alone-still-free',
              'rollforward-cold-free',
              'explicit-enterprise-restored-check',
              'explicit-enterprise-restored-cold',
              'adversarial-final-signed-free-check',
              'adversarial-final-signed-free-cold',
              'adversarial-final-offline-free',
          }
          required.update(adversarial_required)
          expected_cases = (
              'owned-ciphertext-offline-content-unavailable',
              'signed-free-same-pro-real-redownload',
              'cached-signature-keeps-valid-pro',
              'actual-paid-lease-platform-clock-expiry',
              'server-returned-older-response-rejected-independent-nonce',
              'corrupt-stale-response-combined-rejection',
              'enterprise-rollback-signed-free',
              'rollforward-alone-stays-free',
              'explicit-enterprise-reauthorization',
              'final-offline-free',
          )
          if report.get('adversarial_cases') != list(expected_cases):
              raise SystemExit('Native V2 adversarial case completion is missing or changed')
          if not required.issubset({stage['name'] for stage in report.get('stages', [])}):
              raise SystemExit('Native V2 lifecycle publication, grants, fallback, data and cold-boot evidence is incomplete')
          if report.get('provisioning', {}).get('accepted', 0) < 1 or not report.get('final_application_data'):
              raise SystemExit('Native V2 lifecycle authenticated delivery or application data proof is missing')
          stages = {stage['name']: stage.get('evidence', {}) for stage in report['stages']}
          if stages['ciphertext-real-redownload'].get('check_status') != 'outdated':
              raise SystemExit('Native V2 ciphertext recovery did not execute a real public download')
          import math
          lease = stages['platform-lease-expiry']
          if (any(type(lease.get(field)) not in (int, float) or not math.isfinite(lease[field]) for field in ('deadline', 'wait_completed', 'launch_started')) or
              lease['wait_completed'] <= lease['deadline'] or lease['launch_started'] <= lease['deadline']):
              raise SystemExit('Native V2 expiry lacks an observed platform clock boundary')
          for label in ('old-signed-response', 'corrupt-stale-response-combined'):
              delivered = stages[label + '-requests']
              checks = delivered.get('requests')
              if (type(delivered.get('delivered_check_responses')) is not int or delivered['delivered_check_responses'] < 1 or
                  not isinstance(checks, list) or len(checks) != delivered['delivered_check_responses'] or
                  delivered.get('real_api_and_provisioning_stopped') is not True):
                  raise SystemExit('Native V2 rejection lacks successful owned replay delivery with real services stopped')
          PYVARIANT

      - name: Upload Linux native V2 variant lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-variant-e2e-arm64
          path: |
            artifacts/linux-native-variant-e2e/
            artifacts/linux-native-variant-e2e.log
          if-no-files-found: error

      - name: Package Linux engine artifacts
        run: |
          set -euo pipefail
          out=flutter/engine/src/out/linux_release_arm64
          mkdir -p artifacts/linux-engine

          gtk_zip="$(find "$out/zip_archives" -name 'linux-arm64-flutter-gtk.zip' -type f -print -quit)"
          patched_sdk_zip="$(find "$out/zip_archives" -name 'flutter_patched_sdk_product.zip' -type f -print -quit)"
          artifacts_zip="$(find "$out/zip_archives" -path '*/linux-arm64-release/artifacts.zip' -type f -print -quit)"
          if [ -z "$artifacts_zip" ]; then
            test -x "$out/gen_snapshot"
            artifacts_zip="$out/zip_archives/linux-arm64-release/artifacts.zip"
            mkdir -p "$(dirname "$artifacts_zip")"
            python3 - "$out/gen_snapshot" "$artifacts_zip" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          info = zipfile.ZipInfo('gen_snapshot')
          info.external_attr = (source.stat().st_mode & 0xFFFF) << 16
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.writestr(info, source.read_bytes(), zipfile.ZIP_DEFLATED)
          PY
          fi
          test -n "$gtk_zip"
          test -n "$patched_sdk_zip"
          test -n "$artifacts_zip"

          engine_symbol_dir="$(mktemp -d)"
          unzip -q "$gtk_zip" -d "$engine_symbol_dir"
          engine_library="$(find "$engine_symbol_dir" -type f -name libflutter_linux_gtk.so -print -quit)"
          test -n "$engine_library"
          readelf --wide --dyn-syms "$engine_library" | awk '
            $5 == "GLOBAL" && $6 == "DEFAULT" && $7 != "UND" &&
                $8 == "shorebird_set_patch_decryption_key_provider" { found = 1 }
            END { if (!found) { print "missing exported patch decryption key provider" > "/dev/stderr"; exit 1 } }
          '
          cp "$gtk_zip" artifacts/linux-engine/
          cp "$patched_sdk_zip" artifacts/linux-engine/
          cp "$artifacts_zip" artifacts/linux-engine/artifacts.zip
          cp "$out/args.gn" artifacts/linux-engine/linux_release_arm64.args.gn

          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision"
          mkdir -p "$mirror_root/linux-arm64-release"
          cp "$gtk_zip" "$mirror_root/linux-arm64-release/linux-arm64-flutter-gtk.zip"
          cp "$artifacts_zip" "$mirror_root/linux-arm64-release/artifacts.zip"
          test -f "$mirror_root/linux-arm64-release/linux-arm64-flutter-gtk.zip"
          test -f "$mirror_root/linux-arm64-release/artifacts.zip"
          font_zip="$out/zip_archives/linux-arm64/font-subset.zip"
          cp "$font_zip" artifacts/linux-engine/font-subset.zip
          mkdir -p "$mirror_root/linux-arm64"
          cp "$font_zip" "$mirror_root/linux-arm64/font-subset.zip"
          test -f "$mirror_root/linux-arm64/font-subset.zip"
          font_smoke_dir="$(mktemp -d)"
          font_dart="$(find "$out" -maxdepth 3 -type f -name dartvm -print -quit)"
          test -n "$font_dart"
          python3 - artifacts/linux-engine/font-subset.zip "$font_smoke_dir" "$font_dart" <<'PYFONT'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import zipfile

          archive_path, work, dart = map(Path, sys.argv[1:])
          executable = "font-subset.exe" if os.name == "nt" else "font-subset"
          with zipfile.ZipFile(archive_path) as archive:
              for name in (executable, "const_finder.dart.snapshot"):
                  if archive.getinfo(name).file_size == 0:
                      raise SystemExit(f"empty font tool: {name}")
              archive.extractall(work)
          binary = work / executable
          binary.chmod(0o755)
          source_font = Path("flutter/engine/src/flutter/txt/third_party/fonts/Roboto-Regular.ttf").resolve()
          output_font = (work / "subset.ttf").resolve()
          subprocess.run([str(binary.resolve()), str(output_font), str(source_font)],
                         input="65 66\n", text=True, check=True)
          if not 0 < output_font.stat().st_size < source_font.stat().st_size:
              raise SystemExit("font subset did not produce a smaller non-empty font")
          subprocess.run([str(dart.resolve()), str((work / "const_finder.dart.snapshot").resolve()),
                          "--kernel-file=unused.dill", "--class-library-uri=package:unused", "--class-name=Unused", "--help"],
                         check=True, stdout=subprocess.DEVNULL)
          PYFONT
          cat > artifacts/linux-engine/manifest.json <<EOF
          {
            "name": "linux-engine-arm64",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "engine_revision": "${engine_revision}",
            "linux_build_dir": "flutter/engine/src/out/linux_release_arm64",
            "runtime_mode": "release",
            "target_os": "linux",
            "target_arch": "arm64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": false,
            "shorebird_enable_aot_patching": true,
            "shorebird_interpreter": false,
            "included": [
              "font-subset.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/linux-arm64/font-subset.zip",
              "linux-arm64-flutter-gtk.zip",
              "flutter_patched_sdk_product.zip",
              "artifacts.zip",
              "linux_release_arm64.args.gn",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/linux-arm64-release/linux-arm64-flutter-gtk.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/linux-arm64-release/artifacts.zip"
            ]
          }
          EOF
          tar -C artifacts -czf linux-engine-arm64.tar.gz linux-engine
          engine_extract_dir="$(mktemp -d)"
          tar -C "$engine_extract_dir" -xzf linux-engine-arm64.tar.gz
          test -f "$engine_extract_dir/linux-engine/manifest.json"
          test -f "$engine_extract_dir/linux-engine/font-subset.zip"
          test -f "$engine_extract_dir/linux-engine/linux_release_arm64.args.gn"
          test -f "$engine_extract_dir/linux-engine/linux-arm64-flutter-gtk.zip"
          test -f "$engine_extract_dir/linux-engine/flutter_patched_sdk_product.zip"
          test -f "$engine_extract_dir/linux-engine/artifacts.zip"
          test -f "$engine_extract_dir/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/linux-arm64-release/linux-arm64-flutter-gtk.zip"
          test -f "$engine_extract_dir/linux-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/linux-arm64-release/artifacts.zip"
          ./scripts/write_sha256.sh linux-engine-arm64.tar.gz linux-engine-arm64.tar.gz.sha256

      - name: Upload Linux engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-engine-arm64
          path: |
            linux-engine-arm64.tar.gz
            linux-engine-arm64.tar.gz.sha256
          if-no-files-found: error

  windows-engine-arm64:
    name: Build Windows engine artifacts (native ARM64)
    needs: source-checks
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 300
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2026"
      MSYS: winsymlinks:nativestrict
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up native ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Record native runtime verifier interpreter
        run: |
          native_python="$(python -c 'import sys; print(sys.executable)')"
          if command -v cygpath >/dev/null 2>&1; then native_python="$(cygpath -m "$native_python")"; fi
          echo "NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"
          "$native_python" scripts/verify_native_desktop_arch.py --platform windows --arch arm64 --require-native-host

      - name: Prepare native Windows build tools
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks true
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[18.0,19.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2026 ARM64 C++ toolchain is required' }
          "GYP_MSVS_OVERRIDE_PATH=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "vs2026_install=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=arm64 -host_arch=arm64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name, $value = $matches[1], $matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and [Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
              }
            }
          }
          if ($LASTEXITCODE) { throw 'VsDevCmd failed' }
          # ring requires the GNU-style clang driver on Windows ARM64.
          # Pin the native VS tools for ring and the other C/C++ Rust deps.
          $clang = Join-Path $vs 'VC/Tools/Llvm/ARM64/bin/clang.exe'
          $clangxx = Join-Path $vs 'VC/Tools/Llvm/ARM64/bin/clang++.exe'
          if (!(Test-Path $clang) -or !(Test-Path $clangxx)) {
            throw 'Visual Studio native ARM64 clang and clang++ are required'
          }
          "CC_aarch64_pc_windows_msvc=$clang" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CXX_aarch64_pc_windows_msvc=$clangxx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if (!(Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\um\Windows.h")) {
            throw 'Windows SDK 10.0.26100.0 is required by Dart/Chromium'
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap Windows depot_tools
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\depot_tools\bootstrap\win_tools.bat"
          if ($LASTEXITCODE) { throw 'depot_tools Windows bootstrap failed' }
          if (!(Test-Path "$env:GITHUB_WORKSPACE\depot_tools\git.bat")) {
            throw 'depot_tools bootstrap did not generate the required git.bat wrapper'
          }
          $pythonRelative = (Get-Content "$env:GITHUB_WORKSPACE\depot_tools\python3_bin_reldir.txt" -Raw).Trim()
          $pythonBin = Join-Path "$env:GITHUB_WORKSPACE\depot_tools" $pythonRelative
          if (!(Test-Path "$pythonBin\python3.exe")) {
            throw 'depot_tools bootstrap did not install python3.exe for GN'
          }
          $pythonBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$pythonBin;$env:PATH"
          & "$pythonBin\python3.exe" -c "import shutil, subprocess; assert shutil.which('python3.exe'); subprocess.check_call(['git.bat', '--version'])"
          if ($LASTEXITCODE) { throw 'Python cannot invoke the depot_tools Git wrapper' }

      - name: Verify depot_tools build tools
        run: |
          python3 --version
          gclient help >/dev/null
          ninja --version

      - name: Install Windows Rust target
        run: rustup target add aarch64-pc-windows-msvc

      - name: Check runner capacity
        run: CI_MIN_FREE_DISK_GB="$ENGINE_MIN_FREE_DISK_GB" ./scripts/check_ci_capacity.sh

      - name: Write gclient config
        env:
          INCLUDE_ENGINE_DEPS: "1"
        run: ./scripts/write_gclient.sh windows

      - name: Sync open-source links
        run: ./scripts/sync_open_sources.sh

      - name: gclient sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        run: gclient sync --no-history

      - name: gclient sync Flutter engine deps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_gclient_sync }}
        working-directory: flutter
        run: gclient sync --no-history

      - name: Verify Dart tool SDK
        run: ./scripts/verify_dart_tool_sdk.sh

      - name: Configure Windows engine
        working-directory: flutter/engine/src
        run: |
          "$NATIVE_PYTHON" flutter/tools/gn \
            --windows-cpu=arm64 \
            --runtime-mode=release --target-dir=windows_release_arm64 \
            --enable-unittests \
            --no-prebuilt-dart-sdk \
            --gn-args='dart_dynamic_modules=false dart_enable_aot_patching=true dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false'

      - name: Build Windows engine
        shell: pwsh
        working-directory: flutter/engine/src
        run: |
          # Git Bash prepends its GNU link.exe ahead of the MSVC linker.
          $linker = (Get-Command link.exe -CommandType Application).Source
          if (!$linker.StartsWith($env:GYP_MSVS_OVERRIDE_PATH, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected the Visual Studio linker, found $linker"
          }
          Write-Host "Using Microsoft linker: $linker"
          "NATIVE_BUILD_LINKER=$linker" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-native-cache-tests'
          New-Item -ItemType Directory -Force $results | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue "$results/*.log", "$results/*.xml", "$results/shorebird-list.txt"
          ninja -C out/windows_release_arm64 flutter/build/archives:windows_flutter flutter/tools/font_subset:font_subset flutter/shell/common/shorebird:shorebird_unittests flutter/shell/platform/embedder:embedder_unittests flutter/shell/platform/windows:flutter_windows_unittests flutter/build/dart:dart_sdk flutter/flutter_frontend_server:frontend_server flutter/tools/const_finder:const_finder flutter/sky/packages/sky_engine:sky_engine flutter/shell/platform/windows:windows flutter/build/archives:flutter_patched_sdk flutter/impeller/compiler:impellerc 2>&1 | Tee-Object -FilePath "$results/build.log"
          if ($LASTEXITCODE) { throw 'Windows engine and native cache test build failed' }

      - name: Verify Windows engine args
        run: |
          ./scripts/verify_engine_args.sh \
            flutter/engine/src/out/windows_release_arm64/args.gn \
            'target_cpu="arm64"' 'host_cpu="arm64"' \
            enable_unittests=true \
            dart_dynamic_modules=false dart_enable_aot_patching=true \
            dart_enable_shorebird_interpreter=false shorebird_enable_aot_patching=true \
            shorebird_use_interpreter=false flutter_prebuilt_dart_sdk=false

      - name: Run Windows prepared native cache engine tests
        working-directory: flutter/engine/src
        run: |
          set -euo pipefail
          out="$(cygpath -m "$PWD/out/windows_release_arm64")"
          results="$(cygpath -m "$GITHUB_WORKSPACE")/artifacts/windows-native-cache-tests"
          mkdir -p "$results"
          # Native fixtures need Windows paths and the built DLLs on PATH.
          export PATH="$PWD/out/windows_release_arm64:$PATH"
          export FLUTTER_BUILD_DIRECTORY="$out"
          test -x "$out/shorebird_unittests.exe"
          test -x "$out/embedder_unittests.exe"
          test -x "$out/flutter_windows_unittests.exe"
          test -s "$out/icudtl.dat"
          test -s "$out/gen/flutter/shell/platform/windows/assets/app_elf_snapshot.so"
          test -s "$out/gen/flutter/shell/platform/embedder/assets/app_elf_snapshot.so"
          rm -f "$results/shorebird.xml" "$results/embedder.xml" "$results/shorebird-list.txt"
          rm -f "$results/windows.xml"
          "$out/shorebird_unittests.exe" --gtest_filter='*' --gtest_list_tests \
            > "$results/shorebird-list.txt" 2> "$results/shorebird-list.stderr.log"
          "$out/shorebird_unittests.exe" --gtest_filter='*' --gtest_repeat=1 \
            --gtest_output="xml:$results/shorebird.xml" 2>&1 | tee "$results/shorebird.log"
          embedder_filter='EmbedderTest.PreparedMemoryImageSurvivesInputAndMultipleEngines:EmbedderTest.InvalidAOTDataSourcesMustReturnError:EmbedderTest.CanCreateAndCollectAValidElfSource:EmbedderTest.CanLaunchAndShutdownWithAValidElfSource'
          "$out/embedder_unittests.exe" --gtest_filter="$embedder_filter" --gtest_repeat=1 \
            --gtest_output="xml:$results/embedder.xml" 2>&1 | tee "$results/embedder.log"
          # The adapter owns a 10-second Dart signal deadline per engine.
          # Bound the separate native process too, including its UI-thread teardown.
          "$NATIVE_PYTHON" - "$out" "$results" <<'PYWINDOWSTEST' 2>&1 | tee "$results/windows.log"
          from pathlib import Path
          import subprocess
          import sys

          out, results = map(Path, sys.argv[1:])
          subprocess.run([
              str(out / 'flutter_windows_unittests.exe'),
              '--gtest_filter=ShorebirdFlutterWindowsEngineTest.*',
              '--gtest_repeat=1',
              f'--gtest_output=xml:{results / "windows.xml"}',
          ], cwd=out, timeout=120, check=True)
          PYWINDOWSTEST
          python3 "$GITHUB_WORKSPACE/scripts/verify_native_cache_engine_tests.py" --platform windows \
            --shorebird-list "$results/shorebird-list.txt" \
            --shorebird-xml "$results/shorebird.xml" \
            --embedder-xml "$results/embedder.xml" \
            --windows-xml "$results/windows.xml" 2>&1 | tee "$results/validation.log"

      - name: Run Windows updater tests
        shell: pwsh
        working-directory: updater
        run: |
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-native-cache-tests'
          New-Item -ItemType Directory -Force $results | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue "$results/updater.log"
          rustup show active-toolchain
          if ($LASTEXITCODE) { throw 'Windows stable Rust toolchain is unavailable' }
          cargo test -p updater --locked -- --test-threads=1 2>&1 | Tee-Object -FilePath "$results/updater.log"
          if ($LASTEXITCODE) { throw 'Windows updater tests failed' }

      - name: Upload Windows native cache engine test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-cache-engine-tests-arm64
          path: artifacts/windows-native-cache-tests/
          if-no-files-found: error

      - name: Set up Go for Windows lifecycle
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: shorebird-server/go.sum

      - name: Verify native ARM64 engine and SDK machine types
        run: |
          "$NATIVE_PYTHON" scripts/verify_native_desktop_arch.py --platform windows --arch arm64 --require-native-host \
            --binary flutter/engine/src/out/windows_release_arm64/dart-sdk/bin/dart.exe \
            --binary flutter/engine/src/out/windows_release_arm64/flutter_windows.dll \
            --build-tool "$NATIVE_BUILD_LINKER" --build-tool "$(command -v python3)" \
            --build-tool flutter/engine/src/flutter/third_party/gn/gn.exe \
            --build-tool flutter/engine/src/flutter/buildtools/windows-x64/clang/bin/clang-cl.exe

      - name: Restore verified Flutter version tag for lifecycle
        shell: bash
        run: python3 scripts/prepare_flutter_version_tag.py flutter

      - name: Prepare Windows encrypted lifecycle tools
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'flutter/engine/src/out/windows_release_arm64'
          Expand-Archive -LiteralPath "$out/zip_archives/flutter_patched_sdk_product.zip" -DestinationPath $out -Force
          # Flutter's local snapshotter lookup searches the output root.
          Copy-Item "$out/gen_snapshot/gen_snapshot.exe" "$out/gen_snapshot.exe" -Force
          $cache = Join-Path $env:GITHUB_WORKSPACE 'flutter/bin/cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          if (Test-Path "$cache/dart-sdk") { Remove-Item -Recurse -Force "$cache/dart-sdk" }
          Copy-Item "$out/dart-sdk" "$cache/dart-sdk" -Recurse
          $env:PUB_CACHE = Join-Path $env:RUNNER_TEMP 'shorebird-lifecycle-pub'
          "PUB_CACHE=$env:PUB_CACHE" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          foreach ($project in @('shorebird', 'flutter/packages/flutter_tools')) {
            Push-Location (Join-Path $env:GITHUB_WORKSPACE $project)
            try {
              & "$out/dart-sdk/bin/dart.exe" pub get
              if ($LASTEXITCODE) { throw "Lifecycle dependency resolution failed: $project" }
            } finally { Pop-Location }
          }
          Push-Location updater
          try {
            cargo build --release --locked -p patch --bin patch
            if ($LASTEXITCODE) { throw 'Windows public patch tool build failed' }
          } finally { Pop-Location }

      - name: Run Windows DPAPI provider contract
        shell: pwsh
        run: |
          $fixture = (Resolve-Path testapps/license_flavor_patch_test/tool/windows_native).Path
          $public = (Resolve-Path flutter/engine/src/out/windows_release_arm64).Path
          $build = Join-Path $env:RUNNER_TEMP ("shorebird-native-probe-" + [guid]::NewGuid())
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-native-provider-tests'
          New-Item -ItemType Directory $build | Out-Null
          New-Item -ItemType Directory -Force $results | Out-Null
          Push-Location $build
          try {
            cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /I"$public" "$fixture/native_cache_contract_test.cpp" /Fe:native_cache_contract_test.exe /link winhttp.lib crypt32.lib bcrypt.lib 2>&1 | Tee-Object "$results/build.log"
            if ($LASTEXITCODE) { throw 'Native provider probe compilation failed' }
            & $env:NATIVE_PYTHON "$env:GITHUB_WORKSPACE/scripts/verify_native_desktop_arch.py" --platform windows --arch arm64 --require-native-host --binary "$build/native_cache_contract_test.exe"
            if ($LASTEXITCODE) { throw 'Windows ARM64 native provider probe machine mismatch' }
            & ./native_cache_contract_test.exe 2>&1 | Tee-Object "$results/test.log"
            if ($LASTEXITCODE) { throw 'Native provider probe failed' }
          } finally {
            Pop-Location
            Remove-Item -Recurse -Force $build
          }

      - name: Run Windows encrypted native lifecycle
        shell: pwsh
        timeout-minutes: 75
        run: |
          $engine = Join-Path $env:GITHUB_WORKSPACE 'flutter/engine/src'
          $out = Join-Path $engine 'out/windows_release_arm64'
          $work = Join-Path $env:RUNNER_TEMP ("shorebird-native-e2e-" + [guid]::NewGuid())
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-native-cache-e2e'
          & $env:NATIVE_PYTHON testapps/license_flavor_patch_test/tool/windows_native_cache_e2e.py run --execute --arch arm64 --engine-src $engine --host-engine windows_release_arm64 --target-engine windows_release_arm64 --tooling-dart "$out/dart-sdk/bin/dart.exe" --patch-tool "$env:GITHUB_WORKSPACE/updater/target/release/patch.exe" --pub-cache $env:PUB_CACHE --work $work --results $results
          if ($LASTEXITCODE) { throw 'Windows encrypted native lifecycle failed' }
          & $env:NATIVE_PYTHON scripts/verify_native_desktop_arch.py --platform windows --arch arm64 --require-native-host --lifecycle-report "$results/results.json"
          if ($LASTEXITCODE) { throw 'Windows ARM64 lifecycle receipt inventory failed' }
          $report = Get-Content "$results/results.json" -Raw | ConvertFrom-Json
          if ($report.target_arch -ne 'arm64' -or $report.runtime_arch -ne 'aarch64') { throw 'ARM64 native lifecycle architecture evidence is missing' }
          if ($report.schema -ne 'windows-native-cache-e2e-v1' -or $report.result -ne 'passed' -or $report.cleanup -ne 'owned processes, ports, disposable app cache, private session removed') {
            throw 'Windows lifecycle did not produce a passing cleaned execution report'
          }

      - name: Upload Windows native provider test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-provider-tests-arm64
          path: artifacts/windows-native-provider-tests/
          if-no-files-found: error

      - name: Upload Windows encrypted lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-cache-e2e-arm64
          path: artifacts/windows-native-cache-e2e/results.json
          if-no-files-found: error

      - name: Run Windows native V2 variant lifecycle
        shell: pwsh
        timeout-minutes: 90
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = Join-Path $env:GITHUB_WORKSPACE 'flutter/engine/src'
          $out = Join-Path $engine 'out/windows_release_arm64'
          $work = Join-Path $env:RUNNER_TEMP ("shorebird-variant-e2e-" + [guid]::NewGuid())
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-native-variant-e2e'
          & $env:NATIVE_PYTHON testapps/license_flavor_patch_test/tool/windows_variant_e2e.py run --execute --arch arm64 --engine-src $engine --host-engine windows_release_arm64 --target-engine windows_release_arm64 --tooling-dart "$out/dart-sdk/bin/dart.exe" --patch-tool "$env:GITHUB_WORKSPACE/updater/target/release/patch.exe" --pub-cache $env:PUB_CACHE --work $work --results $results 2>&1 | Tee-Object "$results.log"
          if ($LASTEXITCODE) { throw 'Windows native V2 variant lifecycle failed' }
          $validate = @'
          import json, sys
          report_path, platform, arch = sys.argv[1:]
          report = json.load(open(report_path))
          runtime_arch = {'x64': 'x86_64', 'arm64': 'aarch64'}[arch]
          if (report.get('schema') != 'native-variant-e2e-v2' or
              report.get('result') != 'passed' or report.get('runtime_acceptance') is not True or
              report.get('platform') != platform or report.get('target_arch') != arch or
              report.get('runtime_arch') != runtime_arch or
              report.get('cleanup') != 'owned platform processes, services, private work, app cache and provider keys removed'):
              raise SystemExit('Native V2 lifecycle requires real cleaned execution on the selected platform and architecture')
          machines = report.get('binary_architectures', {})
          if not machines or any(value.get('architecture') != arch or value.get('native_target') is not True for value in machines.values()):
              raise SystemExit('Native V2 binary architecture receipts are incomplete')
          required = {
              'actual-cli-staged-native-scope', 'actual-cli-release-free',
              'actual-cli-patch-pro_seed', 'actual-cli-patch-pro', 'actual-cli-patch-enterprise',
              'initial-free-public-installation', 'same-content-higher-epoch', 'same-content-cold-adoption',
              'offline-missing-key-free', 'offline-missing-key-recovery-pro',
              'offline-wrong-key-free', 'offline-wrong-key-recovery-pro',
              'released-bundle-unchanged', 'native-v2-final-cache',
          }
          previous = 'free'
          for index, variant in enumerate(('pro', 'enterprise', 'pro', 'free', 'enterprise', 'free')):
              required.update((f'online-{index}-{previous}-accept-{variant}', f'offline-cold-{index}-{variant}'))
              previous = variant
          adversarial_required = {
              'adversarial-select-pro-check',
              'adversarial-select-pro-cold',
              'owned-ciphertext-flip',
              'ciphertext-offline-free',
              'ciphertext-signed-free-check',
              'ciphertext-signed-free-cold',
              'ciphertext-same-pro-redownload-check',
              'ciphertext-same-pro-redownload-cold',
              'ciphertext-real-redownload',
              'untrusted-cached-signature-flip',
              'cached-signature-still-valid-pro',
              'server-returned-old-response-capture',
              'actual-leased-pro-check',
              'actual-leased-pro-cold',
              'platform-clock-expired-free',
              'platform-lease-expiry',
              'old-signed-response-rejected',
              'old-signed-response-requests',
              'corrupt-stale-response-combined-rejected',
              'corrupt-stale-response-combined-requests',
              'expired-server-signed-free',
              'expired-server-free-cold',
              'before-enterprise-rollback-check',
              'before-enterprise-rollback-cold',
              'rollback-enterprise',
              'rollback-server-signed-free',
              'rollback-cold-free',
              'rollforward-enterprise',
              'rollforward-alone-still-free',
              'rollforward-cold-free',
              'explicit-enterprise-restored-check',
              'explicit-enterprise-restored-cold',
              'adversarial-final-signed-free-check',
              'adversarial-final-signed-free-cold',
              'adversarial-final-offline-free',
          }
          required.update(adversarial_required)
          expected_cases = (
              'owned-ciphertext-offline-content-unavailable',
              'signed-free-same-pro-real-redownload',
              'cached-signature-keeps-valid-pro',
              'actual-paid-lease-platform-clock-expiry',
              'server-returned-older-response-rejected-independent-nonce',
              'corrupt-stale-response-combined-rejection',
              'enterprise-rollback-signed-free',
              'rollforward-alone-stays-free',
              'explicit-enterprise-reauthorization',
              'final-offline-free',
          )
          if report.get('adversarial_cases') != list(expected_cases):
              raise SystemExit('Native V2 adversarial case completion is missing or changed')
          if not required.issubset({stage['name'] for stage in report.get('stages', [])}):
              raise SystemExit('Native V2 lifecycle publication, grants, fallback, data and cold-boot evidence is incomplete')
          if report.get('provisioning', {}).get('accepted', 0) < 1 or not report.get('final_application_data'):
              raise SystemExit('Native V2 lifecycle authenticated delivery or application data proof is missing')
          stages = {stage['name']: stage.get('evidence', {}) for stage in report['stages']}
          if stages['ciphertext-real-redownload'].get('check_status') != 'outdated':
              raise SystemExit('Native V2 ciphertext recovery did not execute a real public download')
          import math
          lease = stages['platform-lease-expiry']
          if (any(type(lease.get(field)) not in (int, float) or not math.isfinite(lease[field]) for field in ('deadline', 'wait_completed', 'launch_started')) or
              lease['wait_completed'] <= lease['deadline'] or lease['launch_started'] <= lease['deadline']):
              raise SystemExit('Native V2 expiry lacks an observed platform clock boundary')
          for label in ('old-signed-response', 'corrupt-stale-response-combined'):
              delivered = stages[label + '-requests']
              checks = delivered.get('requests')
              if (type(delivered.get('delivered_check_responses')) is not int or delivered['delivered_check_responses'] < 1 or
                  not isinstance(checks, list) or len(checks) != delivered['delivered_check_responses'] or
                  delivered.get('real_api_and_provisioning_stopped') is not True):
                  raise SystemExit('Native V2 rejection lacks successful owned replay delivery with real services stopped')
          '@
          & $env:NATIVE_PYTHON -c $validate "$results/results.json" windows arm64
          if ($LASTEXITCODE) { throw 'Windows native V2 variant execution receipt failed' }

      - name: Upload Windows native V2 variant lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-variant-e2e-arm64
          path: |
            artifacts/windows-native-variant-e2e/
            artifacts/windows-native-variant-e2e.log
          if-no-files-found: error

      - name: Package Windows engine artifacts
        run: |
          set -euo pipefail
          out=flutter/engine/src/out/windows_release_arm64
          mkdir -p artifacts/windows-engine
          cp "$out/args.gn" artifacts/windows-engine/windows_release_arm64.args.gn
          cp "$out/zip_archives/windows-arm64-release/windows-arm64-flutter.zip" artifacts/windows-engine/
          engine_revision="$(cat flutter/bin/internal/engine.version)"
          mirror_root="artifacts/windows-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/windows-arm64-release"
          mkdir -p "$mirror_root"
          cp artifacts/windows-engine/windows-arm64-flutter.zip "$mirror_root/windows-arm64-flutter.zip"
          test -f "$mirror_root/windows-arm64-flutter.zip"
          font_zip="$out/zip_archives/windows-arm64/font-subset.zip"
          cp "$font_zip" artifacts/windows-engine/font-subset.zip
          font_mirror="artifacts/windows-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/windows-arm64"
          mkdir -p "$font_mirror"
          cp "$font_zip" "$font_mirror/font-subset.zip"
          test -f "$font_mirror/font-subset.zip"
          font_smoke_dir="$(mktemp -d)"
          font_dart="$(find "$out" -maxdepth 3 -type f -name dartvm.exe -print -quit)"
          test -n "$font_dart"
          "$NATIVE_PYTHON" - artifacts/windows-engine/font-subset.zip "$font_smoke_dir" "$font_dart" <<'PYFONT'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import zipfile

          archive_path, work, dart = map(Path, sys.argv[1:])
          executable = "font-subset.exe" if os.name == "nt" else "font-subset"
          with zipfile.ZipFile(archive_path) as archive:
              for name in (executable, "const_finder.dart.snapshot"):
                  if archive.getinfo(name).file_size == 0:
                      raise SystemExit(f"empty font tool: {name}")
              archive.extractall(work)
          binary = work / executable
          binary.chmod(0o755)
          source_font = Path("flutter/engine/src/flutter/txt/third_party/fonts/Roboto-Regular.ttf").resolve()
          output_font = (work / "subset.ttf").resolve()
          subprocess.run([str(binary.resolve()), str(output_font), str(source_font)],
                         input="65 66\n", text=True, check=True)
          if not 0 < output_font.stat().st_size < source_font.stat().st_size:
              raise SystemExit("font subset did not produce a smaller non-empty font")
          subprocess.run([str(dart.resolve()), str((work / "const_finder.dart.snapshot").resolve()),
                          "--kernel-file=unused.dill", "--class-library-uri=package:unused", "--class-name=Unused", "--help"],
                         check=True, stdout=subprocess.DEVNULL)
          PYFONT
          cat > artifacts/windows-engine/manifest.json <<EOF
          {
            "name": "windows-engine-arm64",
            "git_sha": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "engine_revision": "${engine_revision}",
            "target_os": "windows",
            "target_arch": "arm64",
            "dart_dynamic_modules": false,
            "dart_enable_aot_patching": true,
            "dart_enable_shorebird_interpreter": false,
            "shorebird_enable_aot_patching": true,
            "shorebird_use_interpreter": false,
            "included": [
              "font-subset.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/windows-arm64/font-subset.zip",
              "windows_release_arm64.args.gn",
              "windows-arm64-flutter.zip",
              "mirror/shorebird/flutter_infra_release/flutter/${engine_revision}/windows-arm64-release/windows-arm64-flutter.zip"
            ]
          }
          EOF
          tar -C artifacts -czf windows-engine-arm64.tar.gz windows-engine
          engine_extract_dir="$(mktemp -d)"
          tar -C "$engine_extract_dir" -xzf windows-engine-arm64.tar.gz
          test -f "$engine_extract_dir/windows-engine/manifest.json"
          test -f "$engine_extract_dir/windows-engine/font-subset.zip"
          test -f "$engine_extract_dir/windows-engine/windows_release_arm64.args.gn"
          test -f "$engine_extract_dir/windows-engine/mirror/shorebird/flutter_infra_release/flutter/$engine_revision/windows-arm64-release/windows-arm64-flutter.zip"
          "$NATIVE_PYTHON" - "$engine_extract_dir/windows-engine/windows-arm64-flutter.zip" <<'PYZIP'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              required = {"flutter_windows.dll", "flutter_windows.dll.lib", "gen_snapshot.exe", "flutter_windows.h"}
              missing = required - set(archive.namelist())
              if missing:
                  raise SystemExit(f"missing Windows engine files: {sorted(missing)}")
          PYZIP
          unzip -q "$engine_extract_dir/windows-engine/windows-arm64-flutter.zip" -d "$engine_extract_dir/windows-tools"
          "$engine_extract_dir/windows-tools/gen_snapshot.exe" --version
          "$NATIVE_PYTHON" - "$engine_extract_dir/windows-tools/flutter_windows.dll" <<'PYDLL'
          import ctypes
          import sys

          library = ctypes.WinDLL(sys.argv[1])
          getattr(library, "shorebird_set_patch_decryption_key_provider")
          PYDLL
          ./scripts/write_sha256.sh windows-engine-arm64.tar.gz windows-engine-arm64.tar.gz.sha256

      - name: Upload Windows engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-engine-arm64
          path: |
            windows-engine-arm64.tar.gz
            windows-engine-arm64.tar.gz.sha256
          if-no-files-found: error

  artifact-mirror:
    name: Assemble publishable artifact mirror
    needs:
      - source-checks
      - cli-artifacts
      - server-artifacts
      - custom-dart-sdk
      - custom-dart-sdk-macos
      - custom-dart-sdk-macos-x64
      - linux-engine
      - android-engine
      - android-host-tools
      - ios-engine
      - macos-engine
      - macos-engine-universal
      - windows-engine
      - custom-dart-sdk-windows
      - custom-dart-sdk-linux-arm64
      - custom-dart-sdk-windows-arm64
      - linux-engine-arm64
      - windows-engine-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_sdk_build }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free Ubuntu assembly runner disk
        run: ./scripts/free_ci_disk_linux.sh

      - name: Download mirror patch and metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mirror-*
          path: downloaded-artifacts
          merge-multiple: false

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: downloaded-artifacts
          merge-multiple: false

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shorebird-server-*
          path: downloaded-artifacts
          merge-multiple: false

      - name: Download Linux Dart SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-linux-x64
          path: downloaded-artifacts/custom-dart-sdk-linux-x64

      - name: Download macOS Dart SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-macos-arm64
          path: downloaded-artifacts/custom-dart-sdk-macos-arm64

      - name: Download custom-dart-sdk-macos-x64
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-macos-x64
          path: downloaded-artifacts/custom-dart-sdk-macos-x64

      - name: Download Linux engine mirror artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-engine-x64
          path: downloaded-artifacts/linux-engine-x64

      - name: Download Android engine mirror artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-engine-arm64
          path: downloaded-artifacts/android-engine-arm64

      - name: Download android-engine-x64
        uses: actions/download-artifact@v4
        with:
          name: android-engine-x64
          path: downloaded-artifacts/android-engine-x64

      - name: Download android-engine-arm
        uses: actions/download-artifact@v4
        with:
          name: android-engine-arm
          path: downloaded-artifacts/android-engine-arm

      - name: Download iOS engine mirror artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-interpreter-engine
          path: downloaded-artifacts/ios-interpreter-engine

      - name: Download macOS engine mirror artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-engine-arm64
          path: downloaded-artifacts/macos-engine-arm64

      - name: Download macos-engine-x64
        uses: actions/download-artifact@v4
        with:
          name: macos-engine-x64
          path: downloaded-artifacts/macos-engine-x64

      - name: Download custom-dart-sdk-windows-x64
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-windows-x64
          path: downloaded-artifacts/custom-dart-sdk-windows-x64

      - name: Download windows-engine-x64
        uses: actions/download-artifact@v4
        with:
          name: windows-engine-x64
          path: downloaded-artifacts/windows-engine-x64

      - name: Download Android host snapshotters
        uses: actions/download-artifact@v4
        with:
          pattern: android-host-tools-*
          path: downloaded-artifacts
          merge-multiple: false

      - name: Download universal macOS engine
        uses: actions/download-artifact@v4
        with:
          name: macos-engine-universal
          path: downloaded-artifacts/macos-engine-universal

      - name: Download custom-dart-sdk-linux-arm64
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-linux-arm64
          path: downloaded-artifacts/custom-dart-sdk-linux-arm64

      - name: Download custom-dart-sdk-windows-arm64
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-windows-arm64
          path: downloaded-artifacts/custom-dart-sdk-windows-arm64

      - name: Download linux-engine-arm64
        uses: actions/download-artifact@v4
        with:
          name: linux-engine-arm64
          path: downloaded-artifacts/linux-engine-arm64

      - name: Download windows-engine-arm64
        uses: actions/download-artifact@v4
        with:
          name: windows-engine-arm64
          path: downloaded-artifacts/windows-engine-arm64

      - name: Assemble mirror
        run: |
          set -euo pipefail
          rm -rf artifacts/open-shorebird-artifact-mirror
          mkdir -p artifacts
          rm -rf mirror-input
          mkdir -p mirror-input
          cp -al downloaded-artifacts/mirror-* mirror-input/
          cp -al downloaded-artifacts/linux-engine-arm64 mirror-input/
          cp -al downloaded-artifacts/linux-engine-x64 mirror-input/
          cp -al downloaded-artifacts/windows-engine-arm64 mirror-input/
          cp -al downloaded-artifacts/windows-engine-x64 mirror-input/
          cp -al downloaded-artifacts/android-engine-arm64 mirror-input/
          cp -al downloaded-artifacts/android-host-tools-* mirror-input/
          cp -al downloaded-artifacts/android-engine-x64 mirror-input/
          cp -al downloaded-artifacts/android-engine-arm mirror-input/
          cp -al downloaded-artifacts/ios-interpreter-engine mirror-input/
          cp -al downloaded-artifacts/macos-engine-arm64 mirror-input/
          cp -al downloaded-artifacts/macos-engine-universal mirror-input/
          cp -al downloaded-artifacts/macos-engine-x64 mirror-input/
          engine_revision="$(cat flutter/bin/internal/engine.version)"
          sdk_mirror="mirror-input/shorebird/flutter_infra_release/flutter/$engine_revision"
          mkdir -p "$sdk_mirror"
          cp downloaded-artifacts/custom-dart-sdk-linux-x64/dart-sdk-linux-x64.zip* "$sdk_mirror/"
          cp downloaded-artifacts/custom-dart-sdk-linux-arm64/dart-sdk-linux-arm64.zip* "$sdk_mirror/"
          test -f "$sdk_mirror/dart-sdk-linux-arm64.zip"
          cp downloaded-artifacts/custom-dart-sdk-macos-arm64/dart-sdk-darwin-arm64.zip* "$sdk_mirror/"
          cp downloaded-artifacts/custom-dart-sdk-macos-x64/dart-sdk-darwin-x64.zip* "$sdk_mirror/"
          cp downloaded-artifacts/custom-dart-sdk-windows-x64/dart-sdk-windows-x64.zip* "$sdk_mirror/"
          cp downloaded-artifacts/custom-dart-sdk-windows-arm64/dart-sdk-windows-arm64.zip* "$sdk_mirror/"
          test -f "$sdk_mirror/dart-sdk-windows-arm64.zip"
          test -f "$sdk_mirror/dart-sdk-windows-x64.zip"
          test -f "$sdk_mirror/dart-sdk-linux-x64.zip"
          test -f "$sdk_mirror/dart-sdk-darwin-arm64.zip"
          test -f "$sdk_mirror/dart-sdk-darwin-x64.zip"
          ./scripts/assemble_artifact_mirror.sh \
            mirror-input \
            artifacts/open-shorebird-artifact-mirror

          tar -C artifacts -czf open-shorebird-artifact-mirror.tar.gz open-shorebird-artifact-mirror
          mirror_extract_dir="$(mktemp -d)"
          python3 scripts/safe_extract_tar.py open-shorebird-artifact-mirror.tar.gz "$mirror_extract_dir"
          python3 scripts/validate_artifact_mirror.py "$mirror_extract_dir/open-shorebird-artifact-mirror"
          test -d "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird"
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/artifacts_manifest.yaml' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/patch-linux-x64.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/patch-linux-arm64.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/patch-darwin-x64.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/patch-darwin-arm64.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/patch-windows-x64.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/patch-windows-arm64.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/android-arm64-release/artifacts.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/android-arm64-release/symbols.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/linux-x64-release/artifacts.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/linux-x64-release/linux-x64-flutter-gtk.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/ios-release/artifacts.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/darwin-arm64-release/FlutterMacOS.framework.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/flutter_patched_sdk_product.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/android-arm-release/artifacts.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/android-arm-release/symbols.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/android-x64-release/artifacts.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/android-x64-release/symbols.zip' -type f -print -quit | grep -q .
          find "$mirror_extract_dir/open-shorebird-artifact-mirror/shorebird" -path '*/darwin-x64-release/FlutterMacOS.framework.zip' -type f -print -quit | grep -q .
          ./scripts/write_sha256.sh \
            open-shorebird-artifact-mirror.tar.gz \
            open-shorebird-artifact-mirror.tar.gz.sha256
          manifest_input="$(mktemp -d)"
          cp -al downloaded-artifacts/. "$manifest_input/"
          mkdir -p "$manifest_input/open-shorebird-artifact-mirror"
          cp open-shorebird-artifact-mirror.tar.gz "$manifest_input/open-shorebird-artifact-mirror/"
          cp open-shorebird-artifact-mirror.tar.gz.sha256 "$manifest_input/open-shorebird-artifact-mirror/"
          python3 scripts/write_release_manifest.py \
            "$manifest_input" \
            --github-sha "${{ github.sha }}" \
            --require 'cli-linux-x64/*open-shorebird-cli-linux-x64.tar.gz' \
            --require 'cli-linux-arm64/*open-shorebird-cli-linux-arm64.tar.gz' \
            --require 'cli-macos-x64/*open-shorebird-cli-macos-x64.tar.gz' \
            --require 'cli-macos-arm64/*open-shorebird-cli-macos-arm64.tar.gz' \
            --require 'cli-windows-x64/*open-shorebird-cli-windows-x64.tar.gz' \
            --require 'cli-windows-arm64/*open-shorebird-cli-windows-arm64.tar.gz' \
            --require 'shorebird-server-linux-amd64/*shorebird-server-linux-amd64.tar.gz' \
            --require 'shorebird-server-linux-arm64/*shorebird-server-linux-arm64.tar.gz' \
            --require 'shorebird-server-darwin-amd64/*shorebird-server-darwin-amd64.tar.gz' \
            --require 'shorebird-server-darwin-arm64/*shorebird-server-darwin-arm64.tar.gz' \
            --require 'shorebird-server-windows-amd64/*shorebird-server-windows-amd64.tar.gz' \
            --require 'custom-dart-sdk-linux-x64/*custom-dart-sdk-linux-x64.tar.gz' \
            --require 'custom-dart-sdk-linux-arm64/*custom-dart-sdk-linux-arm64.tar.gz' \
            --require 'custom-dart-sdk-macos-arm64/*custom-dart-sdk-macos-arm64.tar.gz' \
            --require 'custom-dart-sdk-macos-x64/*custom-dart-sdk-macos-x64.tar.gz' \
            --require 'custom-dart-sdk-windows-x64/*custom-dart-sdk-windows-x64.tar.gz' \
            --require 'custom-dart-sdk-windows-arm64/*custom-dart-sdk-windows-arm64.tar.gz' \
            --require 'windows-engine-x64/*windows-engine-x64.tar.gz' \
            --require 'windows-engine-arm64/*windows-engine-arm64.tar.gz' \
            --require 'linux-engine-x64/*linux-engine-x64.tar.gz' \
            --require 'linux-engine-arm64/*linux-engine-arm64.tar.gz' \
            --require 'android-engine-arm64/*android-engine-arm64.tar.gz' \
            --require 'android-engine-x64/*android-engine-x64.tar.gz' \
            --require 'android-engine-arm/*android-engine-arm.tar.gz' \
            --require 'android-host-tools-darwin-x64-arm/*android-host-tools-darwin-x64-arm.tar.gz' \
            --require 'android-host-tools-darwin-x64-arm64/*android-host-tools-darwin-x64-arm64.tar.gz' \
            --require 'android-host-tools-darwin-x64-x64/*android-host-tools-darwin-x64-x64.tar.gz' \
            --require 'android-host-tools-windows-x64-arm/*android-host-tools-windows-x64-arm.tar.gz' \
            --require 'android-host-tools-windows-x64-arm64/*android-host-tools-windows-x64-arm64.tar.gz' \
            --require 'android-host-tools-windows-x64-x64/*android-host-tools-windows-x64-x64.tar.gz' \
            --require 'ios-interpreter-engine/*ios-interpreter-engine.tar.gz' \
            --require 'macos-engine-arm64/*macos-engine-arm64.tar.gz' \
            --require 'macos-engine-x64/*macos-engine-x64.tar.gz' \
            --require 'macos-engine-universal/*macos-engine-universal.tar.gz' \
            --require 'mirror-patch-linux-x64.zip/*patch-linux-x64.zip' \
            --require 'mirror-patch-linux-arm64.zip/*patch-linux-arm64.zip' \
            --require 'mirror-patch-darwin-x64.zip/*patch-darwin-x64.zip' \
            --require 'mirror-patch-darwin-arm64.zip/*patch-darwin-arm64.zip' \
            --require 'mirror-patch-windows-x64.zip/*patch-windows-x64.zip' \
            --require 'mirror-patch-windows-arm64.zip/*patch-windows-arm64.zip' \
            --require 'mirror-metadata/*artifacts_manifest.yaml' \
            --require 'open-shorebird-artifact-mirror/*open-shorebird-artifact-mirror.tar.gz' \
            --output open-shorebird-release-manifest.json
          python3 scripts/validate_release_manifest.py \
            "$manifest_input" \
            open-shorebird-release-manifest.json
          ./scripts/write_sha256.sh \
            open-shorebird-release-manifest.json \
            open-shorebird-release-manifest.json.sha256

      - name: Upload assembled artifact mirror
        uses: actions/upload-artifact@v4
        with:
          name: open-shorebird-artifact-mirror
          path: |
            open-shorebird-artifact-mirror.tar.gz
            open-shorebird-artifact-mirror.tar.gz.sha256
          if-no-files-found: error

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: open-shorebird-release-manifest
          path: |
            open-shorebird-release-manifest.json
            open-shorebird-release-manifest.json.sha256
          if-no-files-found: error

  publish-sdk-release:
    name: Publish tested Dart SDK release
    needs: [source-checks, artifact-mirror]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Download Linux Dart SDK release asset
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-linux-x64
          path: downloaded-artifacts/custom-dart-sdk-linux-x64

      - name: Download macOS Dart SDK release asset
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-macos-arm64
          path: downloaded-artifacts/custom-dart-sdk-macos-arm64

      - name: Download custom-dart-sdk-macos-x64
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-macos-x64
          path: downloaded-artifacts/custom-dart-sdk-macos-x64

      - name: Download Windows Dart SDK release asset
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-windows-x64
          path: downloaded-artifacts/custom-dart-sdk-windows-x64

      - name: Download custom-dart-sdk-linux-arm64
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-linux-arm64
          path: downloaded-artifacts/custom-dart-sdk-linux-arm64

      - name: Download custom-dart-sdk-windows-arm64
        uses: actions/download-artifact@v4
        with:
          name: custom-dart-sdk-windows-arm64
          path: downloaded-artifacts/custom-dart-sdk-windows-arm64

      - name: Verify release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for asset in \
            dart-sdk-linux-arm64.zip \
            dart-sdk-linux-x64.zip \
            dart-sdk-darwin-arm64.zip \
            dart-sdk-darwin-x64.zip \
            dart-sdk-windows-arm64.zip \
            dart-sdk-windows-x64.zip; do
            source_path="$(find downloaded-artifacts -type f -name "$asset" -print -quit)"
            sidecar_path="$(find downloaded-artifacts -type f -name "$asset.sha256" -print -quit)"
            test -n "$source_path"
            test -n "$sidecar_path"
            expected_digest="$(cut -d ' ' -f 1 "$sidecar_path")"
            actual_digest="$(sha256sum "$source_path" | cut -d ' ' -f 1)"
            test "$actual_digest" = "$expected_digest"
            unzip -tq "$source_path"
            cp "$source_path" "release-assets/$asset"
            cp "$sidecar_path" "release-assets/$asset.sha256"
          done

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          release_version="$(tr -d '[:space:]' < VERSION)"
          test -n "$release_version"
          release_tag="v$release_version"
          release_title="Open Shorebird $release_version"
          release_notes="Synchronized with upstream Shorebird v${release_version} and tested by Open Shorebird CI run ${GITHUB_RUN_ID} for commit ${GITHUB_SHA}."
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes "$release_notes" \
              --latest
          else
            gh release create "$release_tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "$release_notes" \
              --latest
          fi

      - name: Verify latest release downloads
        run: |
          set -euo pipefail
          for asset in \
            dart-sdk-linux-arm64.zip \
            dart-sdk-linux-x64.zip \
            dart-sdk-darwin-arm64.zip \
            dart-sdk-darwin-x64.zip \
            dart-sdk-windows-arm64.zip \
            dart-sdk-windows-x64.zip; do
            curl -fL --retry 5 --retry-all-errors \
              "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$asset" \
              -o "/tmp/$asset"
            cmp "/tmp/$asset" "release-assets/$asset"
          done

  linux-runtime-smoke:
    name: Linux runtime patch smoke
    needs: source-checks
    runs-on: ${{ inputs.linux_runtime_runner || 'self-hosted' }}
    timeout-minutes: 120
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_runtime_smokes }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          clean: false

      - name: Verify provisioned Linux engine
        run: |
          test -x flutter/bin/flutter
          test -d flutter/engine/src/out/linux_release_x64

      - name: Run Linux runtime patch smoke
        run: ./scripts/linux_runtime_patch_smoke.sh

  android-runtime-smoke:
    name: Android runtime patch smoke
    needs: source-checks
    runs-on: ${{ inputs.android_runtime_runner || 'self-hosted' }}
    timeout-minutes: 120
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_runtime_smokes }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          clean: false

      - name: Verify provisioned Android engine and target
        run: |
          java -version
          test -x flutter/bin/flutter
          test -d flutter/engine/src/out/android_release_arm64
          test -d flutter/engine/src/out/host_release_arm64
          adb devices -l

      - name: Run Android runtime patch smoke
        env:
          ANDROID_SERIAL: ${{ inputs.android_serial }}
        run: ./scripts/android_runtime_patch_smoke.sh
