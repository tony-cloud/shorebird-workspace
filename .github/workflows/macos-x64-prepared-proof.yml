name: Native Intel prepared SDK FFI proof

on:
  push:
    branches:
      - 'tonycloud/intel-proof-discovery-20261102'
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact authenticated temporary draft release ID
        type: string
        required: true
      asset_id:
        description: Exact macos-x64-prepared-proof.zip asset ID in that draft
        type: string
        required: true
      asset_sha256:
        description: Independently pinned SHA-256 of the signed prepared ZIP
        type: string
        required: true
      sdk_source_commit:
        description: Full SDK commit matching this workspace commit's gitlink
        type: string
        required: true
      certificate_sha1:
        description: Uppercase SHA-1 fingerprint of the local Developer ID certificate
        type: string
        required: true

permissions:
  contents: read

jobs:
  register-workflow:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/tonycloud/intel-proof-discovery-20261102' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Register workflow path only
        shell: bash
        run: printf '%s\n' 'Workflow discovery only; no PRODUCT execution.'

  native-intel-proof:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Execute strict prepared PRODUCT suites on native Intel
    # Draft reads require push visibility; payload execution receives no token.
    permissions:
      contents: write
    runs-on: macos-15-intel
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout original prepared proof source
        uses: actions/checkout@v4
        with:
          ref: 1086bd0bb0061efe39bcebbf603fc5091d0f9d40
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Checkout matching SDK source
        run: git submodule update --init --depth 1 dart-sdk

      - name: Set up native Intel Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Verify transport controls and exact source
        env:
          SDK_COMMIT: ${{ inputs.sdk_source_commit }}
        run: |
          set -euo pipefail
          python3 scripts/test_macos_x64_proof_transport.py -v
          python3 scripts/macos_x64_proof_transport.py verify-source --workspace "$GITHUB_WORKSPACE" --sdk-commit "$SDK_COMMIT" --evidence "$GITHUB_WORKSPACE/artifacts/native-intel-prepared-proof"

      - name: Download exact authenticated unpublished draft asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_ID: ${{ inputs.asset_id }}
          ASSET_SHA256: ${{ inputs.asset_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/native-intel-prepared-proof"
          python3 - <<'PYDOWNLOAD'
          import hashlib, json, os, runpy, sys, urllib.error
          from pathlib import Path
          evidence = Path(os.environ['GITHUB_WORKSPACE']) / 'artifacts/native-intel-prepared-proof'
          (evidence / 'workflow-source.json').write_text(json.dumps({
              'workflow_commit': os.environ['GITHUB_SHA'],
              'proof_source_commit': '1086bd0bb0061efe39bcebbf603fc5091d0f9d40',
              'download_job_permission': 'contents:write',
              'prepared_payload_published': False}) + '\n')
          sys.argv = ['scripts/macos_x64_proof_transport.py', 'download',
              '--repo', os.environ['GITHUB_REPOSITORY'], '--release-id', os.environ['RELEASE_ID'],
              '--asset-id', os.environ['ASSET_ID'], '--sha256', os.environ['ASSET_SHA256'],
              '--output', os.environ['RUNNER_TEMP'] + '/macos-x64-prepared-proof.zip',
              '--evidence', str(evidence)]
          try:
              runpy.run_path(sys.argv[0], run_name='__main__')
          except urllib.error.HTTPError as error:
              body = error.read(16384)
              try:
                  message = json.loads(body).get('message', '')
              except (ValueError, AttributeError):
                  message = ''
              category = ('integration_permission' if message == 'Resource not accessible by integration'
                  else 'rate_limit' if isinstance(message, str) and 'rate limit' in message.lower()
                  else 'unclassified_http_error')
              headers = {key: value for key in ('X-RateLimit-Limit', 'X-RateLimit-Remaining',
                  'X-RateLimit-Reset', 'Retry-After')
                  if (value := error.headers.get(key, '')).isdigit() and len(value) <= 20}
              report = {'status': error.code, 'category': category,
                  'headers': headers, 'bounded_body_sha256': hashlib.sha256(body).hexdigest()}
              (evidence / 'download-http-error.json').write_text(json.dumps(report) + '\n')
              print(json.dumps(report))
              raise SystemExit(1)
          PYDOWNLOAD

      - name: Execute all three prepared suites without credentials
        env:
          SDK_COMMIT: ${{ inputs.sdk_source_commit }}
          ASSET_SHA256: ${{ inputs.asset_sha256 }}
          CERTIFICATE_SHA1: ${{ inputs.certificate_sha1 }}
        run: |
          set -euo pipefail
          python3 scripts/macos_x64_proof_transport.py run \
            --workspace "$GITHUB_WORKSPACE" --sdk-commit "$SDK_COMMIT" \
            --sha256 "$ASSET_SHA256" --certificate-sha1 "$CERTIFICATE_SHA1" \
            --archive "$RUNNER_TEMP/macos-x64-prepared-proof.zip" \
            --evidence "$GITHUB_WORKSPACE/artifacts/native-intel-prepared-proof"

      - name: Remove only owned canonical proof root
        if: ${{ always() }}
        run: |
          python3 scripts/macos_x64_proof_transport.py cleanup --evidence "$GITHUB_WORKSPACE/artifacts/native-intel-prepared-proof"
          rm -f "$RUNNER_TEMP/macos-x64-prepared-proof.zip"

      - name: Upload native execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-intel-prepared-proof-${{ github.run_id }}
          path: artifacts/native-intel-prepared-proof/
          if-no-files-found: error
          retention-days: 7
